<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>2Pair · Integrated Pilot v0.1</title>
<style>
:root{color-scheme:dark;--bg:#0d0e12;--card:#15171c;--line:#2c3038;--text:#f0ece5;--muted:#a09b92;--accent:#8fc7ae;--warn:#e4bd7c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}main{width:min(100%,660px);min-height:100dvh;margin:auto;padding:18px 14px 48px}.brand{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}.note{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.center{text-align:center}h1,h2{font-weight:560;margin:0 0 10px}p{line-height:1.5;color:#c9c4bb}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.actions.center{justify-content:center}button{font:inherit;cursor:pointer}.primary,.secondary{border-radius:11px;padding:12px 16px}.primary{border:0;background:var(--accent);color:#07100c;font-weight:700}.secondary{border:1px solid #3b4049;background:#1c1f25;color:var(--text)}button:disabled{opacity:.4;cursor:not-allowed}.lang{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.consent{display:grid;gap:12px;text-align:left;margin-top:16px}.consent label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);padding:12px;border-radius:12px}.consent input{margin-top:4px}.rapid main,.rapid-shell{height:100dvh}.rapid main{padding:8px 10px}.rapid .brand,.rapid .note{display:none}.rapid-shell{display:flex;flex-direction:column;padding:10px}.rapid-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-bottom:8px}.pair-stage{display:grid;grid-template-rows:1fr 1fr;gap:8px;flex:1;min-height:0}.visual{padding:0;border:2px solid transparent;border-radius:15px;overflow:hidden;background:#0c0d10;min-height:0;touch-action:manipulation}.visual img{display:block;width:100%;height:100%;object-fit:contain}.ncc{margin-top:8px;width:100%;padding:10px;border-radius:10px;border:1px solid #3b4049;background:#1c1f25;color:#d7d2c9}.reflection-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.reflection-pair figure{margin:0;border:2px solid transparent;border-radius:12px;overflow:hidden;background:#0c0d10}.reflection-pair figure.chosen{border-color:var(--accent)}.reflection-pair img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}textarea{width:100%;min-height:86px;background:#0d0f13;color:var(--text);border:1px solid #353a43;border-radius:10px;padding:10px;font:inherit}.toggle{width:100%;margin-top:10px}.toggle.active{border-color:var(--accent);color:var(--accent)}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.scale button{min-height:48px;border:1px solid #3b4049;border-radius:10px;background:#1c1f25;color:var(--text)}.scale button.active{border-color:var(--accent);background:#213129}.trace{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.trace-item{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0c0d10}.trace-item img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block}.trace-label{padding:7px;font-size:11px;color:var(--muted);text-align:center}.error{border:1px solid #6a3439;background:#26171a;color:#efb2b8;padding:12px;border-radius:12px}.warn{color:var(--warn)}a{color:#a7d6bf}
</style>
</head>
<body>
<main><div class="brand">2Pair · Integrated Pilot v0.1</div><div class="note">Eksperimentinis savirefleksijos ir stimulus validation pilotas. Gate D/E = NONE. 6000 ms yra tik nepatvirtintas mechaninis kandidatas.</div><div id="app" class="card center"><p class="muted">Ruošiama…</p></div></main>
<script type="module" src="./app.js"></script>
</body>
</html>
