function tagLabel(tagId){
  const entry = OBSERVATION_TAG_LABELS[tagId];
  if(!entry) return tagId;
  return currentLang === 'lt' ? entry.lt : entry.en;
}

const RADAR_MIN_SESSIONS = 3;
const COMPARISON_MIN_SESSIONS = 6;

// Sesija tinkama radarui tik jei atitinka VISUS kriterijus.
// Netinkamos sesijos NIEKADA netrinamos, nemigruojamos ir lieka istorijoje —
// jos tiesiog neįtraukiamos į radaro skaičiavimą ir progreso skaitiklį.
function isSessionRadarEligible(s){
  if(s.status !== 'completed') return false;
  if(!s.session_vector || typeof s.session_vector !== 'object') return false;
  if(typeof s.valid_vector_responses !== 'number' || s.valid_vector_responses < 2) return false;
  if(typeof s.session_vector_confidence !== 'number' || !isFinite(s.session_vector_confidence)) return false;
  if(s.vector_model_version !== RADAR_MODEL_VERSION) return false;

  for(const axis of ['aw','cs','cr']){
    const v = s.session_vector[axis];
    if(typeof v !== 'number' || !isFinite(v) || v < -1 || v > 1) return false;
  }
  return true;
}

function getEligibleSessions(){
  return getCompletedSessions().filter(isSessionRadarEligible);
}

// Apskaičiuoja "dabartinį pėdsaką" — paprastą vidurkį paskutinių N eligible
// sesijų vektorių (N = RADAR_MIN_SESSIONS arba visos, jei mažiau).
// Tai NĖRA asmenybės įvertinimas — tik šios akimirkos pasirinkimų agregatas.
function computeCurrentTrace(eligibleSessions){
  if(eligibleSessions.length === 0) return null;

  const recent = eligibleSessions.slice(-RADAR_MIN_SESSIONS);
  const sum = { aw:0, cs:0, cr:0 };
  recent.forEach(s => {
    sum.aw += s.session_vector.aw;
    sum.cs += s.session_vector.cs;
    sum.cr += s.session_vector.cr;
  });
  const n = recent.length;

  return {
    aw: +(sum.aw/n).toFixed(3),
    cs: +(sum.cs/n).toFixed(3),
    cr: +(sum.cr/n).toFixed(3),
    session_count: n
  };
}

// ── PERIOD COMPARISON (F stage) ────────────────────────
// Grąžina du gretimus, nepersidengiančius trijų sesijų langus iš eligible sesijų,
// surūšiuotų pagal completed_at didėjančia tvarka. Seniausios perteklinės sesijos
// (jei eligible > 6) lieka istorijoje, bet šiame palyginime nenaudojamos.
function getComparisonWindows(eligibleSessions){
  const sorted = eligibleSessions.slice().sort((a,b) =>
    new Date(a.completed_at) - new Date(b.completed_at)
  );

  if(sorted.length < COMPARISON_MIN_SESSIONS) return null;

  const currentSessions = sorted.slice(-3);
  const previousSessions = sorted.slice(-6, -3);

  return { currentSessions, previousSessions };
}

// Vieno laikotarpio (3 sesijų) vektorius — confidence svertinis vidurkis
// per SESIJŲ session_vector_confidence (ne per atskirus cue). Tai atskira
// agregacija nuo computeCurrentTrace, kuri periodų palyginimui naudoja
// tikslią specifikacijos formulę.
function computePeriodVector(sessions){
  if(sessions.length === 0) return null;

  const confSum = sessions.reduce((sum, s) => sum + s.session_vector_confidence, 0);
  const weighted = { aw:0, cs:0, cr:0 };
  sessions.forEach(s => {
    const w = s.session_vector_confidence;
    weighted.aw += s.session_vector.aw * w;
    weighted.cs += s.session_vector.cs * w;
    weighted.cr += s.session_vector.cr * w;
  });

  const validResponses = sessions.reduce((sum, s) => sum + (s.valid_vector_responses || 0), 0);

  return {
    session_ids: sessions.map(s => s.session_id),
    vector: {
      aw: +(weighted.aw / confSum).toFixed(3),
      cs: +(weighted.cs / confSum).toFixed(3),
      cr: +(weighted.cr / confSum).toFixed(3)
    },
    session_count: sessions.length,
    valid_vector_responses: validResponses,
    confidence: +(confSum / sessions.length).toFixed(3)
  };
}

function computePeriodComparison(eligibleSessions){
  const windows = getComparisonWindows(eligibleSessions);
  if(!windows) return null;

  const previous_period = computePeriodVector(windows.previousSessions);
  const current_period = computePeriodVector(windows.currentSessions);

  const delta = {
    aw: +(current_period.vector.aw - previous_period.vector.aw).toFixed(3),
    cs: +(current_period.vector.cs - previous_period.vector.cs).toFixed(3),
    cr: +(current_period.vector.cr - previous_period.vector.cr).toFixed(3)
  };

  return { previous_period, current_period, delta };
}

// ── RADAR RENDERING ────────────────────────────────────
// Trikampis radaras trims ašims (aw/cs/cr) su viena taškų forma.
// Naudojame SVG, nes tai vienintelis paprastas būdas nupiešti tokį grafiką
// be papildomos bibliotekos.
// Vieno ar dviejų perdengtų laikotarpių radaras. Jei perduodamas antrasis
// (earlierVector), jis piešiamas silpnesniu, punktyriniu kontūru be užpildo —
// vizualiai aiškiai atskiriamas nuo pagrindinio (dabartinio) net be spalvų
// atpažinimo. Abi formos naudoja TĄ PATĮ maxRadius ir tą pačią netiesinę skalę,
// jokio automatinio persiskalinimo pagal savo maksimumą.
// ── OBSERVATION ANALYSIS (G stage) ─────────────────────
// Skaičiuoja temų (tags) pasikartojimus IŠ TIK standartinių cue pasirinkimų
// (response_type === 'cue') per pateiktas sesijas. custom, hard_to_say,
// individuali/sesijos refleksija ir latencija NIEKADA nedalyvauja.
function computeTagCounts(sessions){
  const tagCounts = {};
  const tagEvidence = {};

  sessions.forEach(s => {
    (s.reflections || []).forEach(r => {
      if(r.response_type !== 'cue' || !r.cue_id) return;
      const tags = OBSERVATION_TAGS_MAP[r.cue_id];
      if(!tags) return;

      tags.forEach(tag => {
        tagCounts[tag] = (tagCounts[tag] || 0) + 1;
        if(!tagEvidence[tag]) tagEvidence[tag] = [];
        tagEvidence[tag].push({
          session_id: s.session_id,
          cue_id: r.cue_id,
          cue_text: r.cue_text,
          image_id: r.image_id
        });
      });
    });
  });

  return { tagCounts, tagEvidence };
}

function computeRepeatedThemes(prevData, currData){
  const allTags = new Set([...Object.keys(prevData.tagCounts), ...Object.keys(currData.tagCounts)]);
  const repeated = [];

  allTags.forEach(tag => {
    const cCount = currData.tagCounts[tag] || 0;
    const pCount = prevData.tagCounts[tag] || 0;
    if(cCount >= 2 || pCount >= 2){
      repeated.push({
        tag,
        current_count: cCount,
        previous_count: pCount,
        both_periods: cCount >= 2 && pCount >= 2
      });
    }
  });

  // Prioritetas: abiejuose periodais pasikartojančios temos pirma
  repeated.sort((a,b) => (b.both_periods - a.both_periods) || ((b.current_count+b.previous_count) - (a.current_count+a.previous_count)));

  return repeated.slice(0, 2); // ne daugiau kaip 2 vienam blokui
}

function computeChangedTheme(prevData, currData){
  const allTags = new Set([...Object.keys(prevData.tagCounts), ...Object.keys(currData.tagCounts)]);
  let best = null;

  allTags.forEach(tag => {
    const cCount = currData.tagCounts[tag] || 0;
    const pCount = prevData.tagCounts[tag] || 0;

    if(cCount >= 2 && (cCount - pCount) >= 2){
      const magnitude = cCount - pCount;
      if(!best || magnitude > best.magnitude){
        best = { tag, direction: 'increased', current_count: cCount, previous_count: pCount, magnitude };
      }
    }
    if(pCount >= 2 && (pCount - cCount) >= 2){
      const magnitude = pCount - cCount;
      if(!best || magnitude > best.magnitude){
        best = { tag, direction: 'decreased', current_count: cCount, previous_count: pCount, magnitude };
      }
    }
  });

  return best;
}

function computeMixedPair(prevData, currData){
  for(const [tagA, tagB] of MIXED_THEME_PAIRS){
    const aTotal = (prevData.tagCounts[tagA]||0) + (currData.tagCounts[tagA]||0);
    const bTotal = (prevData.tagCounts[tagB]||0) + (currData.tagCounts[tagB]||0);
    if(aTotal >= 1 && bTotal >= 1){
      return { tagA, tagB };
    }
  }
  return null;
}

function computeComparisonObservation(previousSessions, currentSessions){
  const prevData = computeTagCounts(previousSessions);
  const currData = computeTagCounts(currentSessions);

  const repeated = computeRepeatedThemes(prevData, currData);
  const changed = computeChangedTheme(prevData, currData);
  const mixed = computeMixedPair(prevData, currData);

  // Sujungti evidence abiejų periodų (naudojama UI rodymui pagal poreikį)
  const evidence = {};
  Object.keys(prevData.tagEvidence).forEach(tag => {
    evidence[tag] = (evidence[tag] || []).concat(prevData.tagEvidence[tag]);
  });
  Object.keys(currData.tagEvidence).forEach(tag => {
    evidence[tag] = (evidence[tag] || []).concat(currData.tagEvidence[tag]);
  });

  return {
    model_version: 'observation-tags-v0.1',
    previous_tag_counts: prevData.tagCounts,
    current_tag_counts: currData.tagCounts,
    repeated,
    changed,
    mixed,
    evidence
  };
}

function renderRadarSVG(vector, earlierVector){
  const size = 260;
  const center = size / 2;
  const maxRadius = 95;
  const MIN_VISIBLE_PX = 5;

  const angleMap = { 'aw+':-90, 'cr+':-30, 'cs-':30, 'aw-':90, 'cr-':150, 'cs+':210 };

  function toXY(angleDeg, normalizedValue){
    const rad = angleDeg * Math.PI / 180;
    let r;
    if(normalizedValue <= 0){
      r = 0;
    } else {
      r = MIN_VISIBLE_PX + (maxRadius - MIN_VISIBLE_PX) * Math.pow(normalizedValue, 0.7);
    }
    return { x: center + r * Math.cos(rad), y: center + r * Math.sin(rad) };
  }

  function directionsFor(v){
    return [
      { key:'aw+', angle:angleMap['aw+'], value: Math.max(v.aw, 0) },
      { key:'cr+', angle:angleMap['cr+'], value: Math.max(v.cr, 0) },
      { key:'cs-', angle:angleMap['cs-'], value: Math.max(-v.cs, 0) },
      { key:'aw-', angle:angleMap['aw-'], value: Math.max(-v.aw, 0) },
      { key:'cr-', angle:angleMap['cr-'], value: Math.max(-v.cr, 0) },
      { key:'cs+', angle:angleMap['cs+'], value: Math.max(v.cs, 0) },
    ];
  }

  const mainDirections = directionsFor(vector);
  const mainPoints = mainDirections.map(d => toXY(d.angle, Math.abs(d.value)));
  const mainPolygon = mainPoints.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  let earlierPolygonSVG = '';
  if(earlierVector){
    const earlierDirections = directionsFor(earlierVector);
    const earlierPoints = earlierDirections.map(d => toXY(d.angle, Math.abs(d.value)));
    const earlierPolygon = earlierPoints.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    earlierPolygonSVG = `
      <polygon points="${earlierPolygon}" fill="none" stroke="#6E6A64" stroke-width="2"
        stroke-dasharray="5,4" stroke-linejoin="round"/>
      ${earlierPoints.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#6E6A64"/>`).join('')}
    `;
  }

  const axisLines = mainDirections.map(d => {
    const end = toXY(d.angle, 1);
    return `<line x1="${center}" y1="${center}" x2="${end.x.toFixed(1)}" y2="${end.y.toFixed(1)}" stroke="#32323A" stroke-width="1"/>`;
  }).join('');

  const axisLabels = mainDirections.map(d => {
    const pos = toXY(d.angle, 1 + (22/maxRadius));
    return `<text x="${pos.x.toFixed(1)}" y="${pos.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="#6E6A64" font-size="12">${d.key}</text>`;
  }).join('');

  const mainNodes = mainPoints.map(p =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#7C9E8F"/>`
  ).join('');

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${center}" cy="${center}" r="${maxRadius}" fill="none" stroke="#1E1E24" stroke-width="1"/>
      <circle cx="${center}" cy="${center}" r="${maxRadius/2}" fill="none" stroke="#1E1E24" stroke-width="1"/>
      ${axisLines}
      ${earlierPolygonSVG}
      <polygon points="${mainPolygon}" fill="rgba(124,158,143,0.25)" stroke="#7C9E8F" stroke-width="2" stroke-linejoin="round"/>
      ${mainNodes}
      <circle cx="${center}" cy="${center}" r="2.5" fill="#6E6A64"/>
      ${axisLabels}
    </svg>
  `;
}

function showRadar(){
  const eligible = getEligibleSessions();
  const count = eligible.length;

  const body = document.getElementById('radar-body');
  body.innerHTML = '';

  if(count < RADAR_MIN_SESSIONS){
    document.getElementById('txt-radar-header').textContent = txt('your_trace') || 'Your current trace';
    const progressTmpl = txt('radar_progress') || '{n} of {total} sessions for your current trace';
    const progressBox = document.createElement('div');
    progressBox.className = 'radar-progress-box';
    progressBox.innerHTML = `
      <div class="radar-progress-text">${progressTmpl.replace('{n}', count).replace('{total}', RADAR_MIN_SESSIONS)}</div>
    `;
    const sub = document.createElement('div');
    sub.className = 'radar-progress-sub';
    sub.textContent = txt('radar_not_enough') || 'Complete more sessions to see your current trace.';
    progressBox.appendChild(sub);
    body.appendChild(progressBox);
    show('radar');
    return;
  }

  if(count >= COMPARISON_MIN_SESSIONS){
    renderComparisonScreen(eligible, body);
    show('radar');
    return;
  }

  // 3–5 eligible sesijų atvejis — vieno laikotarpio radaras (nepakeista nuo E/E.1)
  document.getElementById('txt-radar-header').textContent = txt('your_trace') || 'Your current trace';

  const trace = computeCurrentTrace(eligible);
  const recentSessions = eligible.slice(-RADAR_MIN_SESSIONS);
  const totalVectorResponses = recentSessions.reduce((sum, s) => sum + (s.valid_vector_responses || 0), 0);

  const chartWrap = document.createElement('div');
  chartWrap.className = 'radar-chart-wrap';
  chartWrap.innerHTML = renderRadarSVG(trace);
  body.appendChild(chartWrap);

  const scaleNote = document.createElement('div');
  scaleNote.className = 'radar-scale-note';
  scaleNote.textContent = txt('radar_scale_note') ||
    'Small values are visually amplified so the directions remain visible. Exact magnitudes are shown in the numbers below.';
  body.appendChild(scaleNote);

  const scopeLine = document.createElement('div');
  scopeLine.className = 'radar-scope-line';
  const scopeTmpl = txt('radar_based_on') || 'Based on {sessions} sessions · {responses} vector choices';
  scopeLine.textContent = scopeTmpl
    .replace('{sessions}', trace.session_count)
    .replace('{responses}', totalVectorResponses);
  body.appendChild(scopeLine);

  const axisValues = document.createElement('div');
  axisValues.className = 'radar-axis-values';
  const fmt = (v) => (v >= 0 ? '+' : '') + v.toFixed(2);
  axisValues.innerHTML = `
    <div class="radar-axis-item"><div class="radar-axis-label">AW</div><div class="radar-axis-value">${fmt(trace.aw)}</div></div>
    <div class="radar-axis-item"><div class="radar-axis-label">CS</div><div class="radar-axis-value">${fmt(trace.cs)}</div></div>
    <div class="radar-axis-item"><div class="radar-axis-label">CR</div><div class="radar-axis-value">${fmt(trace.cr)}</div></div>
  `;
  body.appendChild(axisValues);

  const scope = document.createElement('div');
  scope.className = 'result-scope-note';
  scope.textContent = txt('radar_scope_note') ||
    'This shape is built from your chosen responses across the last 3 eligible sessions. It is not a personality assessment.';
  body.appendChild(scope);

  show('radar');
}

// ── PERIOD COMPARISON SCREEN (F stage) ────────────────
function classifyMagnitude(absDelta){
  if(absDelta < 0.05) return 'tiny';
  if(absDelta < 0.15) return 'noticeable';
  return 'larger';
}

function renderComparisonScreen(eligible, body){
  document.getElementById('txt-radar-header').textContent = txt('trace_comparison_header') || 'Your trace comparison';

  const cmp = computePeriodComparison(eligible);

  const title = document.createElement('div');
  title.className = 'comparison-title';
  title.textContent = txt('trace_comparison_header') || 'Your trace comparison';
  body.appendChild(title);

  const chartWrap = document.createElement('div');
  chartWrap.className = 'radar-chart-wrap';
  chartWrap.innerHTML = renderRadarSVG(cmp.current_period.vector, cmp.previous_period.vector);
  body.appendChild(chartWrap);

  // Legenda — veikia be spalvų atpažinimo (vientisa vs punktyrinė linija)
  const legend = document.createElement('div');
  legend.className = 'comparison-legend';
  legend.innerHTML = `
    <div class="legend-item"><span class="legend-swatch legend-now"></span>${txt('now_label') || 'Now'}</div>
    <div class="legend-item"><span class="legend-swatch legend-earlier"></span>${txt('earlier_label') || 'Earlier'}</div>
  `;
  body.appendChild(legend);

  const scaleNote = document.createElement('div');
  scaleNote.className = 'radar-scale-note';
  scaleNote.textContent = txt('radar_scale_note') ||
    'Small values are visually amplified so the directions remain visible. Exact magnitudes are shown in the numbers below.';
  body.appendChild(scaleNote);

  // Anksčiau / Dabar / Pokytis lentelė — jokių rodyklių, jokių spalvų vertinimo
  const fmt = (v) => (v >= 0 ? '+' : '') + v.toFixed(2);
  const table = document.createElement('div');
  table.className = 'comparison-table';

  ['aw','cs','cr'].forEach(axis => {
    const row = document.createElement('div');
    row.className = 'comparison-row';
    row.innerHTML = `
      <div class="comparison-axis-name">${axis.toUpperCase()}</div>
      <div class="comparison-col">
        <div class="comparison-col-label">${txt('earlier_label') || 'Earlier'}</div>
        <div class="comparison-col-value">${fmt(cmp.previous_period.vector[axis])}</div>
      </div>
      <div class="comparison-col">
        <div class="comparison-col-label">${txt('now_label') || 'Now'}</div>
        <div class="comparison-col-value">${fmt(cmp.current_period.vector[axis])}</div>
      </div>
      <div class="comparison-col">
        <div class="comparison-col-label">${txt('shift_label') || 'Shift'}</div>
        <div class="comparison-col-value comparison-delta">${fmt(cmp.delta[axis])}</div>
      </div>
    `;
    table.appendChild(row);
  });
  body.appendChild(table);

  // Neutralus tekstinis veidrodis — P0 UX slenksčiai, ne psichologinio reikšmingumo ribos
  const absDeltas = { aw: Math.abs(cmp.delta.aw), cs: Math.abs(cmp.delta.cs), cr: Math.abs(cmp.delta.cr) };
  const maxAxis = Object.keys(absDeltas).reduce((a,b) => absDeltas[a] >= absDeltas[b] ? a : b);
  const maxDelta = absDeltas[maxAxis];
  const magnitude = classifyMagnitude(maxDelta);

  const mirror = document.createElement('div');
  mirror.className = 'comparison-mirror';
  if(magnitude === 'tiny'){
    mirror.textContent = txt('shift_tiny') || 'No clear shift is visible between these two three-session periods.';
  } else if(magnitude === 'noticeable'){
    const tmpl = txt('shift_noticeable') || 'A noticeable difference appears in the {axis} direction, though it remains modest.';
    mirror.textContent = tmpl.replace('{axis}', maxAxis.toUpperCase());
  } else {
    const tmpl = txt('shift_larger') || 'A more pronounced difference appears in the {axis} direction.';
    mirror.textContent = tmpl.replace('{axis}', maxAxis.toUpperCase());
  }
  body.appendChild(mirror);

  const scope = document.createElement('div');
  scope.className = 'result-scope-note';
  scope.textContent = txt('comparison_scope_note') ||
    'This compares traces of your selected responses across two adjacent periods. It is not a measure of personality change.';
  body.appendChild(scope);
}


// ── HISTORY ───────────────────────────────────────────
function formatHistoryDate(isoString){
  const d = new Date(isoString);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const time = d.toLocaleTimeString(currentLang === 'lt' ? 'lt-LT' : 'en-US', {hour:'2-digit', minute:'2-digit'});
  if(isToday){
    const todayLabel = txt('today') || 'Today';
    return `${todayLabel}, ${time}`;
  }
  return d.toLocaleDateString(currentLang === 'lt' ? 'lt-LT' : 'en-US') + ', ' + time;
}

// ── OBSERVATION COMPARISON UI (G stage) ────────────────
function buildEvidenceCueTexts(tagEvidenceList, sessionSet){
  // Grąžina unikalius cue_text iš evidence, filtruotus pagal tai, kurioms
  // sesijoms (previous/current) jie priklauso. Rodo tik realiai pasirinktus.
  const seen = new Set();
  const texts = [];
  tagEvidenceList.forEach(ev => {
    if(sessionSet && !sessionSet.has(ev.session_id)) return;
    if(seen.has(ev.cue_text)) return;
    seen.add(ev.cue_text);
    texts.push(ev.cue_text);
  });
  return texts.slice(0, 4); // 2-4 pavyzdžiai
}

function renderObservationComparisonBlock(eligible, body){
  const windows = getComparisonWindows(eligible);
  if(!windows) return;

  const obs = computeComparisonObservation(windows.previousSessions, windows.currentSessions);

  const prevIds = new Set(windows.previousSessions.map(s => s.session_id));
  const currIds = new Set(windows.currentSessions.map(s => s.session_id));

  const container = document.createElement('div');
  container.className = 'observation-container';

  const title = document.createElement('div');
  title.className = 'observation-title';
  title.textContent = txt('observation_header') || 'What can be noticed across these periods';
  container.appendChild(title);

  let anyBlockShown = false;

  // ── KAS KARTOJOSI ──────────────────────────────────
  if(obs.repeated.length > 0){
    anyBlockShown = true;
    const block = document.createElement('div');
    block.className = 'observation-block';
    const heading = document.createElement('div');
    heading.className = 'observation-block-heading';
    heading.textContent = txt('repeated_heading') || 'What repeated';
    block.appendChild(heading);

    obs.repeated.forEach(r => {
      const line = document.createElement('div');
      line.className = 'observation-line';
      const theme = tagLabel(r.tag);
      if(r.both_periods){
        const tmpl = txt('repeated_both') || 'Across both periods, choices related to {theme} appeared repeatedly.';
        line.textContent = tmpl.replace('{theme}', theme);
      } else {
        const tmpl = txt('repeated_current') || 'In the latest sessions, choices related to {theme} appeared repeatedly.';
        line.textContent = tmpl.replace('{theme}', theme);
      }
      block.appendChild(line);

      const evidenceTexts = buildEvidenceCueTexts(obs.evidence[r.tag] || [], null);
      if(evidenceTexts.length > 0){
        const ev = document.createElement('div');
        ev.className = 'observation-evidence';
        ev.innerHTML = `<div class="observation-evidence-label">${txt('based_on_choices') || 'Based on your choices:'}</div>` +
          evidenceTexts.map(t => `<div class="observation-evidence-item">"${t}"</div>`).join('');
        block.appendChild(ev);
      }
    });
    container.appendChild(block);
  }

  // ── KAS PASIKEITĖ ──────────────────────────────────
  {
    anyBlockShown = true;
    const block = document.createElement('div');
    block.className = 'observation-block';
    const heading = document.createElement('div');
    heading.className = 'observation-block-heading';
    heading.textContent = txt('changed_heading') || 'What changed';
    block.appendChild(heading);

    const line = document.createElement('div');
    line.className = 'observation-line';

    if(obs.changed){
      const theme = tagLabel(obs.changed.tag);
      if(obs.changed.direction === 'increased'){
        const tmpl = txt('changed_more') || 'In the latest sessions, wording related to {theme} appeared more often.';
        line.textContent = tmpl.replace('{theme}', theme);
      } else {
        const tmpl = txt('changed_less') || 'In the latest sessions, wording related to {theme} appeared less often.';
        line.textContent = tmpl.replace('{theme}', theme);
      }
      block.appendChild(line);

      const sessionSet = obs.changed.direction === 'increased' ? currIds : prevIds;
      const evidenceTexts = buildEvidenceCueTexts(obs.evidence[obs.changed.tag] || [], sessionSet);
      if(evidenceTexts.length > 0){
        const ev = document.createElement('div');
        ev.className = 'observation-evidence';
        ev.innerHTML = `<div class="observation-evidence-label">${txt('based_on_choices') || 'Based on your choices:'}</div>` +
          evidenceTexts.map(t => `<div class="observation-evidence-item">"${t}"</div>`).join('');
        block.appendChild(ev);
      }
    } else {
      line.textContent = txt('no_clear_change') || 'No clear thematic change is visible between these two periods.';
      block.appendChild(line);
    }
    container.appendChild(block);
  }

  // ── KAS LIKO MIŠRU ─────────────────────────────────
  if(obs.mixed){
    anyBlockShown = true;
    const block = document.createElement('div');
    block.className = 'observation-block';
    const heading = document.createElement('div');
    heading.className = 'observation-block-heading';
    heading.textContent = txt('mixed_heading') || 'What stayed mixed';
    block.appendChild(heading);

    const themeA = tagLabel(obs.mixed.tagA);
    const themeB = tagLabel(obs.mixed.tagB);
    const tmpl = txt('mixed_line') || 'Your choices included both {theme_1} and {theme_2}.';
    const line = document.createElement('div');
    line.className = 'observation-line';
    line.textContent = tmpl.replace('{theme_1}', themeA).replace('{theme_2}', themeB);
    block.appendChild(line);

    const line2 = document.createElement('div');
    line2.className = 'observation-line';
    line2.style.marginTop = '4px';
    line2.textContent = txt('mixed_note') || 'In this set, one direction was not consistent.';
    block.appendChild(line2);

    container.appendChild(block);
  }

  if(!anyBlockShown){
    const fallback = document.createElement('div');
    fallback.className = 'observation-line';
    fallback.textContent = txt('not_enough_for_comparison') || 'There are not yet enough choices for a clearer thematic comparison.';
    container.appendChild(fallback);
  }

  // Žmogaus patikrinimas
  const checkBlock = document.createElement('div');
  checkBlock.className = 'observation-check';
  const checkQ = document.createElement('div');
  checkQ.className = 'observation-check-question';
  checkQ.textContent = txt('reflects_real_question') || 'Does this reflect anything real for you?';
  checkBlock.appendChild(checkQ);

  const options = [
    { key:'yes', label: txt('reflects_yes') || 'Yes' },
    { key:'partly', label: txt('reflects_partly') || 'Partly' },
    { key:'no', label: txt('reflects_no') || 'No' },
    { key:'not_sure', label: txt('reflects_not_sure') || 'Not sure yet' },
  ];
  const optRow = document.createElement('div');
  optRow.className = 'observation-check-options';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'observation-check-btn';
    btn.textContent = opt.label;
    btn.onclick = () => {
      optRow.querySelectorAll('.observation-check-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      SESSION.comparison_feedback = { response: opt.key, created_at: new Date().toISOString() };
      try {
        const all = getCompletedSessions();
        const latestId = eligible[eligible.length-1].session_id;
        const idx = all.findIndex(s => s.session_id === latestId);
        if(idx >= 0){
          all[idx].comparison_feedback = { response: opt.key, created_at: new Date().toISOString() };
          localStorage.setItem(NS + 'completed_sessions', JSON.stringify(all));
        }
      } catch(e){}
    };
    optRow.appendChild(btn);
  });
  checkBlock.appendChild(optRow);
  container.appendChild(checkBlock);

  // Metodinė riba
  const scope = document.createElement('div');
  scope.className = 'result-scope-note';
  scope.textContent = txt('observation_scope_note') ||
    'These observations describe only repetitions and differences in the wording you selected. They do not explain why you chose them and do not describe your personality.';
  container.appendChild(scope);

  body.appendChild(container);
}

function showHistory(){
  const sessions = getCompletedSessions().slice().reverse(); // naujausios viršuje
  const body = document.getElementById('history-body');
  body.innerHTML = '';

  const eligible = getEligibleSessions();

  if(eligible.length >= COMPARISON_MIN_SESSIONS){
    renderObservationComparisonBlock(eligible, body);
  }

  // Nuoroda į radarą — pakeičiama į "Peržiūrėti krypties grafiką" kai jau
  // yra teminis palyginimas (radaras tampa antriniu techniniu sluoksniu).
  const radarLink = document.createElement('button');
  radarLink.className = 'btn-ghost';
  radarLink.style.marginBottom = '16px';
  radarLink.textContent = eligible.length >= COMPARISON_MIN_SESSIONS
    ? (txt('view_direction_chart') || 'View direction chart')
    : (txt('view_trace') || 'View your current trace');
  radarLink.onclick = showRadar;
  if(eligible.length < COMPARISON_MIN_SESSIONS){
    body.appendChild(radarLink);
  } else {
    // Kai jau yra observation blokas, radaro nuoroda eina PO juo (žr. renderObservationComparisonBlock)
  }

  const sessionsHeader = document.createElement('div');
  sessionsHeader.className = 'observation-block-heading';
  sessionsHeader.style.marginTop = '8px';
  sessionsHeader.style.fontSize = '.85rem';
  sessionsHeader.textContent = txt('your_sessions') || 'Your sessions';
  if(eligible.length >= COMPARISON_MIN_SESSIONS){
    body.appendChild(sessionsHeader);
  }

  if(sessions.length === 0){
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = txt('no_history') || 'No completed sessions yet.';
    body.appendChild(empty);
    show('history');
    return;
  }

  sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.onclick = () => showHistoryDetail(s.session_id);

    const sr = s.session_reflection;
    let obsText = '';
    if(sr){
      if(sr.response_type === 'text' && sr.text) obsText = sr.text;
      else if(sr.response_type === 'not_yet') obsText = (txt('observation_not_yet') || '');
    }

    const countTmpl = txt('choices_count') || '{n} choices';
    item.innerHTML = `
      <div class="history-date">${formatHistoryDate(s.completed_at || s.started_at)}</div>
      <div class="history-count">${countTmpl.replace('{n}', s.choices.length)}</div>
      ${obsText ? `<div class="history-observation">${obsText}</div>` : ''}
    `;
    body.appendChild(item);
  });

  show('history');
}

function showHistoryDetail(sessionId){
  const sessions = getCompletedSessions();
  const s = sessions.find(x => x.session_id === sessionId);
  if(!s) return;

  document.getElementById('txt-history-detail-header').textContent = formatHistoryDate(s.completed_at || s.started_at);

  const body = document.getElementById('history-detail-body');
  body.innerHTML = '';

  s.choices.forEach(choice => {
    const pair = PAIRS.find(p => p.pair_id === choice.pair_id);
    const imgObj = pair
      ? (pair.image_a.id === choice.selected_image_id ? pair.image_a : pair.image_b)
      : null;
    const ref = (s.reflections || []).find(r => r.image_id === choice.selected_image_id);

    let mainText = '';
    if(ref){
      if(ref.response_type === 'cue') mainText = ref.cue_text;
      else if(ref.response_type === 'custom') mainText = ref.custom_words;
      else if(ref.response_type === 'hard_to_say') mainText = (txt('hard_to_say_label') || 'Hard to say');
    }

    const div = document.createElement('div');
    div.className = 'result-item';
    let itemHtml = `
      <div class="result-thumb">${imgObj ? `<img src="${imgObj.src}" alt="" loading="lazy">` : ''}</div>
      ${mainText ? `<div class="result-words">${mainText}</div>` : ''}
    `;
    if(ref && ref.reflection_text){
      itemHtml += `<div style="font-size:.8rem;color:var(--dim);text-align:center;margin-top:4px">${ref.reflection_text}</div>`;
    }
    div.innerHTML = itemHtml;
    body.appendChild(div);
  });

  const sr = s.session_reflection;
  if(sr){
    const obsBlock = document.createElement('div');
    obsBlock.className = 'result-observation';
    const label = document.createElement('div');
    label.className = 'result-observation-label';
    label.textContent = txt('your_observation') || 'Your observation';
    obsBlock.appendChild(label);
    const text = document.createElement('div');
    text.className = 'result-observation-text';
    if(sr.response_type === 'text' && sr.text) text.textContent = sr.text;
    else if(sr.response_type === 'not_yet'){
      text.textContent = txt('observation_not_yet') || '';
      text.classList.add('empty');
    }
    obsBlock.appendChild(text);
    body.appendChild(obsBlock);
  }

  show('history-detail');
}

function exportDebug(){
  const eligible = getEligibleSessions();
  const comparison = computePeriodComparison(eligible);

  let comparisonObservation = null;
  const windows = getComparisonWindows(eligible);
  if(windows){
    const obs = computeComparisonObservation(windows.previousSessions, windows.currentSessions);
    comparisonObservation = {
      model_version: obs.model_version,
      previous_period_session_ids: windows.previousSessions.map(s => s.session_id),
      current_period_session_ids: windows.currentSessions.map(s => s.session_id),
      previous_tag_counts: obs.previous_tag_counts,
      current_tag_counts: obs.current_tag_counts,
      repeated: obs.repeated,
      changed: obs.changed,
      mixed: obs.mixed,
      evidence: obs.evidence
    };
  }

  const data = {
    comparison_observation: comparisonObservation,
    comparison_feedback: SESSION.comparison_feedback || { response: null, created_at: null },
    active_session: SESSION,
    completed_sessions: getCompletedSessions(),
    radar_eligible_session_ids: eligible.map(s => s.session_id),
    radar_eligible_count: eligible.length,
    current_trace: computeCurrentTrace(eligible),
    comparison_eligibility: {
      eligible_count: eligible.length,
      minimum_required: COMPARISON_MIN_SESSIONS,
      can_compare: eligible.length >= COMPARISON_MIN_SESSIONS
    },
    previous_period: comparison ? {
      session_ids: comparison.previous_period.session_ids,
      period_vector: comparison.previous_period.vector,
      period_session_count: comparison.previous_period.session_count,
      period_valid_responses: comparison.previous_period.valid_vector_responses,
      period_confidence: comparison.previous_period.confidence
    } : null,
    current_period: comparison ? {
      session_ids: comparison.current_period.session_ids,
      period_vector: comparison.current_period.vector,
      period_session_count: comparison.current_period.session_count,
      period_valid_responses: comparison.current_period.valid_vector_responses,
      period_confidence: comparison.current_period.confidence
    } : null,
    period_delta: comparison ? comparison.delta : null,
    pairs_loaded: PAIRS.length,
    audio_enabled: audioEnabled,
    audio_started: audioStarted,
    exported_at: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `p0-debug-${SESSION.session_id}.json`;
  a.click();
}

init();
