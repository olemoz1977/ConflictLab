<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ConflictLab P0</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C0C0F;--card:#121215;--border:#1E1E24;--text:#E2DED6;
  --dim:#6E6A64;--faint:#32323A;--accent:#7C9E8F;--r:12px
}
html,body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  margin:0;padding:0;
}
/* Nėra jokio dvh/vh eksperimentavimo. Naudojame paprastą min-height:100vh
   su natūraliu document flow — puslapis gali scrollintis kaip normalus html.
   Tai stabiliausias variantas visose mobiliose naršyklėse. */
body{min-height:100vh}

.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* Kiekvienas ekranas: header (jei reikia) + body (auga laisvai) + footer (visada apačioje po turiniu, NE fixed) */
.screen-body{flex:1 1 auto;padding:16px 16px 24px}
.screen-footer{
  flex-shrink:0;
  padding:16px;
  border-top:1px solid var(--border);
  background:var(--bg);
}
.screen-header{
  flex-shrink:0;padding:14px 16px;border-bottom:1px solid var(--border);
  text-align:center;font-size:.8rem;color:var(--dim);
}

/* ── INTRO ── */
#screen-intro .screen-body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;min-height:80vh;text-align:center;
}
.logo{font-size:.65rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}

/* ── M0: BETA MODE ── */
.beta-badge{
  padding:6px 14px;border-radius:20px;border:1px solid var(--accent);
  background:rgba(124,158,143,.1);color:var(--accent);font-size:.72rem;
  font-weight:600;margin-bottom:16px;
}
.beta-invalid-text, .beta-risk-text{
  font-size:.9rem;color:var(--dim);line-height:1.6;text-align:center;
  max-width:320px;margin:0 auto 20px;
}
.beta-risk-actions{display:flex;flex-direction:column;gap:10px;max-width:320px;margin:0 auto}
.beta-progress{
  text-align:center;font-size:.82rem;color:var(--dim);margin-bottom:16px;
}
.beta-recommend-note{
  text-align:center;font-size:.78rem;color:var(--faint);margin-top:8px;font-style:italic;
}
.beta-feedback-block{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:18px;margin-bottom:16px;
}
.beta-question{font-size:.9rem;color:var(--text);font-weight:500;margin-bottom:10px;line-height:1.5}
.beta-options{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.beta-opt-btn{
  padding:12px 14px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.85rem;text-align:left;
  cursor:pointer;transition:all 180ms;
}
.beta-opt-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,158,143,.1)}
.beta-optional-input{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.85rem;padding:10px;outline:none;margin-top:8px;
}
.beta-interview-progress{text-align:center;font-size:.78rem;color:var(--faint);margin-bottom:16px}
.beta-interview-item{margin-bottom:20px}
.beta-interview-q{font-size:.88rem;color:var(--text);font-weight:500;margin-bottom:8px;line-height:1.5}
.beta-interview-textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.85rem;padding:10px;outline:none;resize:none;min-height:50px;
}
.intro-title{font-size:1.5rem;font-weight:300}
.intro-sub{font-size:.9rem;color:var(--dim);line-height:1.6;max-width:280px}
.lang-row{display:flex;gap:10px}
.lang-btn{
  padding:8px 24px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.85rem;cursor:pointer;transition:all 180ms;
}
.lang-btn.active{border-color:var(--accent);color:var(--text);background:rgba(124,158,143,.08)}
.audio-toggle{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.8rem;cursor:pointer;transition:all 180ms;
}
.audio-toggle.on{border-color:var(--accent);color:var(--accent)}

/* ── NO STIMULI ── */
#screen-nostimuli .screen-body{
  display:flex;align-items:center;justify-content:center;min-height:80vh;
  text-align:center;padding:32px;color:var(--dim);
}

/* ── PAIR (Layer 1) ── */
.pair-prompt{font-size:.8rem;color:var(--dim);flex:1;text-align:center}
.pair-counter{font-size:.72rem;color:var(--faint)}
.pair-images{display:flex;flex-direction:column}
.img-zone{
  height:42vh;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;background:#0a0a0c;
}
.img-zone+.img-zone{border-top:3px solid var(--bg)}
.img-zone img{width:100%;height:100%;object-fit:contain;display:block}
.img-zone .tap-overlay{position:absolute;inset:0;background:rgba(124,158,143,0);transition:background 100ms}
.img-zone:active .tap-overlay{background:rgba(124,158,143,.18)}
.img-loading{position:absolute;font-size:.8rem;color:var(--faint)}

/* ── BUTTONS (bendri visiems ekranams) ── */
.btn-primary{
  width:100%;min-height:52px;padding:14px;border-radius:var(--r);
  background:var(--accent);color:#0C0C0F;font-size:1rem;font-weight:700;
  border:none;cursor:pointer;transition:opacity 180ms;
}
.btn-primary:disabled{opacity:.3;cursor:not-allowed}
.btn-ghost{
  width:100%;min-height:48px;padding:14px;border-radius:var(--r);
  background:transparent;border:1px solid var(--border);color:var(--dim);
  font-size:.9rem;cursor:pointer;
}

/* ── MICRO-FLOW (Layer 2) ── */
.micro-progress{font-size:.72rem;color:var(--faint);letter-spacing:.05em}
.micro-image{border-radius:8px;overflow:hidden;background:#0a0a0c;margin-bottom:16px}
.micro-image img{width:100%;height:240px;object-fit:contain;display:block}
.micro-step-label{
  font-size:.72rem;color:var(--faint);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:10px;font-weight:600;
}
.cue-options{display:flex;flex-direction:column;gap:8px}
.cue-btn{
  padding:14px 16px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.95rem;text-align:left;
  cursor:pointer;transition:all 180ms;width:100%;
}
.cue-btn:active{border-color:var(--accent);background:rgba(124,158,143,.08)}
.cue-btn.selected{border-color:var(--accent);background:rgba(124,158,143,.12);color:var(--accent);font-weight:600}
.cue-custom-input{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.9rem;padding:12px;outline:none;transition:border-color 180ms;
  display:none;margin-top:4px;width:100%;
}
.cue-custom-input.show{display:block}
.cue-custom-input:focus{border-color:var(--accent)}
.chosen-cue-badge{
  display:inline-block;padding:8px 14px;border-radius:8px;
  background:rgba(124,158,143,.12);border:1px solid var(--accent);
  color:var(--accent);font-size:.9rem;font-weight:600;margin-bottom:14px;
}
.reflection-question{font-size:.95rem;color:var(--text);line-height:1.5;margin-bottom:12px;font-weight:500}
.reflection-row{display:flex;gap:8px;align-items:stretch}
.reflection-input{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:1rem;padding:12px;outline:none;transition:border-color 180ms;min-width:0;
}
.reflection-input:focus{border-color:var(--accent)}
.reflection-skip-btn{
  padding:12px 16px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.85rem;cursor:pointer;
  white-space:nowrap;transition:all 180ms;flex-shrink:0;
}
.reflection-skip-btn:active{border-color:var(--accent);color:var(--accent)}

/* ── SESSION REFLECTION ── */
.session-summary-item{
  display:flex;align-items:center;gap:12px;padding:10px;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  margin-bottom:10px;
}
.session-summary-thumb{width:64px;height:64px;border-radius:6px;overflow:hidden;flex-shrink:0;background:#0a0a0c}
.session-summary-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.session-summary-text{font-size:.9rem;color:var(--text);line-height:1.4}
.session-question{font-size:1rem;color:var(--text);font-weight:600;line-height:1.5;margin:20px 0 6px}
.session-subnote{font-size:.8rem;color:var(--dim);line-height:1.5;margin-bottom:14px}
.session-textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.95rem;padding:12px;outline:none;resize:none;
  min-height:70px;line-height:1.5;transition:border-color 180ms;
}
.session-textarea:focus{border-color:var(--accent)}
.session-charcount{font-size:.72rem;color:var(--faint);text-align:right;margin-top:4px}
.not-yet-btn{
  width:100%;margin-top:10px;padding:12px;border-radius:8px;
  border:1px solid var(--border);background:transparent;color:var(--dim);
  font-size:.9rem;cursor:pointer;transition:all 180ms;
}
.not-yet-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,158,143,.12)}

/* ── RESULT ── */
.result-item{
  display:flex;flex-direction:column;gap:10px;padding:16px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:14px;
}
.result-thumb{width:100%;border-radius:8px;overflow:hidden;background:#0a0a0c}
.result-thumb img{width:100%;height:220px;object-fit:contain;display:block}
.result-words{font-size:1.05rem;color:var(--accent);font-weight:600;text-align:center;letter-spacing:.02em}
/* ── I STAGE: literal choice reflection ── */
.choice-reflect-title{
  font-size:1rem;color:var(--text);font-weight:700;margin-bottom:14px;line-height:1.4;
}
.choice-reflect-item{
  display:flex;gap:6px;padding:10px 0;font-size:.92rem;line-height:1.5;
  border-bottom:1px solid var(--border);
}
.choice-reflect-number{color:var(--faint);flex-shrink:0}
.choice-reflect-text{color:var(--text)}
.choice-reflect-text.empty{color:var(--dim);font-style:italic}
.choice-reflect-closing{
  margin-top:14px;padding:12px 14px;font-size:.8rem;color:var(--dim);
  line-height:1.6;font-style:italic;background:var(--card);border-radius:8px;
}
.connection-question-block{
  margin-top:20px;padding:16px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);
}
.connection-question-text{font-size:.92rem;color:var(--text);font-weight:500;margin-bottom:12px;line-height:1.5}
.connection-options{display:flex;flex-direction:column;gap:8px}
.connection-opt-btn{
  padding:12px 14px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.85rem;text-align:left;
  cursor:pointer;transition:all 180ms;
}
.connection-opt-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,158,143,.08)}
.connection-text-wrap{margin-top:12px}
.connection-textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.9rem;padding:10px 12px;outline:none;resize:none;
  min-height:60px;line-height:1.5;transition:border-color 180ms;
}
.connection-textarea:focus{border-color:var(--accent)}

.result-observation{
  margin-top:16px;padding:18px 16px;background:var(--card);
  border:1px solid var(--accent);border-radius:var(--r);
}
.result-observation-label{
  font-size:.72rem;color:var(--accent);text-transform:uppercase;
  letter-spacing:.08em;font-weight:600;margin-bottom:8px;
}
.result-observation-text{font-size:1rem;color:var(--text);line-height:1.5}
.result-observation-text.empty{color:var(--dim);font-style:italic}
.result-scope-note{
  margin-top:14px;padding:12px 14px;
  font-size:.78rem;color:var(--dim);text-align:center;line-height:1.5;font-style:italic;
}

/* ── FEEDBACK ── */
.fb-item{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.fb-q{font-size:.9rem;color:var(--text);line-height:1.5;font-weight:500}
.fb-yn{display:flex;gap:8px}
.fb-btn{
  flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.9rem;font-weight:500;
  cursor:pointer;transition:all 180ms;
}
.fb-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,158,143,.12)}
.fb-textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.9rem;padding:12px;outline:none;resize:none;
  min-height:60px;line-height:1.5;transition:border-color 180ms;
}
.fb-textarea:focus{border-color:var(--accent)}

/* ── DONE ── */
#screen-done .screen-body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:80vh;text-align:center;gap:16px;padding:32px;
}
.done-check{font-size:2.5rem}
.done-title{font-size:1.2rem;font-weight:300}
.done-sub{font-size:.85rem;color:var(--dim);line-height:1.6;max-width:260px}
.done-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:12px}

/* ── RADAR ── */
/* ── P9 EXPECTATION LAYER ── */
.p9-step{
  display:flex;align-items:center;gap:10px;
  font-size:.9rem;color:var(--text-secondary,#aaa);
  padding:10px 14px;border-radius:8px;
  background:rgba(255,255,255,0.04);
}
.p9-step-num{
  font-size:.75rem;font-weight:700;color:#c8900a;
  min-width:24px;text-align:center;
}

/* ── N0 QA BANNER ── */
#n0-qa-banner{
  background:#1a1200;border:1px solid #5a4000;border-radius:6px;
  color:#c8900a;font-size:.72rem;font-weight:600;letter-spacing:.04em;
  text-align:center;padding:6px 12px;margin:0 0 12px;
  text-transform:uppercase;display:none;
}
.radar-progress-box{
  text-align:center;padding:24px 16px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;
}
.radar-progress-text{font-size:1.1rem;color:var(--text);font-weight:600;margin-bottom:6px}
.radar-progress-sub{font-size:.8rem;color:var(--dim);line-height:1.5}
.radar-chart-wrap{
  display:flex;justify-content:center;align-items:center;
  padding:20px 0;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:16px;
}
.radar-axis-values{display:flex;justify-content:space-around;margin-bottom:16px}
.radar-axis-item{text-align:center}
.radar-axis-label{font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.radar-axis-value{font-size:1.2rem;color:var(--accent);font-weight:700;margin-top:4px}
.radar-meta{
  display:flex;justify-content:space-between;font-size:.78rem;color:var(--dim);
  padding:10px 4px;border-top:1px solid var(--border);margin-top:8px;
}
.radar-scope-line{
  text-align:center;font-size:.78rem;color:var(--faint);
  margin-bottom:14px;padding-top:4px;
}
.radar-scale-note{
  text-align:center;font-size:.74rem;color:var(--faint);
  line-height:1.5;padding:8px 12px;margin-top:10px;font-style:italic;
}
.radar-scope-note{
  margin-top:16px;padding:14px;font-size:.8rem;color:var(--dim);
  text-align:center;line-height:1.6;font-style:italic;
  border-top:1px solid var(--border);
}

/* ── HISTORY ── */
.history-item{
  display:flex;flex-direction:column;gap:8px;padding:16px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:12px;cursor:pointer;transition:border-color 180ms;
}
.history-item:active{border-color:var(--accent)}
.history-date{font-size:.75rem;color:var(--faint)}
.history-count{font-size:.8rem;color:var(--dim)}
.history-observation{font-size:.9rem;color:var(--text);font-style:italic}
.history-empty{text-align:center;color:var(--dim);padding:24px 20px 8px;font-size:.9rem;line-height:1.6}
.history-empty-hint{
  text-align:center;color:var(--faint);padding:0 20px 32px;font-size:.8rem;line-height:1.6;
}
.data-mgmt-block{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.data-mgmt-title{font-size:.78rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.btn-danger-outline{
  width:100%;padding:12px;border-radius:8px;border:1px solid #5A2E2E;
  background:transparent;color:#B08080;font-size:.85rem;cursor:pointer;margin-bottom:8px;
}
.btn-danger-outline:active{border-color:#8A4444}
.clear-success-status{
  margin-top:10px;padding:12px 14px;background:var(--card);border:1px solid var(--accent);
  border-radius:8px;font-size:.85rem;color:var(--text);
}
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;max-width:340px;width:100%;
}
.modal-title{font-size:1rem;color:var(--text);font-weight:700;margin-bottom:12px}
.modal-text{font-size:.85rem;color:var(--dim);line-height:1.6;margin-bottom:12px}
.modal-active-session-note{font-size:.82rem;color:#B08080;margin-bottom:12px;line-height:1.5}
.modal-checkbox-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;cursor:pointer}
.modal-checkbox-row input{margin-top:3px;flex-shrink:0}
.modal-checkbox-row span{font-size:.8rem;color:var(--dim);line-height:1.5}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn-ghost{flex:1}
.btn-destructive{
  flex:1;padding:12px;border-radius:8px;border:none;background:#8A3030;
  color:#F0DEDE;font-size:.85rem;font-weight:600;cursor:pointer;
}
.btn-destructive:disabled{opacity:.3;cursor:not-allowed}

.history-transfer-block{
  display:flex;gap:10px;margin-bottom:16px;
}
.history-transfer-btn{
  flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.82rem;cursor:pointer;transition:all 180ms;
}
.history-transfer-btn:active{border-color:var(--accent)}
.history-privacy-note{
  font-size:.74rem;color:var(--faint);text-align:center;line-height:1.5;
  margin-bottom:20px;padding:0 8px;
}
.history-import-summary{
  background:var(--card);border:1px solid var(--accent);border-radius:var(--r);
  padding:14px 16px;margin-bottom:16px;font-size:.85rem;color:var(--text);line-height:1.7;
}
.history-import-error{
  background:var(--card);border:1px solid #7A3030;border-radius:var(--r);
  padding:14px 16px;margin-bottom:16px;font-size:.85rem;color:#c47878;line-height:1.6;
}
.observation-label{
  font-size:.7rem;color:var(--accent);text-transform:uppercase;
  letter-spacing:.06em;font-weight:700;margin-bottom:4px;
}
.history-detail-thumbs{display:flex;gap:8px;margin-top:8px}
.history-detail-thumb{width:56px;height:56px;border-radius:6px;overflow:hidden;background:#0a0a0c;flex-shrink:0}
.history-detail-thumb img{width:100%;height:100%;object-fit:contain}

/* ── DEBUG BAR — natūraliame flow, ne fixed, kad niekada nedengtų turinio ── */
#debug-bar{
  display:none;padding:8px 12px;font-size:.7rem;color:var(--faint);
  background:#080808;border-top:1px solid #222;
  align-items:center;gap:10px;flex-wrap:wrap;
}
.dbg-btn{
  padding:4px 10px;border-radius:6px;border:1px solid #333;
  background:transparent;color:var(--faint);font-size:.7rem;cursor:pointer;
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <div class="screen-body">
    <div class="beta-badge" id="beta-badge" style="display:none"></div>
    <div id="n0-qa-banner">INTERNAL TECHNICAL QA — PLACEHOLDER ASSETS</div>
    <div class="beta-progress" id="beta-start-progress" style="display:none"></div>
    <div class="logo">ConflictLab</div>
    <div class="intro-title" id="txt-subtitle"></div>

<script>
// ── NAMESPACE ────────────────────────────────────────
const NS = 'cl_pair_p0_';
const BETA_NS = 'cl_pair_p0_beta_';

// ── M0 STAGE: REMOTE BETA MODE ──────────────────────────
// Beta režimas aktyvuojamas TIK per validų ?beta=P01 URL parametrą.
// BETA_NS prasideda NS prefiksu, todėl J0 valymas ('startsWith(NS)')
// automatiškai apims visus beta raktus be jokių pakeitimų clearAllPairP0Data().
let betaMode = false;
let betaParticipantId = null;
let betaState = null; // { participant_id, beta_version, started_at, completed_at, session_feedback:[], post_test_interview }

function parseBetaParam(){
  const params = new URLSearchParams(location.search);
  const raw = params.get('beta');
  if(!raw) return null;
  if(!/^P\d{2}$/.test(raw)) return 'INVALID';
  return raw;
}

function loadOrCreateBetaState(participantId){
  const key = BETA_NS + 'participant';
  try {
    const existing = JSON.parse(localStorage.getItem(key) || 'null');
    if(existing && existing.participant_id === participantId){
      // fix(radar-gate-root-cause): migracija — jei senas state neturi
      // radar_shown lauko (arba jis nėra griežtai boolean), priverstinai
      // nustatyti false. Niekada nemigruoti į true pagal eligibility,
      // sesijų skaičių ar bet kokį kitą požymį.
      if(typeof existing.radar_shown !== 'boolean'){
        existing.radar_shown = false;
      }
      return existing; // atkurti tą patį dalyvį
    }
  } catch(e){}

  const fresh = {
    participant_id: participantId,
    beta_version: 'remote-beta-v1',
    started_at: new Date().toISOString(),
    completed_at: null,
    radar_shown: false, // nustatoma true TIK kai radaro ekranas faktiškai atidarytas
    session_feedback: [],
    post_test_interview: null
  };
  try { localStorage.setItem(key, JSON.stringify(fresh)); } catch(e){}
  return fresh;
}

function saveBetaState(){
  if(!betaState) return;
  try { localStorage.setItem(BETA_NS + 'participant', JSON.stringify(betaState)); } catch(e){}
}

// Patikrina, ar naršyklėje jau yra ankstesnio dalyvio ar ankstesnių Pair P0
// duomenų prieš leidžiant pradėti naują beta dalyvį — apsauga nuo sesijų susimaišymo.
function detectPriorBetaRisk(newParticipantId){
  let existingBetaId = null;
  try {
    const existing = JSON.parse(localStorage.getItem(BETA_NS + 'participant') || 'null');
    if(existing && existing.participant_id) existingBetaId = existing.participant_id;
  } catch(e){}

  const hasOtherParticipant = existingBetaId && existingBetaId !== newParticipantId;
  const hasCompletedSessions = getCompletedSessions().length > 0;

  // Rizika: arba kitas beta dalyvis jau užregistruotas, arba yra completed
  // sesijų, kurios nepriklauso šiam beta dalyviui (pvz. jei beta niekada
  // nebuvo aktyvuotas, bet žmogus jau naudojo P0 įprastu režimu).
  if(hasOtherParticipant) return true;
  if(!existingBetaId && hasCompletedSessions) return true;
  return false;
}

function updateBetaBadge(){
  const badge = document.getElementById('beta-badge');
  const progress = document.getElementById('beta-start-progress');
  if(!badge) return;

  if(betaMode && betaParticipantId){
    const tmpl = txt('beta_badge_label') || 'Beta test · Participant {id}';
    badge.textContent = tmpl.replace('{id}', betaParticipantId);
    badge.style.display = 'inline-block';

    // Rodo sesijų progresą iš karto pradiniame ekrane, ne tik "Ačiū" ekrane.
    // Skaičiuoja tik sesijas su beta feedback įrašu — ta pati logika kaip
    // countBetaCompletedSessions(), be jokio pakeitimo skaičiavime.
    if(progress){
      const count = countBetaCompletedSessions();
      const tmpl2 = txt('beta_sessions_progress') || 'Completed beta sessions: {n} of 3';
      progress.textContent = tmpl2.replace('{n}', count);
      progress.style.display = 'block';
    }
  } else {
    badge.style.display = 'none';
    if(progress) progress.style.display = 'none';
  }
}

function renderBetaPriorRiskScreen(){
  document.getElementById('txt-beta-risk').textContent = txt('beta_prior_risk_text') ||

  document.getElementById('txt-beta-risk-export-clear').textContent = txt('export_and_clear') || 'Export and clear';
  document.getElementById('txt-beta-risk-cancel').textContent = txt('cancel_beta_test') || 'Cancel beta test';

}

}

function handleBetaRiskCancel(){
  // Atšaukti beta testą — grąžinti į paprastą intro be beta parametro poveikio.
  betaMode = false;
  betaParticipantId = null;
  betaState = null;
  show('intro');
}


const IS_DEBUG = new URLSearchParams(location.search).has("debug");

// 25002500 N0 SIX-PAIR QA MODE 25002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500250025002500
const QA_SET_PARAM = new URLSearchParams(location.search).get("set");
const IS_N0_QA = QA_SET_PARAM === "n0-six-v3";
const N0_QA_SET_FILE = "pair-set-n0-six-v3.json";
const N0_QA_CUE_FILE = "pair-cue-n0-six-v3.json";
const N0_QA_NS = "cl_pair_p0_n0qa_";
const N0_QA_SESSIONS = [["P0-001","N0-005","P0-003"],["N0-004","P0-002","N0-006"]];
let n0QaSessionIndex = 0;

// ── PROTOTYPE NINE V1 MODE ───────────────────────────
// Aktyvuojamas tik per ?set=prototype-nine-v1 URL parametrą.
const IS_P9 = QA_SET_PARAM === "prototype-nine-v1";

// ── SESIJOS KILMĖS ŠALTINIS ──────────────────────────
// Vienintelis šaltinis, naudojamas SESSION kūrime, radaro filtre ir eksporte.
const CURRENT_SET_ID =
  IS_P9      ? 'prototype-nine-v1' :
  IS_N0_QA   ? 'n0-six-v3'        :
               'm0-default';

const CURRENT_RADAR_MODE =
  IS_P9 ? 'prototype' : 'reviewed';
const P9_SET_FILE = "pair-set-prototype-nine-v1.json";
const P9_CUE_FILE = "pair-cue-prototype-nine-v1.json";
const P9_NS = "cl_pair_p0_p9_";
const P9_STATE_KEY = P9_NS + 'ui_state'; // tracks expectation_intro_seen, etc.
const P9_EL_VERSION = 'first-radar-v1'; // expectation layer version
const BUILD_ID = 'p9-2026-08-06-provenance-v1';
const SOURCE_BASE_COMMIT = '75efb81';
const P9_FIRST_RADAR_AFTER = 3;
const P9_PAIRS_PER_SESSION = 3;
// Sesijų kompozicija — fiksuota iki pirmo radaro (porų eilė sesijoje randomizuojama)
const P9_SESSIONS = [
  ["P0-001","N0-004","N0-008"],
  ["P0-002","N0-005","N0-007"],
  ["P0-003","N0-006","N0-009"]
];
let p9AllPairs = [];
let p9SessionIndex = 0;

// ── P9 UI STATE HELPERS ──────────────────────────────
function getP9UiState(){
  try { return JSON.parse(localStorage.getItem(P9_STATE_KEY) || '{}'); } catch(e){ return {}; }
}
function setP9UiState(patch){
  const s = getP9UiState();
  localStorage.setItem(P9_STATE_KEY, JSON.stringify({...s, ...patch}));
}
function p9ExpectationIntroSeen(){
  return !!getP9UiState().intro_seen;
}
let p9RadarUnlocked = false;

// ── STATE ────────────────────────────────────────────
let L = {};
let LANGS = {};
let PAIRS = [];
let CUE_DATA = null;
let currentLang = 'lt';
let currentPairIdx = 0;
let pairStartTime = 0;
let bothLoaded = false;
let audioEnabled = false;
let audioStarted = false;

let microQueue = [];
let microIndex = 0;
let microStep = 'cue';
let microCurrentAnswer = null;
let reflectAnswers = {};
let flipByPairId = {}; // pair_id -> boolean: išsaugo A/B randomizaciją visai sesijai
let fbAnswers = {};
let lastImportStatus = null; // { result } arba { error } — išlieka per showHistory() perrenderinimus
let sessionReflection = { response_type: null, text: '' };

let SESSION = {
  session_id: uid(),
  status: 'active',
  started_at: new Date().toISOString(),
  completed_at: null,
  timestamp: new Date().toISOString(),
  language: 'lt',
  viewport_width: window.innerWidth,
  viewport_height: window.innerHeight,
  choices: [],
  reflections: [],
  session_reflection: null,
  feedback: {}
};

// ── UTILS ────────────────────────────────────────────
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}
function txt(key){ return L[key] || key; }

// ── LANGUAGE ─────────────────────────────────────────
// fix(lt-localization): perskaičiuoja jau pasirinktų standartinių cue tekstus
// pagal naują kalbą. Custom (vartotojo įvestas) tekstas ir hard_to_say NIEKADA
// nekeičiami — tik cue_text laukas standartiniams response_type==='cue'
// pasirinkimams. Naudoja cue_id, kad rastų teisingą lt/en reikšmę CUE_DATA
// šaltinyje, o ne palieka tekstą užfiksuotą ta kalba, kuria buvo pasirinktas.
function retranslateChosenCues(lang){
  if(!CUE_DATA) return;

  function findCueById(cueId){
    for(const pair of CUE_DATA.pairs || []){
      for(const img of pair.images || []){
        for(const c of img.cues || []){
          if(c.cue_id === cueId) return c;
        }
      }
    }
    return null;
  }

  Object.keys(reflectAnswers || {}).forEach(key => {
    const answer = reflectAnswers[key];
    if(answer && answer.response_type === 'cue' && answer.cue_id){
      const cue = findCueById(answer.cue_id);
      if(cue){
        answer.cue_text = lang === 'lt' ? cue.lt : cue.en;
      }
    }
  });

  // Taip pat perskaičiuoti jau užbaigtus (SESSION.reflections) įrašus, jei
  // sesija dar aktyvi ir vartotojas grįžta į rezultato/istorijos ekraną
  // pakeitęs kalbą prieš baigiant sesiją.
  if(SESSION && Array.isArray(SESSION.reflections)){
    SESSION.reflections.forEach(r => {
      if(r.response_type === 'cue' && r.cue_id){
        const cue = findCueById(r.cue_id);
        if(cue){
          r.cue_text = lang === 'lt' ? cue.lt : cue.en;
        }
      }
    });
  }
}

function setLang(lang){
  currentLang = lang;
  SESSION.language = lang;
  L = LANGS[lang] || LANGS['lt'] || {};
  retranslateChosenCues(lang);

  document.getElementById('btn-lt').classList.toggle('active', lang === 'lt');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  document.getElementById('txt-subtitle').textContent = txt('intro_subtitle');
  document.getElementById('txt-instruction').textContent = txt('intro_instruction');
  document.getElementById('txt-start').textContent = txt('intro_start');
  document.getElementById('txt-nostimuli').textContent = txt('no_stimuli');
  document.getElementById('pair-prompt').textContent = txt('layer1_prompt');
  document.getElementById('txt-result-header').textContent = txt('your_session') || 'Your session';
  document.getElementById('txt-finish-session').textContent = txt('finish_session') || 'Finish session';
  document.getElementById('txt-fb-header').textContent = txt('feedback_title');
  document.getElementById('txt-fb-submit').textContent = txt('feedback_submit');
  document.getElementById('txt-done-title').textContent = txt('done_title') || 'Thank you';
  document.getElementById('txt-done-sub').textContent = txt('done_sub') || '';
  document.getElementById('txt-view-history').textContent = txt('view_history') || 'View history';
  document.getElementById('txt-start-another').textContent = txt('start_another') || 'Start another session';
  // fix(three-session-limit): kalbos keitimas neturi atskleisti "Pradėti
  // kitą sesiją" mygtuko, jei beta dalyvis jau pasiekė 3 sesijų ribą.
  if(betaMode && betaState && cappedBetaSessionCount() >= 3){
    document.getElementById('txt-start-another').style.display = 'none';
  }
  document.getElementById('txt-history-header').textContent = txt('your_sessions') || 'Your sessions';
  document.getElementById('txt-back-to-intro').textContent = txt('back') || 'Back';
  document.getElementById('txt-back-to-history').textContent = txt('back_to_history') || 'Back to history';
  document.getElementById('txt-beta-invalid').textContent = txt('beta_invalid_id') || 'The beta participant ID is invalid.';
  updateBetaBadge();
  document.getElementById('txt-radar-back').textContent = txt('back_to_history') || 'Back to history';
  document.documentElement.lang = lang;

  updateAudioToggleUI();
  document.getElementById('txt-intro-history-link').textContent = txt('view_history') || 'View history';
}

// ── INIT ─────────────────────────────────────────────
async function init(){
  try {
    const saved = localStorage.getItem(NS + 'audio_enabled');
    audioEnabled = saved === 'true';
  } catch(e){ audioEnabled = false; }

  if(IS_DEBUG){
    document.getElementById('debug-bar').style.display = 'flex';
  }

  const bl = navigator.language || 'lt';
  const detected = bl.startsWith('lt') ? 'lt' : 'en';

  try {
    const r = await fetch('lang.json?v=' + Date.now());
    LANGS = await r.json();
  } catch(e){
    LANGS = { lt:{}, en:{} };
  }

  // ── JSON įkėlimas: M0 default arba N0 QA rinkinys ──
  const pairSetFile = IS_N0_QA ? N0_QA_SET_FILE : IS_P9 ? P9_SET_FILE : 'pair-set.json';
  const cueFile     = IS_N0_QA ? N0_QA_CUE_FILE : IS_P9 ? P9_CUE_FILE : 'pair-cue-v0.1.json';

  let n0QaSetData = null;
  try {
    const r = await fetch(pairSetFile + '?v=' + Date.now());
    const data = await r.json();
    n0QaSetData = data; // išsaugom visą, nes reikia session_composition
    PAIRS = (data.pairs || []).filter(p => p.status === 'active');
  } catch(e){
    PAIRS = [];
  }

  // N0 QA: išsaugoti visas 6 poras, tada filtruoti pagal sesijos kompoziciją
  if(IS_N0_QA && n0QaSetData){
    window._n0QaAllPairs = [...PAIRS];
    const completedN0 = JSON.parse(localStorage.getItem(N0_QA_NS + 'completed') || '[]');
    n0QaSessionIndex = completedN0.length < N0_QA_SESSIONS.length ? completedN0.length : 0;
    const sessionPairIds = N0_QA_SESSIONS[n0QaSessionIndex] || [];
    const shuffled = [...sessionPairIds].sort(() => Math.random() - 0.5);
    PAIRS = shuffled.map(id => PAIRS.find(p => p.pair_id === id)).filter(Boolean);
  }

  // P9: išsaugoti visas 9 poras, filtruoti pagal sesijos kompoziciją
  if(IS_P9 && n0QaSetData){
    p9AllPairs = [...PAIRS];
    const p9Done = JSON.parse(localStorage.getItem(P9_NS + 'completed') || '[]');
    p9RadarUnlocked = p9Done.length >= P9_FIRST_RADAR_AFTER;
    // Kurią sesiją rodyti: iki radaro — fiksuota kompozicija; po radaro — dar nematytos
    if(!p9RadarUnlocked){
      p9SessionIndex = p9Done.length < P9_SESSIONS.length ? p9Done.length : P9_SESSIONS.length - 1;
      const sessionPairIds = P9_SESSIONS[p9SessionIndex] || [];
      const shuffled = [...sessionPairIds].sort(() => Math.random() - 0.5);
      PAIRS = shuffled.map(id => p9AllPairs.find(p => p.pair_id === id)).filter(Boolean);
    } else {
      // Po radaro: pirmiausia dar nematytos poros, paskui leisti kartojimą
      const seenIds = new Set(p9Done.flatMap(s => s.pair_ids || []));
      const unseen = p9AllPairs.filter(p => !seenIds.has(p.pair_id));
      const pool = unseen.length >= P9_PAIRS_PER_SESSION ? unseen : p9AllPairs;
      const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, P9_PAIRS_PER_SESSION);
      PAIRS = shuffled;
    }
  }

  try {
    const r = await fetch(cueFile + '?v=' + Date.now());
    CUE_DATA = await r.json();
  } catch(e){
    CUE_DATA = null;
  }

  setLang(detected);

  // ── N0 QA banner ───────────────────────────────────────
  if(IS_N0_QA){
    const banner = document.getElementById('n0-qa-banner');
    if(banner) banner.style.display = 'block';
  }
  if(IS_P9){
    const banner = document.getElementById('n0-qa-banner');
    if(banner){
      const p9DoneForBanner = JSON.parse(localStorage.getItem(P9_NS + 'completed') || '[]');
      const radarUnlockedForBanner = p9DoneForBanner.length >= P9_FIRST_RADAR_AFTER;
      banner.textContent = radarUnlockedForBanner
        ? 'PROTOTYPE — PIRMAS RADARAS ATRAKINTAS'
        : 'PROTOTYPE — 3 SESIJOS IKI PIRMO RADARO';
      banner.style.display = 'block';
    }
  }

  // ── M0: beta parametro apdorojimas ──────────────────
  const betaParam = parseBetaParam();
  if(betaParam === 'INVALID'){
    show('beta-invalid');
    if(IS_DEBUG){ document.getElementById('dbg-info').textContent = `pairs:${PAIRS.length}`; }
    return;
  }
  if(betaParam){
    betaParticipantId = betaParam;
    betaMode = true;

    if(detectPriorBetaRisk(betaParticipantId)){
      renderBetaPriorRiskScreen();
      if(IS_DEBUG){ document.getElementById('dbg-info').textContent = `pairs:${PAIRS.length}`; }
      return;
    }

    betaState = loadOrCreateBetaState(betaParticipantId);
    updateBetaBadge();
  }

  // ── fix(resume): patikrinti neužbaigtą aktyvią sesiją prieš rodant intro ──
  const resumeCheck = checkForResumableSession();
  applyIntroButtonState(resumeCheck);

  // ── P9: route to correct screen based on progress (after resumeCheck) ───────
  // Priority: 1) unfinished session resume 2) block complete → block radar
  //           3) block in progress + radar unlocked → Radar 1 + progress banner
  //           4) block 1 in progress (1-2) → progress screen
  //           5) expectation (0, unseen) 6) start
  if(IS_P9){
    const n = getP9TotalCompletedCount();
    const blockIndex = getP9CurrentBlockIndex();
    const blockProgress = getP9BlockProgress(blockIndex);

    // 1. Unfinished P9 session in progress — resume it
    if(resumableSnapshot && resumableSnapshot.session && resumableSnapshot.session.set_id === 'prototype-nine-v1'){
      // Let normal resume UI handle — show('intro') with resume buttons
    }
    // 2. Current block just completed — show block radar
    else if(blockProgress === 3){
      showP9BlockRadar(blockIndex);
      return;
    }
    // 3. In block 2+ with sessions in progress — Radar 1 + progress banner
    else if(hasUnlockedRadar() && blockProgress >= 1){
      showP9RadarWithBlockProgress(blockIndex, blockProgress);
      return;
    }
    // 4. Block 1 in progress (1 or 2 sessions done)
    else if(n >= 1 && n < P9_FIRST_RADAR_AFTER){
      renderP9ProgressScreen(blockProgress);
      return;
    }
    // 5. No sessions, expectation not yet seen
    else if(n === 0 && !p9ExpectationIntroSeen()){
      setP9UiState({intro_seen: true});
      renderP9ExpectationScreen();
      return;
    }
    // 6. No sessions, expectation already seen — fall through to show('intro')
  }

  show('intro');

  if(IS_DEBUG){
    document.getElementById('dbg-info').textContent = `pairs:${PAIRS.length}`;
  }
}

function updateAudioToggleUI(){
  const btn = document.getElementById('audio-toggle');
  if(!btn) return;
  const icon = btn.querySelector('.audio-icon');
  const label = document.getElementById('audio-toggle-label');
  btn.classList.toggle('on', audioEnabled);
  if(icon) icon.textContent = audioEnabled ? '🔊' : '🔈';
  if(label) label.textContent = txt('audio_on') || 'Sound';
}

function toggleAudio(){
  audioEnabled = !audioEnabled;
  try { localStorage.setItem(NS + 'audio_enabled', String(audioEnabled)); } catch(e){}
  updateAudioToggleUI();

  const audio = document.getElementById('ambient-audio');
  if(!audio) return;

  if(audioEnabled){
    audio.volume = 0.25;
    audio.play().then(() => { audioStarted = true; }).catch(() => { audioStarted = false; });
  } else {
    audio.pause();
  }
}

function stopAudioSmoothly(){
  const audio = document.getElementById('ambient-audio');
  if(!audio || audio.paused) return;
  const steps = 12, stepTime = 50, startVol = audio.volume;
  let i = 0;
  const fade = setInterval(() => {
    i++;
    audio.volume = Math.max(0, startVol * (1 - i / steps));
    if(i >= steps){ clearInterval(fade); audio.pause(); audio.volume = startVol; }
  }, stepTime);
}

// ── START ─────────────────────────────────────────────
// ── fix(resume): UNFINISHED SESSION RESUME ─────────────
let resumableSnapshot = null; // globaliai pasiekiamas snapshot, jei rastas galimas atkūrimas

// Grąžina: 'none' (nėra aktyvios sesijos), 'resumable' (galima saugiai atkurti),
// arba 'corrupt' (yra duomenų, bet trūksta būtinos struktūros — nerodyti klaidingo Tęsti).
function applyIntroButtonState(resumeCheck){
  const startBtn = document.getElementById('txt-start');
  const resumeBtn = document.getElementById('txt-resume-session');
  const discardBtn = document.getElementById('txt-discard-session');

  if(resumeCheck === 'resumable'){
    startBtn.style.display = 'none';
    resumeBtn.style.display = 'block';
    resumeBtn.textContent = txt('resume_unfinished_session') || 'Resume unfinished session';
    discardBtn.style.display = 'block';
    discardBtn.textContent = txt('discard_unfinished_session') || 'Discard unfinished session';
  } else if(resumeCheck === 'corrupt'){
    startBtn.style.display = 'block';
    startBtn.textContent = txt('intro_start') || 'Start';
    resumeBtn.style.display = 'none';
    discardBtn.style.display = 'block';
    discardBtn.textContent = txt('discard_unfinished_session') || 'Discard unfinished session';
  } else {
    startBtn.style.display = 'block';
    startBtn.textContent = txt('intro_start') || 'Start';
    resumeBtn.style.display = 'none';
    discardBtn.style.display = 'none';
  }
}

function checkForResumableSession(){
  let raw;
  try {
    raw = localStorage.getItem(NS + 'active_session');
  } catch(e){
    return 'none';
  }
  if(!raw) return 'none';

  let snapshot;
  try {
    snapshot = JSON.parse(raw);
  } catch(e){
    resumableSnapshot = null;
    return 'corrupt';
  }

  // Būtina minimali struktūra atkūrimui — jei ko nors trūksta, laikoma sugadinta.
  if(!snapshot || typeof snapshot !== 'object' ||
     !snapshot.session || snapshot.session.status === 'completed' ||
     !Array.isArray(snapshot.session.choices)){
    resumableSnapshot = null;
    return snapshot && snapshot.session ? 'corrupt' : 'none';
  }

  // Beta atskyrimo apsauga: jei snapshot priklauso kitam beta dalyviui
  // (arba buvo sukurtas ne-beta režime, o dabar atidaroma su ?beta=),
  // arba atvirkščiai — neleisti tęsti kaip savo sesijos.
  const snapshotBetaId = snapshot.beta_participant_id || null;
  const currentBetaId = betaMode ? betaParticipantId : null;
  if(snapshotBetaId !== currentBetaId){
    resumableSnapshot = null;
    return 'none'; // svetimo konteksto sesija — traktuoti kaip nesamą, ne kaip klaidą
  }

  resumableSnapshot = snapshot;
  return 'resumable';
}

// Atkuria visą runtime būseną iš snapshot'o ir nukreipia į teisingą ekraną/žingsnį.
function resumeUnfinishedSession(){
  if(!resumableSnapshot) return;

  SESSION = resumableSnapshot.session;
  currentPairIdx = resumableSnapshot.current_pair_idx || 0;
  microIndex = resumableSnapshot.micro_index || 0;
  microStep = resumableSnapshot.micro_step || 'cue';
  reflectAnswers = resumableSnapshot.reflect_answers || {};
  sessionReflection = resumableSnapshot.session_reflection || { response_type: null, text: '' };
  connectionAnswer = resumableSnapshot.connection_answer || { response_type: null, text: '' };
  const stage = resumableSnapshot.screen_stage || 'pair';
  // Atkurti A/B randomizaciją — naudoti išsaugotą, negeneruoti naujos
  flipByPairId = resumableSnapshot.flip_by_pair_id || {};
  // P9: atkurti sesijos indeksą
  if(IS_P9 && resumableSnapshot.p9_session_index !== undefined){
    p9SessionIndex = resumableSnapshot.p9_session_index;
    p9RadarUnlocked = resumableSnapshot.p9_radar_unlocked || false;
    if(Array.isArray(resumableSnapshot.p9_pair_ids) && p9AllPairs.length > 0){
      PAIRS = resumableSnapshot.p9_pair_ids
        .map(id => p9AllPairs.find(p => p.pair_id === id))
        .filter(Boolean);
    }
  }
  // N0 QA: atkurti sesijos indeksą ir porų tvarką
  if(IS_N0_QA && resumableSnapshot.n0_qa_session_index !== null && resumableSnapshot.n0_qa_session_index !== undefined){
    n0QaSessionIndex = resumableSnapshot.n0_qa_session_index;
    // Atkurti PAIRS tą pačią tvarką — ne shuffle iš naujo
    if(Array.isArray(resumableSnapshot.n0_qa_pair_ids) && window._n0QaAllPairs){
      PAIRS = resumableSnapshot.n0_qa_pair_ids
        .map(id => window._n0QaAllPairs.find(p => p.pair_id === id))
        .filter(Boolean);
    }
  }

  if(stage === 'pair'){
    loadPair(currentPairIdx);
  } else if(stage === 'reflect'){
    // Atkurti microQueue iš SESSION.choices (ta pati logika kaip startLayer2())
    microQueue = SESSION.choices.map(choice => {
      const pair = PAIRS.find(p => p.pair_id === choice.pair_id);
      const imgObj = pair
        ? (pair.image_a.id === choice.selected_image_id ? pair.image_a : pair.image_b)
        : null;
      return { imgObj, key: choice.selected_image_id };
    }).filter(x => x.imgObj);

    if(microIndex >= microQueue.length){
      startSessionReflection();
    } else {
      renderMicroStep();
      show('reflect');
    }
  } else if(stage === 'session-reflection'){
    startSessionReflection();
  } else if(stage === 'result'){
    goToResult();
  } else {
    loadPair(currentPairIdx);
  }
}

                 :                                         null,

  show('intro');

  // o ne palikti senus Resume/Discard mygtukus matomus.
  applyIntroButtonState('none');

  // fix: beta žyma ir progresas turi likti matomi nepakitę — updateBetaBadge()
  // naudoja betaMode/betaParticipantId/betaState, kurių ši funkcija neliečia.
