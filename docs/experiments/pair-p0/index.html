function startExperiment(){
  // fix(three-session-limit): neleisti pradėti 4-os beta sesijos. M0 beta
  // testas visada baigiasi po lygiai 3 — jokia UI kelias (Pradėti kitą
  // sesiją, tiesioginis URL, ir t.t.) neturi leisti sukurti daugiau.
  if(betaMode && betaState && countBetaCompletedSessions() >= 3){
    return; // tyliai neleisti — UI mygtukas šiuo momentu jau turėtų būti paslėptas
  }

  // N0 QA: atnaujinti PAIRS pagal aktyvią sesijos kompoziciją
  if(IS_N0_QA){
    const completedN0 = JSON.parse(localStorage.getItem(N0_QA_NS + 'completed') || '[]');
    n0QaSessionIndex = completedN0.length < N0_QA_SESSIONS.length ? completedN0.length : 0;
    const sessionPairIds = N0_QA_SESSIONS[n0QaSessionIndex] || [];
    const shuffled = [...sessionPairIds].sort(() => Math.random() - 0.5);
    const allPairsFlat = window._n0QaAllPairs || PAIRS;
    window._n0QaAllPairs = allPairsFlat; // cache vieną kartą
    PAIRS = shuffled.map(id => allPairsFlat.find(p => p.pair_id === id)).filter(Boolean);
  }

  // P9: atnaujinti PAIRS pagal P9 sesijos logiką
  if(IS_P9){
    const p9Done = JSON.parse(localStorage.getItem(P9_NS + 'completed') || '[]');
    p9RadarUnlocked = p9Done.length >= P9_FIRST_RADAR_AFTER;
    const allP9 = p9AllPairs.length > 0 ? p9AllPairs : PAIRS;
    if(!p9RadarUnlocked){
      p9SessionIndex = p9Done.length < P9_SESSIONS.length ? p9Done.length : P9_SESSIONS.length - 1;
      const ids = P9_SESSIONS[p9SessionIndex] || [];
      PAIRS = [...ids].sort(() => Math.random() - 0.5).map(id => allP9.find(p => p.pair_id === id)).filter(Boolean);
    } else {
      const seenIds = new Set(p9Done.flatMap(s => s.pair_ids || []));
      const unseen = allP9.filter(p => !seenIds.has(p.pair_id));
      const pool = unseen.length >= P9_PAIRS_PER_SESSION ? unseen : allP9;
      PAIRS = [...pool].sort(() => Math.random() - 0.5).slice(0, P9_PAIRS_PER_SESSION);
    }
  }

  if(PAIRS.length === 0){ show('nostimuli'); return; }
  currentPairIdx = 0;

  // Nauja sesija — visiškai naujas objektas, kad senos aktyvios sesijos
  // duomenys niekada nepatektų į naujos sesijos rezultatus.
  SESSION = {
    session_id: uid(),
    status: 'active',
    started_at: new Date().toISOString(),
    completed_at: null,
    timestamp: new Date().toISOString(),
    language: currentLang,
    viewport_width: window.innerWidth,
    viewport_height: window.innerHeight,
    choices: [],
    reflections: [],
    session_reflection: null,
    feedback: {},
    qa_mode: QA_SET_PARAM === 'prototype-nine-v1' || QA_SET_PARAM === 'n0-six-v3',
    set_id: QA_SET_PARAM === 'prototype-nine-v1' ? 'prototype-nine-v1'
          : QA_SET_PARAM === 'n0-six-v3'        ? 'n0-six-v3'
          :                                        'm0-default',
    radar_mode: QA_SET_PARAM === 'prototype-nine-v1' ? 'prototype' : 'reviewed',
    expectation_layer_version: QA_SET_PARAM === 'prototype-nine-v1' ? P9_EL_VERSION : null,
    first_radar_after_sessions: QA_SET_PARAM === 'prototype-nine-v1' ? P9_FIRST_RADAR_AFTER : null,
    pairs_per_session: 3,
    radar_unlocked: QA_SET_PARAM === 'prototype-nine-v1' ? isRadarUnlocked() : null,
    session_index: QA_SET_PARAM === 'prototype-nine-v1' ? (getP9TotalCompletedCount() + 1)
                 : QA_SET_PARAM === 'n0-six-v3'         ? (n0QaSessionIndex + 1)
                 :                                         null,
    build_id: BUILD_ID,
    source_base_commit: SOURCE_BASE_COMMIT
  };
  sessionReflection = { response_type: null, text: '' };
  connectionAnswer = { response_type: null, text: '' };
  reflectAnswers = {};
  flipByPairId = {}; // reset A/B randomizacija naujai sesijai
  currentSessionStage = 'pair';
  saveSession(); // fix(resume): nuo pat pradžios snapshot'as nuoseklus atkūrimui

  loadPair(0);
}

// ── LAYER 1 ───────────────────────────────────────────
function loadPair(idx){
  if(idx >= PAIRS.length){ startLayer2(); return; }

  const pair = PAIRS[idx];
  // Randomizacija: generuoti tik pirmą kartą; resume metu naudoti išsaugotą
  if(!(pair.pair_id in flipByPairId)){
    flipByPairId[pair.pair_id] = Math.random() < 0.5;
  }
  const flip = flipByPairId[pair.pair_id];
  pair._top    = flip ? pair.image_b : pair.image_a;
  pair._bottom = flip ? pair.image_a : pair.image_b;

  document.getElementById('pair-counter').textContent = `${idx + 1} / ${PAIRS.length}`;

  const imgT = document.getElementById('img-top');
  const imgB = document.getElementById('img-bottom');
  const ldT  = document.getElementById('load-top');
  const ldB  = document.getElementById('load-bottom');

  imgT.style.display = 'none'; imgB.style.display = 'none';
  ldT.style.display  = 'block'; ldB.style.display  = 'block';

  bothLoaded = false;
  let tOk = false, bOk = false;
  function check(){ if(tOk && bOk){ bothLoaded = true; pairStartTime = Date.now(); } }

  imgT.onload  = () => { imgT.style.display='block'; ldT.style.display='none'; tOk=true; check(); };
  imgB.onload  = () => { imgB.style.display='block'; ldB.style.display='none'; bOk=true; check(); };
  imgT.onerror = () => { ldT.textContent='?'; tOk=true; check(); };
  imgB.onerror = () => { ldB.textContent='?'; bOk=true; check(); };

  imgT.src = pair._top.src;
  imgB.src = pair._bottom.src;

  show('pair');
}

function choosePair(position){
  if(!bothLoaded) return;
  const latency = Date.now() - pairStartTime;
  const pair = PAIRS[currentPairIdx];
  const selected = position === 'top' ? pair._top : pair._bottom;

  // Pasirinkimo momentu kopijuojami visi metaduomenys — ateityje JSON gali keistis,
  // bet šis eksportas išlieka istoriškai tikslus.
  const choiceMeta = (IS_N0_QA || IS_P9) ? {
    qa_mode: SESSION.qa_mode,
    set_id: CURRENT_SET_ID,
    radar_mode: CURRENT_RADAR_MODE,
    cue_version: pair.cue_version || null,
    asset_status: pair.asset_status || null,
    asset_version: pair.asset_version || null,
    methodology_status: pair.methodology_status || null,
    axis: pair.axis || null,
    axis_status: pair.axis_status || null,
    analysis_eligible: pair.analysis_eligible ?? null,
    exclusion_reason: pair.exclusion_reason || null
  } : { qa_mode: false, set_id: 'm0-default', radar_mode: 'reviewed' };

  SESSION.choices.push({
    pair_id: pair.pair_id, pair_order: currentPairIdx + 1,
    top_image_id: pair._top.id, bottom_image_id: pair._bottom.id,
    selected_image_id: selected.id, selected_position: position,
    choice_latency_ms: latency,
    timestamp: new Date().toISOString(),
    ...choiceMeta
  });

  currentPairIdx++;
  currentSessionStage = 'pair';
  saveSession(); // fix(resume): saugoti po KIEKVIENO pasirinkimo, ne tik pabaigoje
  loadPair(currentPairIdx);
}

// ── LAYER 2 MICRO-FLOW ────────────────────────────────
function getCuesForImage(imageId){
  if(!CUE_DATA) return null;
  for(const pair of CUE_DATA.pairs || []){
    for(const img of pair.images || []){
      if(img.image_id === imageId) return img.cues || [];
    }
  }
  return null;
}

function startLayer2(){
  microQueue = SESSION.choices.map(choice => {
    const pair = PAIRS.find(p => p.pair_id === choice.pair_id);
    const imgObj = pair
      ? (pair.image_a.id === choice.selected_image_id ? pair.image_a : pair.image_b)
      : null;
    return { imgObj, key: choice.selected_image_id };
  }).filter(x => x.imgObj);

  reflectAnswers = {};
  microIndex = 0;
  currentSessionStage = 'reflect';
  saveSession();

  if(microQueue.length === 0){ goToResult(); return; }

  renderMicroStep();
  show('reflect');
}

function updateMicroProgress(){
  const el = document.getElementById('micro-progress');
  if(!el) return;
  const tmpl = txt('micro_progress') || 'Image {current} of {total}';
  el.textContent = tmpl.replace('{current}', microIndex + 1).replace('{total}', microQueue.length);
}

function renderMicroStep(){
  updateMicroProgress();
  const item = microQueue[microIndex];
  const body = document.getElementById('reflect-body');
  body.innerHTML = '';
  const btn = document.getElementById('reflect-next-btn');

  if(microStep === 'cue') renderCueStep(item, body, btn);
  else renderReflectionStep(item, body, btn);
}

function renderCueStep(item, body, btn){
  // Cue tvarka deterministinė: naudojamas JSON eilės indeksas, ne Math.random().
  // Todėl refresh atkuria tą pačią cue tvarką be papildomo snapshot'o lauko.
  const key = item.key;
  const cues = getCuesForImage(key);
  const otherLabel = txt('layer2_other') || 'Another thought';
  const skipLabel = txt('layer2_skip') || 'Hard to say';
  const stepLabel = txt('step_cue') || 'What caught your attention?';
  const placeholderLabel = txt('layer2_placeholder') || '...';
  const lang = currentLang;

  const div = document.createElement('div');

  if(cues && cues.length > 0){
    const cueButtons = cues.map(c => {
      const label = lang === 'lt' ? c.lt : c.en;
      return `<button class="cue-btn" onclick="pickCue('${c.cue_id}', this)">${label}</button>`;
    }).join('');

    div.innerHTML = `
      <div class="micro-image"><img src="${item.imgObj.src}" alt="" loading="lazy"></div>
      <div class="micro-step-label">${stepLabel}</div>
      <div class="cue-options" id="cue-opts">
        ${cueButtons}
        <button class="cue-btn" id="custom-btn" onclick="pickCustomCue(this)">${otherLabel}</button>
        <input class="cue-custom-input" id="custom-input" maxlength="40"
          placeholder="${placeholderLabel}" oninput="onCustomCueTyping(this)">
        <button class="cue-btn" id="skip-btn" onclick="pickHardToSay(this)">${skipLabel}</button>
      </div>
    `;
  } else {
    div.innerHTML = `
      <div class="micro-image"><img src="${item.imgObj.src}" alt="" loading="lazy"></div>
      <div class="micro-step-label">${stepLabel}</div>
      <div class="reflection-row">
        <input class="reflection-input" id="fallback-input" maxlength="40"
          placeholder="${placeholderLabel}" oninput="onFallbackTyping(this)">
        <button class="reflection-skip-btn" onclick="pickHardToSay(null)">${skipLabel}</button>
      </div>
    `;
  }

  body.appendChild(div);
  microCurrentAnswer = null;
  btn.disabled = true;
  const isLastCue = microIndex === microQueue.length - 1;
  btn.textContent = isLastCue ? (txt('continue_btn') || 'Continue') : (txt('layer2_next') || 'Next');
  btn.onclick = confirmCueStep;
}

function pickCue(cueId, el){
  const key = microQueue[microIndex].key;
  const cues = getCuesForImage(key);
  const cue = cues.find(c => c.cue_id === cueId);
  if(!cue) return;

  document.querySelectorAll('#cue-opts .cue-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  const ci = document.getElementById('custom-input');
  if(ci){ ci.classList.remove('show'); ci.value=''; }

  microCurrentAnswer = { response_type:'cue', cue_id:cueId, cue_text: currentLang==='lt'?cue.lt:cue.en, vector: cue.vector, confidence: cue.confidence ?? null };
  document.getElementById('reflect-next-btn').disabled = false;
}

function pickCustomCue(el){
  document.querySelectorAll('#cue-opts .cue-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  const ci = document.getElementById('custom-input');
  ci.classList.add('show'); ci.focus();
  microCurrentAnswer = { response_type:'custom', custom_words:'', vector:null };
  document.getElementById('reflect-next-btn').disabled = true;
}

function onCustomCueTyping(el){
  const parts = el.value.trim().split(/\s+/).filter(Boolean);
  if(parts.length > 3) el.value = parts.slice(0,3).join(' ');
  const trimmed = el.value.trim();
  microCurrentAnswer = { response_type:'custom', custom_words:trimmed, vector:null };
  document.getElementById('reflect-next-btn').disabled = trimmed.length === 0;
}

function onFallbackTyping(el){
  const parts = el.value.trim().split(/\s+/).filter(Boolean);
  if(parts.length > 3) el.value = parts.slice(0,3).join(' ');
  const trimmed = el.value.trim();
  microCurrentAnswer = { response_type:'custom', custom_words:trimmed, vector:null };
  document.getElementById('reflect-next-btn').disabled = trimmed.length === 0;
}

function pickHardToSay(el){
  document.querySelectorAll('#cue-opts .cue-btn').forEach(b => b.classList.remove('selected'));
  if(el) el.classList.add('selected');
  microCurrentAnswer = { response_type:'hard_to_say', vector:null };
  document.getElementById('reflect-next-btn').disabled = false;
}

function confirmCueStep(){
  if(!microCurrentAnswer) return;
  const key = microQueue[microIndex].key;
  reflectAnswers[key] = reflectAnswers[key] || {};
  Object.assign(reflectAnswers[key], microCurrentAnswer, { image_id: key });

  if(microCurrentAnswer.response_type === 'hard_to_say' || microCurrentAnswer.response_type === 'custom'){
    reflectAnswers[key].reflection_text = '';
    saveSession(); // fix(resume): cue pasirinkimas išsaugomas iškart, prieš advanceMicroFlow()
    advanceMicroFlow();
  } else {
    microStep = 'reflection';
    microCurrentAnswer = null;
    saveSession(); // fix(resume): cue jau pasirinktas ir patvirtintas — išsaugoti PRIEŠ
                    // patenkant į reflection žingsnį, kad perkrovimas negrąžintų atgal į cue
    renderMicroStep();
  }
}

function renderReflectionStep(item, body, btn){
  const key = item.key;
  const chosen = reflectAnswers[key];
  const question = txt('reflection_question') || 'What feels familiar about this choice?';
  const placeholder = txt('reflection_placeholder') || 'Up to 5 words...';
  const skipLabel = txt('reflection_skip') || 'Skip';
  // fix(resume): atkūrus po perkrovimo, jau įvestas (bet dar nepatvirtintas)
  // tekstas turi būti rodomas teksto lauke, ne tik saugomas atmintyje.
  const existingText = (chosen.reflection_text || '');

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="micro-image"><img src="${item.imgObj.src}" alt="" loading="lazy"></div>
    <div class="chosen-cue-badge">${chosen.cue_text}</div>
    <div class="reflection-question">${question}</div>
    <div class="reflection-row">
      <input class="reflection-input" id="reflection-input" maxlength="60"
        placeholder="${placeholder}" value="${existingText.replace(/"/g,'&quot;')}" oninput="onReflectionTyping(this)">
      <button class="reflection-skip-btn" onclick="skipReflectionStep()">${skipLabel}</button>
    </div>
  `;
  body.appendChild(div);

  btn.disabled = false;
  const isLast = microIndex === microQueue.length - 1;
  btn.textContent = isLast ? (txt('continue_btn') || 'Continue') : (txt('layer2_next') || 'Next');
  btn.onclick = () => confirmReflectionStep();
}

function onReflectionTyping(el){
  const parts = el.value.trim().split(/\s+/).filter(Boolean);
  if(parts.length > 5) el.value = parts.slice(0,5).join(' ');
  const key = microQueue[microIndex].key;
  reflectAnswers[key].reflection_text = el.value.trim();
  debouncedSaveSession(); // fix(resume): dalinis tekstas turi išlikti po perkrovimo
}

function skipReflectionStep(){
  const key = microQueue[microIndex].key;
  reflectAnswers[key].reflection_text = '';
  confirmReflectionStep();
}

function confirmReflectionStep(){ advanceMicroFlow(); }

function advanceMicroFlow(){
  microIndex++;
  microStep = 'cue';
  microCurrentAnswer = null;
  saveSession(); // fix(resume): išsaugoti kiekvieno mikro-srauto žingsnio pabaigoje
  if(microIndex >= microQueue.length) startSessionReflection();
  else renderMicroStep();
}

// ── RESULT ────────────────────────────────────────────
// Sesijos vektorius — confidence svertinis vidurkis, naudojant TIK standartinius
// cue su vektoriumi. custom, hard_to_say, individuali/sesijos refleksija ir latencija
// niekada nedalyvauja šiame skaičiavime.
function computeSessionVector(){
  // P9 prototype mode: use prototype_vector for ineligible pairs
  const validEntries = SESSION.reflections.filter(r => {
    if(r.response_type !== 'cue') return false;
    if(IS_P9 && r.vector === null && r.prototype_vector && typeof r.prototype_vector === 'object'){
      return true; // prototype_vector accepted in P9 mode
    }
    return r.vector && typeof r.vector === 'object' &&
      typeof r.confidence === 'number' &&
      (r.analysis_eligible !== false);
  });

  if(validEntries.length === 0){
    return { vector: null, valid_vector_responses: 0, session_vector_confidence: null };
  }

  const weightedSum = { aw:0, cs:0, cr:0 };
  let confSum = 0;

  validEntries.forEach(r => {
    const v = (IS_P9 && r.vector === null && r.prototype_vector) ? r.prototype_vector : r.vector;
    const w = r.confidence ?? 0.5;
    weightedSum.aw += (v.aw || 0) * w;
    weightedSum.cs += (v.cs || 0) * w;
    weightedSum.cr += (v.cr || 0) * w;
    confSum += w;
  });

  const vector = confSum > 0 ? {
    aw: +(weightedSum.aw / confSum).toFixed(3),
    cs: +(weightedSum.cs / confSum).toFixed(3),
    cr: +(weightedSum.cr / confSum).toFixed(3)
  } : null;

  const avgConfidence = +(confSum / validEntries.length).toFixed(3);

  return {
    vector: vector,
    valid_vector_responses: validEntries.length,
    session_vector_confidence: avgConfidence
  };
}

function startSessionReflection(){
  logDebugEvent('SESSION_REFLECTION_OPENED');

  currentSessionStage = 'session-reflection';
  saveSession(); // fix(resume): žymi tikslų etapą, kad perkrovimas negrąžintų atgal į mikro-srautą

  document.getElementById('txt-sr-header').textContent = txt('session_reflection_header') || 'Look at your choices together';

  const body = document.getElementById('sr-body');
  body.innerHTML = '';

  // Pasirinktų vaizdų santrauka originalia seka
  SESSION.choices.forEach(choice => {
    const pair = PAIRS.find(p => p.pair_id === choice.pair_id);
    const imgObj = pair
      ? (pair.image_a.id === choice.selected_image_id ? pair.image_a : pair.image_b)
      : null;
    const ref = reflectAnswers[choice.selected_image_id];

    let label = '';
    if(ref){
      if(ref.response_type === 'cue') label = ref.cue_text;
      else if(ref.response_type === 'custom') label = ref.custom_words;
      else if(ref.response_type === 'hard_to_say') label = (txt('hard_to_say_label') || 'Hard to say');
    }

    const item = document.createElement('div');
    item.className = 'session-summary-item';
    item.innerHTML = `
      <div class="session-summary-thumb">
        ${imgObj ? `<img src="${imgObj.src}" alt="" loading="lazy">` : ''}
      </div>
      <div class="session-summary-text">${label}</div>
    `;
    body.appendChild(item);
  });

  // Pagrindinis sesijos klausimas
  const q = document.createElement('div');
  q.className = 'session-question';
  q.textContent = txt('session_question') || 'When you see these choices together, what stands out most to you?';
  body.appendChild(q);

  const sub = document.createElement('div');
  sub.className = 'session-subnote';
  sub.textContent = txt('session_subnote') || 'You do not need to explain them. A brief observation is enough.';
  body.appendChild(sub);

  const textarea = document.createElement('textarea');
  textarea.className = 'session-textarea';
  textarea.id = 'session-reflection-textarea';
  textarea.maxLength = 180;
  textarea.placeholder = txt('session_placeholder') || 'What do you notice?';
  textarea.value = sessionReflection.response_type === 'text' ? sessionReflection.text : '';
  textarea.oninput = onSessionReflectionTyping;
  body.appendChild(textarea);

  const charcount = document.createElement('div');
  charcount.className = 'session-charcount';
  charcount.id = 'session-charcount';
  charcount.textContent = `${textarea.value.length} / 180`;
  body.appendChild(charcount);

  const notYetBtn = document.createElement('button');
  notYetBtn.className = 'not-yet-btn';
  notYetBtn.id = 'not-yet-btn';
  notYetBtn.textContent = txt('not_stated') || 'I will not name it this time';
  notYetBtn.onclick = toggleNotYet;
  if(sessionReflection.response_type === 'not_stated') notYetBtn.classList.add('on');
  body.appendChild(notYetBtn);

  updateSessionReflectionButton();
  show('session-reflection');
}

function onSessionReflectionTyping(){
  const textarea = document.getElementById('session-reflection-textarea');
  const trimmed = textarea.value.slice(0, 180);
  if(textarea.value !== trimmed) textarea.value = trimmed;

  document.getElementById('session-charcount').textContent = `${textarea.value.length} / 180`;

  // Rašymas automatiškai atšaukia "Dar nepastebiu"
  const notYetBtn = document.getElementById('not-yet-btn');
  if(notYetBtn) notYetBtn.classList.remove('on');

  sessionReflection = {
    response_type: textarea.value.length > 0 ? 'text' : null,
    text: textarea.value
  };

  logDebugEvent('SESSION_REFLECTION_TEXT_CHANGED');
  updateSessionReflectionButton();
  debouncedSaveSession(); // fix(resume): dalinis sesijos pastebėjimo tekstas turi išlikti
}

function toggleNotYet(){
  const notYetBtn = document.getElementById('not-yet-btn');
  const textarea = document.getElementById('session-reflection-textarea');
  const isOn = notYetBtn.classList.contains('on');

  if(isOn){
    // Atšaukti pasirinkimą
    notYetBtn.classList.remove('on');
    sessionReflection = { response_type: null, text: '' };
  } else {
    notYetBtn.classList.add('on');
    textarea.value = '';
    document.getElementById('session-charcount').textContent = '0 / 180';
    sessionReflection = { response_type: 'not_stated', text: '' };
    logDebugEvent('SESSION_REFLECTION_NOT_STATED_SELECTED');
  }

  updateSessionReflectionButton();
}

function updateSessionReflectionButton(){
  const btn = document.getElementById('sr-next-btn');
  if(!btn) return;
  btn.textContent = txt('view_session') || 'View session';

  const hasText = sessionReflection.response_type === 'text' && sessionReflection.text.trim().length > 0;
  const isNotYet = sessionReflection.response_type === 'not_stated';
  btn.disabled = !(hasText || isNotYet);
}

function confirmSessionReflection(){
  const finalText = sessionReflection.response_type === 'text'
    ? sessionReflection.text.trim()
    : '';

  SESSION.session_reflection = {
    response_type: sessionReflection.response_type,
    text: finalText,
    created_at: new Date().toISOString()
  };

  logDebugEvent('SESSION_REFLECTION_SAVED');
  goToResult();
}

function logDebugEvent(eventName){
  if(!IS_DEBUG) return;
  try {
    const logs = JSON.parse(localStorage.getItem(NS + 'debug') || '[]');
    logs.push({ t: Date.now(), event: eventName });
    localStorage.setItem(NS + 'debug', JSON.stringify(logs.slice(-200)));
  } catch(e){}
}

function goToResult(){
  SESSION.reflections = Object.entries(reflectAnswers).map(([id, r]) => {
    // N0 QA: papildomi laukai analizės atsekamumuiui
    let pairMeta = {};
    if(IS_N0_QA){
      // rasti pair pagal image_id
      const matchPair = PAIRS.find(p => p.image_a && p.image_a.id === id || p.image_b && p.image_b.id === id);
      if(matchPair){
        pairMeta = {
          asset_status: matchPair.asset_status || null,
          asset_version: matchPair.asset_version || null,
          axis_status: matchPair.axis_status || null,
          analysis_eligible: matchPair.analysis_eligible ?? true,
          exclusion_reason: matchPair.exclusion_reason || null,
          methodology_status: matchPair.methodology_status || null,
          cue_version: matchPair.cue_version || null
        };
      }
    }
    // P9: enrich reflection with prototype_vector from cue data
    // Use SESSION.set_id as authoritative source — IS_P9 may be stale if URL changed
    let protoVec = null;
    if((IS_P9 || SESSION.set_id === 'prototype-nine-v1') && r.cue_id && CUE_DATA){
      for(const pair of CUE_DATA.pairs || []){
        for(const img of pair.images || []){
          const cue = (img.cues || []).find(c => c.cue_id === r.cue_id);
          if(cue){ protoVec = cue.prototype_vector || null; break; }
        }
        if(protoVec !== null) break;
      }
    }
    // Provenance fields — use SESSION.set_id as authoritative source (not IS_P9 which may be stale)
    const isP9Refl = SESSION.set_id === 'prototype-nine-v1';
    const reflProvenance = (isP9Refl || IS_N0_QA) ? {
      set_id: SESSION.set_id || CURRENT_SET_ID,
      qa_mode: SESSION.qa_mode ?? false,
      radar_mode: SESSION.radar_mode || CURRENT_RADAR_MODE
    } : {
      set_id: 'm0-default',
      qa_mode: false,
      radar_mode: 'reviewed'
    };
    return {
      image_id:id, response_type:r.response_type||null, cue_id:r.cue_id||null,
      cue_text:r.cue_text||null, custom_words:r.custom_words||null,
      reflection_text:r.reflection_text||'', vector:r.vector||null,
      prototype_vector: protoVec,
      vector_source: isP9Refl ? (r.vector ? 'reviewed' : protoVec ? 'prototype_only' : null) : null,
      confidence:r.confidence ?? null,
      ...reflProvenance,
      ...pairMeta
    };
  });

  const vecResult = computeSessionVector();
  SESSION.session_vector = vecResult.vector;
  SESSION.valid_vector_responses = vecResult.valid_vector_responses;
  SESSION.session_vector_confidence = vecResult.session_vector_confidence;
  SESSION.vector_model_version = 'pair-cue-v0.1';

  const body = document.getElementById('result-body');
  body.innerHTML = '';

  // ── I ETAPAS: "Ką pasirinkai šioje sesijoje" — konkretus atspindys ──
  // Šaltinio prioritetas kiekvienam pasirinkimui: žmogaus tekstas > cue > neįvardyta.
  // Sistema NIEKADA nepriskiria temos, motyvo ar interpretacijos.
  const choiceReflectHeader = document.createElement('div');
  choiceReflectHeader.className = 'choice-reflect-title';
  choiceReflectHeader.textContent = txt('your_session_choices') || 'What you chose in this session';
  body.appendChild(choiceReflectHeader);

  SESSION.choices.forEach((choice, idx) => {
    const ref = SESSION.reflections.find(r => r.image_id === choice.selected_image_id);

    let displayText = null;
    let sourceLabel = null;

    if(ref){
      const humanText = (ref.custom_words && ref.custom_words.trim()) ||
                         (ref.reflection_text && ref.reflection_text.trim());
      if(humanText){
        displayText = humanText;
        sourceLabel = txt('your_words') || 'Your words';
      } else if(ref.cue_text && ref.cue_text.trim()){
        displayText = ref.cue_text;
        sourceLabel = txt('chosen_wording') || 'Chosen wording';
      }
    }

    const item = document.createElement('div');
    item.className = 'choice-reflect-item';

    const numberSpan = document.createElement('span');
    numberSpan.className = 'choice-reflect-number';
    numberSpan.textContent = (idx + 1) + '. ';
    item.appendChild(numberSpan);

    if(displayText){
      const textSpan = document.createElement('span');
      textSpan.className = 'choice-reflect-text';
      textSpan.textContent = '"' + displayText + '"'; // saugus DOM metodas
      item.appendChild(textSpan);
    } else {
      const emptySpan = document.createElement('span');
      emptySpan.className = 'choice-reflect-text empty';
      emptySpan.textContent = txt('choice_unstated') || 'This choice was left unstated.';
      item.appendChild(emptySpan);
    }

    body.appendChild(item);
  });

  const closingLine = document.createElement('div');
  closingLine.className = 'choice-reflect-closing';
  closingLine.textContent = txt('choices_closing_line') ||
    'These are the words you chose in this session. ConflictLab does not interpret them for you.';
  body.appendChild(closingLine);

  // ── Refleksinis klausimas: ar žmogus pats mato ryšį? ──
  renderConnectionQuestion(body);

  // ── Tavo pastebėjimas — esamas session_reflection (B etapas), nepakeista ──
  const sr = SESSION.session_reflection || { response_type: null, text: '' };
  const obsBlock = document.createElement('div');
  obsBlock.className = 'result-observation';

  const obsLabel = document.createElement('div');
  obsLabel.className = 'result-observation-label';
  obsLabel.textContent = txt('your_observation') || 'Your observation';
  obsBlock.appendChild(obsLabel);

  const obsText = document.createElement('div');
  obsText.className = 'result-observation-text';
  if(sr.response_type === 'text' && sr.text){
    obsText.textContent = sr.text;
  } else if(sr.response_type === 'not_stated' || sr.response_type === 'not_yet'){
    obsText.textContent = txt('observation_not_stated') || 'This time, the overall observation was left unstated.';
    obsText.classList.add('empty');
  } else {
    obsText.textContent = '';
  }
  obsBlock.appendChild(obsText);
  body.appendChild(obsBlock);

  // Metodinė riba — visada rodoma
  const scope = document.createElement('div');
  scope.className = 'result-scope-note';
  scope.textContent = txt('result_scope_note') ||
    'This is a trace of your choices in this moment, not a description of your personality.';
  body.appendChild(scope);

  saveSession();
  show('result');
}

// ── FEEDBACK ──────────────────────────────────────────
// ── I ETAPAS: Refleksinis klausimas apie ryšį tarp pasirinkimų ──
// Trys atsakymai — "taip", "dar ne", "nenoriu" — VISADA saugomi atskirai.
// Sistema niekada nesujungia "dar nematau" su "nenoriu įvardyti" į vieną būseną.
let connectionAnswer = { response_type: null, text: '' };

// Fiksuoja, kuriame sesijos etape vartotojas šiuo metu yra — naudojama
// tik atkūrimo po perkrovimo logikai, niekur kitur nekeičia elgesio.
// Galimos reikšmės: 'pair' | 'reflect' | 'session-reflection' | 'result'
let currentSessionStage = 'pair';

function renderConnectionQuestion(body){
  connectionAnswer = { response_type: null, text: '' };

  const questionBlock = document.createElement('div');
  questionBlock.className = 'connection-question-block';

  const q = document.createElement('div');
  q.className = 'connection-question-text';
  q.textContent = txt('connection_question') || 'Do you notice anything that may connect these choices?';
  questionBlock.appendChild(q);

  const options = document.createElement('div');
  options.className = 'connection-options';

  const optYes = document.createElement('button');
  optYes.className = 'connection-opt-btn';
  optYes.textContent = txt('connection_yes') || 'Yes, I will name it';
  optYes.onclick = () => selectConnectionOption('text', optYes, questionBlock);
  options.appendChild(optYes);

  const optNotYet = document.createElement('button');
  optNotYet.className = 'connection-opt-btn';
  optNotYet.textContent = txt('connection_not_seen') || 'I do not see it yet';
  optNotYet.onclick = () => selectConnectionOption('not_seen_yet', optNotYet, questionBlock);
  options.appendChild(optNotYet);

  const optPrefer = document.createElement('button');
  optPrefer.className = 'connection-opt-btn';
  optPrefer.textContent = txt('connection_prefer_not') || 'I prefer not to name it';
  optPrefer.onclick = () => selectConnectionOption('prefer_not_to_state', optPrefer, questionBlock);
  options.appendChild(optPrefer);

  questionBlock.appendChild(options);
  body.appendChild(questionBlock);

  // Iš pat pradžių bendras CTA neaktyvus, kol nepasirinktas nė vienas variantas.
  updateFinishButtonState();
}

// Vienas bendras CTA (jau egzistuojantis 'txt-finish-session' mygtukas) valdomas
// pagal connectionAnswer būseną. Jokio atskiro "Išsaugoti" mygtuko šiam laukui.
function updateFinishButtonState(){
  const btn = document.getElementById('txt-finish-session');
  if(!btn) return;

  let isValid = false;
  if(connectionAnswer.response_type === 'text'){
    isValid = connectionAnswer.text.trim().length > 0;
  } else if(connectionAnswer.response_type === 'not_seen_yet' || connectionAnswer.response_type === 'prefer_not_to_state'){
    isValid = true;
  }
  btn.disabled = !isValid;
}

function selectConnectionOption(type, btn, questionBlock){
  questionBlock.querySelectorAll('.connection-opt-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  // Pašalinti seną teksto lauką, jei buvo (perjungiant tarp variantų)
  const oldInput = questionBlock.querySelector('.connection-text-wrap');
  const previousText = connectionAnswer.text; // atkurti tekstą, jei grįžtama į 'text' variantą
  if(oldInput) oldInput.remove();

  if(type === 'text'){
    connectionAnswer = { response_type: 'text', text: previousText || '' };

    const wrap = document.createElement('div');
    wrap.className = 'connection-text-wrap';

    const textarea = document.createElement('textarea');
    textarea.className = 'connection-textarea';
    textarea.placeholder = txt('connection_placeholder') || 'What do you notice?';
    textarea.value = connectionAnswer.text;
    wrap.appendChild(textarea);

    questionBlock.appendChild(wrap);
    textarea.focus();

    // Tekstas nuolat saugomas realiu laiku — jokio atskiro "Išsaugoti" veiksmo.
    // Bendras CTA (Tęsti/Baigti sesiją) perskaičiuojamas su kiekvienu pakeitimu.
    // input/change/compositionend apima visus mobilios klaviatūros/IME atvejus
    // be reikalavimo prarasti fokusą ar spausti Enter.
    function refreshTextState(){
      connectionAnswer.text = textarea.value;
      updateFinishButtonState();
      debouncedSaveSession(); // fix(resume): dalinis ryšio teksto įvedimas turi išlikti
    }
    textarea.addEventListener('input', refreshTextState);
    textarea.addEventListener('change', refreshTextState);
    textarea.addEventListener('compositionend', refreshTextState);
  } else {
    connectionAnswer = { response_type: type, text: '' };
  }

  updateFinishButtonState();
}

function saveConnectionReflection(){
  const trimmed = connectionAnswer.text.trim();
  if(connectionAnswer.response_type === 'text' && trimmed.length === 0){
    return; // neleisti vien tarpų / tuščio teksto kaip galutinio atsakymo
  }
  if(!connectionAnswer.response_type) return; // nepasirinktas nė vienas variantas

  SESSION.session_connection_reflection = {
    response_type: connectionAnswer.response_type,
    text: connectionAnswer.response_type === 'text' ? trimmed : '',
    created_at: new Date().toISOString()
  };

  saveSession();
}

function goToFeedback(){
  saveConnectionReflection(); // išsaugoti galutinį session_connection_reflection prieš pereinant toliau
  stopAudioSmoothly();
  const body = document.getElementById('fb-body');
  body.innerHTML = '';
  fbAnswers = {};

  const qs = [
    { key:'surprised', text:'feedback_q1', type:'yn' },
    { key:'helped_notice', text:'feedback_q2', type:'yn' },
    { key:'felt_forced', text:'feedback_q3', type:'yn' },
    { key:'would_repeat', text:'feedback_q4', type:'yn' },
    { key:'repeat_reason', text:'feedback_q4_why', type:'text' },
  ];

  qs.forEach(q => {
    const div = document.createElement('div');
    div.className = 'fb-item';
    if(q.type === 'yn'){
      div.innerHTML = `
        <div class="fb-q">${txt(q.text)}</div>
        <div class="fb-yn">
          <button class="fb-btn" onclick="setFb('${q.key}',true,this)">${txt('yes')}</button>
          <button class="fb-btn" onclick="setFb('${q.key}',false,this)">${txt('no')}</button>
        </div>`;
    } else {
      div.innerHTML = `
        <div class="fb-q">${txt(q.text)}</div>
        <textarea class="fb-textarea" rows="2" oninput="fbAnswers['${q.key}']=this.value" placeholder="..."></textarea>`;
    }
    body.appendChild(div);
  });

  show('feedback');
}

function setFb(key, val, btn){
  fbAnswers[key] = val;
  btn.closest('.fb-yn').querySelectorAll('.fb-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
}

function submitFeedback(){
  SESSION.feedback = {
    surprised: fbAnswers.surprised ?? null,
    helped_notice: fbAnswers.helped_notice ?? null,
    felt_forced: fbAnswers.felt_forced ?? null,
    would_repeat: fbAnswers.would_repeat ?? null,
    repeat_reason: fbAnswers.repeat_reason || ''
  };
  completeSession();
  stopAudioSmoothly();

  // M0: beta režime po feedback rodomas papildomas 6 klausimų blokas,
  // susietas su ką tik užbaigtos sesijos session_id, prieš "Ačiū" ekraną.
  if(betaMode){
    renderBetaSessionFeedback();
    return;
  }

  // P9: route to correct screen after session (expectation/progress/radar)
  // Use SESSION.set_id as authoritative source — IS_P9 could be stale if URL changed
  const isP9Session = IS_P9 || SESSION.set_id === 'prototype-nine-v1';
  if(isP9Session){
    routeP9AfterSession();
    return;
  }

  show('done');
}

// ── STORAGE ───────────────────────────────────────────
// Išsaugo TARPINĘ (dar nebaigtą) sesijos būseną — atskirai nuo užbaigtų sesijų istorijos.
// Tai leidžia grįžti/perkrauti puslapį nepradant iš naujo, bet neterš completed_sessions,
// kol sesija realiai nepasiekia Finish veiksmo.
// Saugo pilną runtime snapshot'ą (ne tik SESSION objektą), kad puslapio
// perkrovimas galėtų atkurti TIKSLŲ tašką sraute — kurią porą rodyti, kurį
// mikro-srauto žingsnį, kokie atsakymai jau įvesti. Iškviečiama po
// KIEKVIENO reikšmingo veiksmo (pasirinkimo, cue, refleksijos), ne tik
// sesijos pabaigoje.
let saveSessionDebounceTimer = null;
// Debounced versija — naudojama teksto įvedimo įvykiuose, kad kiekvienas
// simbolis nekurtų atskiro localStorage.setItem() iškvietimo. Galutinis
// tekstas visada išsaugomas per 400ms po paskutinio simbolio arba iš karto
// per tikrąją saveSession() bet kuriame kitame perėjimo taške.
function debouncedSaveSession(){
  if(saveSessionDebounceTimer) clearTimeout(saveSessionDebounceTimer);
  saveSessionDebounceTimer = setTimeout(saveSession, 400);
}

function saveSession(){
  SESSION.audio_enabled = audioEnabled;
  SESSION.audio_started = audioStarted;

  const snapshot = {
    session: SESSION,
    current_pair_idx: currentPairIdx,
    micro_index: microIndex,
    micro_step: microStep,
    reflect_answers: reflectAnswers,
    session_reflection: sessionReflection,
    connection_answer: connectionAnswer,
    // Ekranas, kuriame vartotojas paliko sesiją — naudojamas atkūrimo metu,
    // kad žinotume, ar reikia grąžinti į poros pasirinkimą, mikro-srautą,
    // sesijos refleksiją ar rezultato ekraną.
    screen_stage: currentSessionStage,
    beta_participant_id: betaMode ? betaParticipantId : null,
    // Randomizacijos išsaugojimas — resume metu naudojama ta pati A/B pusė
    flip_by_pair_id: flipByPairId,
    // N0 QA: sesijos porų tvarka (būtina teisingam resume)
    n0_qa_session_index: IS_N0_QA ? n0QaSessionIndex : null,
    n0_qa_pair_ids: IS_N0_QA ? PAIRS.map(p => p.pair_id) : null,
    // P9: sesijos būsena resume
    p9_session_index: IS_P9 ? p9SessionIndex : null,
    p9_radar_unlocked: IS_P9 ? p9RadarUnlocked : null,
    p9_pair_ids: IS_P9 ? PAIRS.map(p => p.pair_id) : null
  };

  try {
    localStorage.setItem(NS + 'active_session', JSON.stringify(snapshot));
  } catch(e){}
}

// Sesiją laiko GALUTINAI užbaigta tik po Finish veiksmo (po feedback).
// Tik tada ji patenka į completed_sessions ir gali būti naudojama istorijai/radarui.
function completeSession(){
  SESSION.status = 'completed';
  SESSION.completed_at = new Date().toISOString();
  SESSION.audio_enabled = audioEnabled;
  SESSION.audio_started = audioStarted;

  try {
    // P9: atnaujinti užbaigtų sesijų sąrašą PRIEŠ išsaugant į completed_sessions,
    // kad SESSION.radar_unlocked eksporte atspindėtų teisingą būseną po šios sesijos.
    if(IS_P9){
      const doneP9 = JSON.parse(localStorage.getItem(P9_NS + 'completed') || '[]');
      if(!doneP9.find(s => s.session_id === SESSION.session_id)){
        const newSequenceIndex = doneP9.length; // 0-based pozicija prieš push
        const newBlockIndex = Math.floor(newSequenceIndex / 3) + 1;
        const newBlockSessionIndex = (newSequenceIndex % 3) + 1;
        doneP9.push({
          session_id: SESSION.session_id,
          session_index: p9SessionIndex,
          pair_ids: PAIRS.map(p => p.pair_id),
          radar_block_index: newBlockIndex,
          block_session_index: newBlockSessionIndex
        });
        // Atnaujinti SESSION su bloko informacija
        SESSION.radar_block_index = newBlockIndex;
        SESSION.block_session_index = newBlockSessionIndex;
        localStorage.setItem(P9_NS + 'completed', JSON.stringify(doneP9));
        // Atrakinti radarą po P9_FIRST_RADAR_AFTER sesijų
        // p9RadarUnlocked synced from isRadarUnlocked() — single source
        p9RadarUnlocked = isRadarUnlocked();
      }
      // Atnaujinti SESSION prieš serializuojant — fiksuoja teisingą radar_unlocked eksporte
      SESSION.radar_unlocked = p9RadarUnlocked;
    }

    const completed = JSON.parse(localStorage.getItem(NS + 'completed_sessions') || '[]');
    const i = completed.findIndex(s => s.session_id === SESSION.session_id);
    if(i >= 0) completed[i] = SESSION; else completed.push(SESSION);
    localStorage.setItem(NS + 'completed_sessions', JSON.stringify(completed));

    // N0 QA: sekti, kurios N0 sesijos užbaigtos
    if(IS_N0_QA){
      const doneN0 = JSON.parse(localStorage.getItem(N0_QA_NS + 'completed') || '[]');
      if(!doneN0.includes(SESSION.session_id)){
        doneN0.push(SESSION.session_id);
        localStorage.setItem(N0_QA_NS + 'completed', JSON.stringify(doneN0));
      }
    }

    // Užbaigta sesija nebėra "aktyvi" — išvalyti tarpinę būseną
    localStorage.removeItem(NS + 'active_session');
  } catch(e){}
}

function getCompletedSessions(){
  try {
    return JSON.parse(localStorage.getItem(NS + 'completed_sessions') || '[]');
  } catch(e){
    return [];
  }
}

// ── RADAR ELIGIBILITY ─────────────────────────────────
const RADAR_MODEL_VERSION = 'pair-cue-v0.1';
const RADAR_MIN_SESSIONS = 3;

// ── REŽIMO ŠALTINIS: sesijų skaičius ir radaro vartai ──────────────────────
// Vienintelis šaltinis, kurį naudoja ir radaro vartai, ir skaitiklio tekstas.
// M0 / beta: skaičiuoja isSessionRadarEligible() sesiją.
// P9: skaičiuoja užbaigtas P9 sesiją iš cl_pair_p0_p9_ namespace.

function getCompletedSessionCount(){
  if(IS_P9){
    try {
      const done = JSON.parse(localStorage.getItem(P9_NS + 'completed') || '[]');
      return Array.isArray(done) ? done.length : 0;
    } catch(e){ return 0; }
  }
  // M0 / beta: pass 'm0' mode explicitly
  return (betaMode ? getEligibleBetaSessions() : getEligibleSessions('m0')).length;
}

function getFirstRadarThreshold(){
  return RADAR_MIN_SESSIONS; // 3 visada
}

function isRadarUnlocked(){
  return getCompletedSessionCount() >= getFirstRadarThreshold();
}

// ── P9 BLOCK MODEL HELPERS ────────────────────────────────────────────────────
// P9_NS+'completed' yra chronologinis append-only sąrašas (vienas rašymo taškas
// completeSession() su !find() apsauga). Pozicija sąraše = sesijos eilės numeris.

// Bendras P9 sesijų skaičius (visų blokų).
function getP9TotalCompletedCount(){
  try {
    const done = JSON.parse(localStorage.getItem(P9_NS + 'completed') || '[]');
    return Array.isArray(done) ? done.length : 0;
  } catch(e){ return 0; }
}

// Bloko numeris (1-based) pagal sesijų skaičių: 1–3→1, 4–6→2, 7–9→3.
function getP9CurrentBlockIndex(){
  const n = getP9TotalCompletedCount();
  if(n === 0) return 1;
  return Math.ceil(n / 3);
}

// Kiek sesijų užbaigta bloko viduje (1, 2 arba 3).
function getP9BlockProgress(blockIndex){
  const n = getP9TotalCompletedCount();
  const blockStart = (blockIndex - 1) * 3; // 0-based pozicija
  const inBlock = n - blockStart;
  return Math.max(0, Math.min(3, inBlock));
}

// Ar konkretus blokas pilnas (3 sesijos).
function isP9BlockComplete(blockIndex){
  return getP9BlockProgress(blockIndex) >= 3;
}

// Ar bent vienas pilnas blokas egzistuoja (bent vienas radaras atrakintas).
function hasUnlockedRadar(){
  return isP9BlockComplete(1);
}

// Grąžina completed_sessions objektus, priklausančius konkrečiam blokui.
// Naudoja poziciją P9_NS+'completed' sąraše (chronologinis append-only).
function getP9SessionsForBlock(blockIndex){
  try {
    const done = JSON.parse(localStorage.getItem(P9_NS + 'completed') || '[]');
    const start = (blockIndex - 1) * 3;
    const blockEntries = done.slice(start, start + 3);
    const ids = new Set(blockEntries.map(s => s.session_id));
    return getCompletedSessions().filter(s => ids.has(s.session_id));
  } catch(e){ return []; }
}

// Apskaičiuoja radaro vektorių iš konkretaus bloko sesijų.
// Grąžina { aw, cs, cr, session_count, reviewed_count, proto_count }
// arba null jei sesijų nėra.
function computeP9BlockTrace(blockIndex){
  const sessions = getP9SessionsForBlock(blockIndex);
  if(sessions.length === 0) return null;
  let reviewed = 0, proto = 0;
  const sum = { aw: 0, cs: 0, cr: 0 };
  sessions.forEach(s => {
    (s.reflections || []).forEach(r => {
      if(r.response_type === 'cue'){
        if(r.vector && r.vector_source === 'reviewed'){
          sum.aw += r.vector.aw || 0;
          sum.cs += r.vector.cs || 0;
          sum.cr += r.vector.cr || 0;
          reviewed++;
        } else if(r.prototype_vector && r.vector_source === 'prototype_only'){
          sum.aw += r.prototype_vector.aw || 0;
          sum.cs += r.prototype_vector.cs || 0;
          sum.cr += r.prototype_vector.cr || 0;
          proto++;
        }
      }
    });
  });
  const total = reviewed + proto;
  if(total === 0) return null;
  return {
    aw: +(sum.aw / total).toFixed(3),
    cs: +(sum.cs / total).toFixed(3),
    cr: +(sum.cr / total).toFixed(3),
    session_count: sessions.length,
    reviewed_count: reviewed,
    proto_count: proto
  };
}

// Sesija tinkama radarui tik jei atitinka VISUS kriterijus.
// Netinkamos sesijos NIEKADA netrinamos, nemigruojamos ir lieka istorijoje —
// jos tiesiog neįtraukiamos į radaro skaičiavimą ir progreso skaitiklį.
// Senos M0 sesijos (sukurtos prieš set_id lauką) — tik tos, kuriose VISOS poros yra P0
const LEGACY_M0_PAIR_IDS = new Set(['P0-001','P0-002','P0-003']);

function isSessionRadarEligible(s, mode){
  if(s.status !== 'completed') return false;

  // Nustatyti tikrąjį režimą iš set_id
  const sid = s.set_id || null;

  if(mode === 'prototype'){
    // P9 radaras: tik prototype-nine-v1 sesijos
    return sid === 'prototype-nine-v1';
  }

  // M0 radaras (default)
  if(sid === 'm0-default' || sid === null){
    // Suderinamumas su senomis sesijomis be set_id: tik jei VISOS poros yra P0
    if(sid === null){
      const choices = s.choices || [];
      if(choices.length === 0) return false;
      if(!choices.every(c => LEGACY_M0_PAIR_IDS.has(c.pair_id))) return false;
    }
    // Vektoriaus kokybės patikrinimai
    if(!s.session_vector || typeof s.session_vector !== 'object') return false;
    if(typeof s.valid_vector_responses !== 'number' || s.valid_vector_responses < 2) return false;
    if(typeof s.session_vector_confidence !== 'number' || !isFinite(s.session_vector_confidence)) return false;
    for(const axis of ['aw','cs','cr']){
      const v = s.session_vector[axis];
      if(typeof v !== 'number' || !isFinite(v) || v < -1 || v > 1) return false;
    }
    return true;
  }

  // n0-six-v3 ir bet koks kitas set_id — nei M0, nei P9 radare
  return false;
}

function getEligibleSessions(mode){
  const m = mode || (IS_P9 ? 'prototype' : 'm0');
  return getCompletedSessions().filter(s => isSessionRadarEligible(s, m));
}

// Apskaičiuoja "dabartinį pėdsaką" — paprastą vidurkį paskutinių N eligible
// sesijų vektorių (N = RADAR_MIN_SESSIONS arba visos, jei mažiau).
// Tai NĖRA asmenybės įvertinimas — tik šios akimirkos pasirinkimų agregatas.
function computeCurrentTrace(eligibleSessions){
  if(eligibleSessions.length === 0) return null;

  const recent = eligibleSessions.slice(-RADAR_MIN_SESSIONS);
  const sum = { aw:0, cs:0, cr:0 };
  recent.forEach(s => {
    sum.aw += s.session_vector.aw;
    sum.cs += s.session_vector.cs;
    sum.cr += s.session_vector.cr;
  });
  const n = recent.length;

  return {
    aw: +(sum.aw/n).toFixed(3),
    cs: +(sum.cs/n).toFixed(3),
    cr: +(sum.cr/n).toFixed(3),
    session_count: n
  };
}

// ── RADAR RENDERING ────────────────────────────────────
// Trikampis radaras trims ašims (aw/cs/cr) su viena taškų forma.
// Naudojame SVG, nes tai vienintelis paprastas būdas nupiešti tokį grafiką
// be papildomos bibliotekos.
function renderRadarSVG(vector){
  const size = 260;
  const center = size / 2;
  const maxRadius = 95;

  // Šešios kryptys, tolygiai išdėstytos aplink centrą (60° tarp kiekvienos).
  // KIEKVIENA ašis (aw/cs/cr) turi DVI priešingas geometrines kryptis.
  // 0 visada yra centre. Teigiama reikšmė plečiasi tik į + kryptį,
  // neigiama — tik į − kryptį. Priešinga pusė lieka nulinėje (centro) padėtyje.
  // Jokios (value+1)/2 transformacijos — tai būtų klaidinga, nes paverstų
  // kryptį į "kiekį" ir sunaikintų dvipolę prasmę.
  const directions = [
    { key:'aw+', angle:-90,  value: Math.max(vector.aw, 0) },
    { key:'cr+', angle:-30,  value: Math.max(vector.cr, 0) },
    { key:'cs-', angle:30,   value: Math.max(-vector.cs, 0) },
    { key:'aw-', angle:90,   value: Math.max(-vector.aw, 0) },
    { key:'cr-', angle:150,  value: Math.max(-vector.cr, 0) },
    { key:'cs+', angle:210,  value: Math.max(vector.cs, 0) },
  ];

  // Vizualinio matomumo dėlei naudojama švelni netiesinė skalė (galia 0.7) su
  // minimaliu matomu spinduliu, o ne gryna kvadratinė šaknis (kuri per stipriai
  // išpučia mažas reikšmes). Tikras nulis lieka centre; bet koks nenulinis
  // signalas gauna minimalų matomą ilgį, kad kryptis nebūtų prarasta taške.
  // SVARBU: tai tik PIEŠIMO mastelis. Tikslios skaitinės reikšmės (aw/cs/cr)
  // visada rodomos nepakeistos tekstu po grafiku — būtent jos yra pagrindinis
  // dydžio šaltinis, ne spindulio ilgis. Metodinė pastaba apie tai rodoma vartotojui.
  const MIN_VISIBLE_PX = 5;
  function toXY(angleDeg, normalizedValue){
    const rad = angleDeg * Math.PI / 180;
    let r;
    if(normalizedValue <= 0){
      r = 0;
    } else {
      r = MIN_VISIBLE_PX + (maxRadius - MIN_VISIBLE_PX) * Math.pow(normalizedValue, 0.7);
    }
    return {
      x: center + r * Math.cos(rad),
      y: center + r * Math.sin(rad)
    };
  }

  const points = directions.map(d => toXY(d.angle, Math.abs(d.value)));
  const polygonPoints = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // Ašių linijos ir žymės — visos šešios kryptys vizualiai lygiavertės,
  // jokia kryptis nėra pabrėžta kaip "geresnė" ar "viršutinė".
  const axisLines = directions.map(d => {
    const end = toXY(d.angle, 1);
    return `<line x1="${center}" y1="${center}" x2="${end.x.toFixed(1)}" y2="${end.y.toFixed(1)}" stroke="#32323A" stroke-width="1"/>`;
  }).join('');

  const labelRadius = maxRadius + 22;
  const axisLabels = directions.map(d => {
    const pos = toXY(d.angle, 1 + (22/maxRadius));
    return `<text x="${pos.x.toFixed(1)}" y="${pos.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="#6E6A64" font-size="12">${d.key}</text>`;
  }).join('');

  const nodeCircles = points.map(p =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#7C9E8F"/>`
  ).join('');

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${center}" cy="${center}" r="${maxRadius}" fill="none" stroke="#1E1E24" stroke-width="1"/>
      <circle cx="${center}" cy="${center}" r="${maxRadius/2}" fill="none" stroke="#1E1E24" stroke-width="1"/>
      ${axisLines}

function routeP9AfterSession(){

  if(blockProgress === 3){

function showRadar(){
  // P9: add provisional label
  if(IS_P9){
    const existing = document.getElementById('p9-radar-label');
    if(!existing){
      const lbl = document.createElement('div');
      lbl.id = 'p9-radar-label';
      lbl.style.cssText = 'text-align:center;font-size:.7rem;font-weight:600;letter-spacing:.06em;color:#c8900a;text-transform:uppercase;margin-bottom:8px';
      lbl.textContent = 'PROTOTIPO RADARAS — PRELIMINARUS';
      const radarEl = document.getElementById('radar-area') || document.querySelector('.radar-wrap');
      if(radarEl) radarEl.prepend(lbl);
    }
  }
  // fix(radar-data-source-unify): beta kontekste radaro TURINYS (ne tik
  // eligibility sprendimas) remiasi TIK pirmomis 3 beta sesijomis — tuo
  // pačiu rinkiniu, kurį naudoja eligibility patikra ir eksportas. Taip
  // radaras, "N iš 3" progresas ir eksportuotas JSON visada sutampa.
  // Ne-beta įprastame Pair P0 sraute elgesys nepakitęs — naudojamas pilnas
  // getEligibleSessions().
  // Naudoti vieningą režimo šaltinį — veikia M0, beta ir P9 režimuose
  const count = getCompletedSessionCount();
  const threshold = getFirstRadarThreshold();
  const unlocked = isRadarUnlocked();

  // P9: radar content uses prototype vectors from P9 sessions
  // M0/beta: uses eligible sessions as before
  const eligible = IS_P9
    ? [] // P9 computes trace from P9 sessions below
    : (betaMode ? getEligibleBetaSessions() : getEligibleSessions('m0'));

  document.getElementById('txt-radar-header').textContent = txt('your_trace') || 'Your current trace';

  const body = document.getElementById('radar-body');
  body.innerHTML = '';

  if(!unlocked){
    // Progreso kortelė lieka DIDELĖ tik kol radaras dar neatrakintas.
    const progressTmpl = txt('radar_progress') || '{n} of {total} sessions for your current trace';
    const progressBox = document.createElement('div');
    progressBox.className = 'radar-progress-box';
    progressBox.innerHTML = `
      <div class="radar-progress-text">${progressTmpl.replace('{n}', count).replace('{total}', threshold)}</div>
    `;
    const sub = document.createElement('div');
    sub.className = 'radar-progress-sub';
    sub.textContent = txt('radar_not_enough') || 'Complete more sessions to see your current trace.';
    progressBox.appendChild(sub);
    body.appendChild(progressBox);
    show('radar');
    return;
  }

  // P9: compute trace from prototype vectors stored in completed sessions
  let trace;
  let p9ReviewedCount = 0;
  let p9ProtoCount = 0;
  if(IS_P9){
    try {
      const p9Done = JSON.parse(localStorage.getItem(P9_NS + 'completed') || '[]');
      const p9SessionIds = new Set(p9Done.map(s => s.session_id));
      const p9Sessions = getCompletedSessions().filter(s => p9SessionIds.has(s.session_id));
      // Count reviewed vs prototype responses
      p9Sessions.forEach(s => {
        (s.reflections || []).forEach(r => {
          if(r.response_type === 'cue'){
            if(r.vector && r.vector_source === 'reviewed') p9ReviewedCount++;
            else if(r.prototype_vector && r.vector_source === 'prototype_only') p9ProtoCount++;
          }
        });
      });
      trace = p9Sessions.length > 0 ? computeCurrentTrace(p9Sessions) : null;
    } catch(e){ trace = null; }
    if(!trace){
      trace = { vector: {aw:0, cs:0, cr:0}, session_count: count, valid_vector_responses: 0 };
    }
  } else {
    trace = computeCurrentTrace(eligible);
  }

  // Suskaičiuoti bendrą galiojančių vektorinių pasirinkimų kiekį per naudotas sesijas
  // P9: enrich radar screen with result layer (header, boundary, reflection, actions)
  if(IS_P9 && unlocked){
    // renderP9RadarResultLayer is called after body is populated, at end of showRadar
  }

  const sessionsForStats = IS_P9 ? [] : eligible.slice(-RADAR_MIN_SESSIONS);
  const recentSessions = sessionsForStats;
  const totalVectorResponses = recentSessions.reduce((sum, s) => sum + (s.valid_vector_responses || 0), 0);

  const chartWrap = document.createElement('div');
  chartWrap.className = 'radar-chart-wrap';
  chartWrap.innerHTML = renderRadarSVG(trace);
  body.appendChild(chartWrap);

  // Metodinė pastaba apie netiesinį vizualinį mastelį — būtina, kad vartotojas
  // nesuprastų spindulio ilgio kaip tiesioginės skaitinės reikšmės projekcijos.
  const scaleNote = document.createElement('div');
  scaleNote.className = 'radar-scale-note';
  scaleNote.textContent = txt('radar_scale_note') ||
    'Small values are visually amplified so the directions remain visible. Exact magnitudes are shown in the numbers below.';
  body.appendChild(scaleNote);

  // Kompaktiška aprėpties eilutė vietoj didelės progreso kortelės, kai jau atrakinta
  const scopeLine = document.createElement('div');
  scopeLine.className = 'radar-scope-line';
  // P9: show prototype vs reviewed breakdown; M0: standard text
  let scopeTmpl;
  if(IS_P9){
    const total = p9ReviewedCount + p9ProtoCount;
    scopeTmpl = `Pagrįsta ${count} sesijomis · ${total} įtraukti pasirinkimai (${p9ReviewedCount} peržiūrėti · ${p9ProtoCount} prototipo)`;
  } else {
    scopeTmpl = txt('radar_based_on') || 'Based on {sessions} sessions · {responses} vector choices';
  }
  if(IS_P9){
    scopeLine.textContent = scopeTmpl; // already built with counts above
  } else {
    scopeLine.textContent = scopeTmpl
      .replace('{sessions}', trace.session_count)
      .replace('{responses}', totalVectorResponses);
  }
  body.appendChild(scopeLine);

  const axisValues = document.createElement('div');
  axisValues.className = 'radar-axis-values';
  const fmt = (v) => (v >= 0 ? '+' : '') + v.toFixed(2);
  axisValues.innerHTML = `
    <div class="radar-axis-item"><div class="radar-axis-label">AW</div><div class="radar-axis-value">${fmt(trace.aw)}</div></div>
    <div class="radar-axis-item"><div class="radar-axis-label">CS</div><div class="radar-axis-value">${fmt(trace.cs)}</div></div>
    <div class="radar-axis-item"><div class="radar-axis-label">CR</div><div class="radar-axis-value">${fmt(trace.cr)}</div></div>
  `;
  body.appendChild(axisValues);

  const scope = document.createElement('div');
  scope.className = 'result-scope-note';
  scope.textContent = txt('radar_scope_note') ||
    'This shape is built from your chosen responses across the last 3 eligible sessions. It is not a personality assessment.';
  body.appendChild(scope);

  // P9: add enrichment layer (boundary, reflection, question, actions)
  if(IS_P9 && unlocked){
    renderP9RadarResultLayer(body);
  }

  show('radar');
}

// ── HISTORY ───────────────────────────────────────────
function formatHistoryDate(isoString){
  const d = new Date(isoString);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const time = d.toLocaleTimeString(currentLang === 'lt' ? 'lt-LT' : 'en-US', {hour:'2-digit', minute:'2-digit'});
  if(isToday){
    const todayLabel = txt('today') || 'Today';
    return `${todayLabel}, ${time}`;
  }
  return d.toLocaleDateString(currentLang === 'lt' ? 'lt-LT' : 'en-US') + ', ' + time;
}

function showHistory(){
  const sessions = getCompletedSessions().slice().reverse(); // naujausios viršuje
  const body = document.getElementById('history-body');
  body.innerHTML = '';

  // fix(resume): nebaigta aktyvi sesija rodoma ATSKIRAI nuo completed sąrašo,
  // su aiškia "Nebaigta sesija" žyma ir "Tęsti" veiksmu. Niekada nerodoma
  // kaip užbaigta istorijos kortelė, niekada neskaičiuojama beta/radaro logikoje.
  const resumeCheckInHistory = checkForResumableSession();
  if(resumeCheckInHistory === 'resumable'){
    const unfinishedItem = document.createElement('div');
    unfinishedItem.className = 'history-item';
    unfinishedItem.style.borderColor = 'var(--accent)';

    const label = document.createElement('div');
    label.className = 'observation-label';
    label.textContent = txt('unfinished_session_label') || 'Unfinished session';
    unfinishedItem.appendChild(label);

    const resumeLink = document.createElement('button');
    resumeLink.className = 'btn-primary';
    resumeLink.style.marginTop = '10px';
    resumeLink.textContent = txt('resume_unfinished_session') || 'Resume unfinished session';
    resumeLink.onclick = resumeUnfinishedSession;
    unfinishedItem.appendChild(resumeLink);

    // fix: leisti pašalinti nebaigtą sesiją tiesiai iš istorijos ekrano, ne
    // tik iš intro. Po pašalinimo perrenderinti ŠĮ (istorijos) ekraną, kad
    // naudotojas liktų vietoje, o ne būtų netikėtai nukreiptas kitur.
    const discardLink = document.createElement('button');
    discardLink.className = 'btn-ghost';
    discardLink.style.marginTop = '8px';
    discardLink.textContent = txt('discard_unfinished_session') || 'Discard unfinished session';
    discardLink.onclick = () => {
      discardUnfinishedSession(); // pati funkcija jau daro show('intro'), bet čia norime likti istorijoje
      showHistory();
    };
    unfinishedItem.appendChild(discardLink);

    body.appendChild(unfinishedItem);
  }

  // ── Eksporto / importo valdikliai ──────────────────
  const transferBlock = document.createElement('div');
  transferBlock.className = 'history-transfer-block';

  const exportBtn = document.createElement('button');
  exportBtn.className = 'history-transfer-btn';
  exportBtn.textContent = txt('export_history') || 'Export history';
  exportBtn.onclick = exportHistoryFile;
  transferBlock.appendChild(exportBtn);

  const importBtn = document.createElement('button');
  importBtn.className = 'history-transfer-btn';
  importBtn.textContent = txt('import_history') || 'Import history';
  importBtn.onclick = () => document.getElementById('history-import-input').click();
  transferBlock.appendChild(importBtn);

  body.appendChild(transferBlock);

  const privacyNote = document.createElement('div');
  privacyNote.className = 'history-privacy-note';
  privacyNote.textContent = txt('history_privacy_note') ||
    'Your history is stored in this browser. You control the export file — ConflictLab does not upload it to a server.';
  body.appendChild(privacyNote);

  // ── J0 ETAPAS: Duomenų valdymas — vizualiai atskirtas, ne pagrindinis CTA ──
  const dataMgmt = document.createElement('div');
  dataMgmt.className = 'data-mgmt-block';

  const dataMgmtTitle = document.createElement('div');
  dataMgmtTitle.className = 'data-mgmt-title';
  dataMgmtTitle.textContent = txt('data_management') || 'Data management';
  dataMgmt.appendChild(dataMgmtTitle);

  const clearBtn = document.createElement('button');
  clearBtn.className = 'btn-danger-outline';
  clearBtn.textContent = txt('clear_browser_data') || 'Clear data in this browser';
  clearBtn.onclick = () => openClearModal(false);
  dataMgmt.appendChild(clearBtn);

  const exportClearBtn = document.createElement('button');
  exportClearBtn.className = 'btn-danger-outline';
  exportClearBtn.textContent = txt('export_and_clear') || 'Export and clear';
  exportClearBtn.onclick = () => openClearModal(true);
  dataMgmt.appendChild(exportClearBtn);

  const clearStatusHolder = document.createElement('div');
  clearStatusHolder.id = 'clear-status-holder';
  if(lastClearStatus){
    const statusDiv = document.createElement('div');
    statusDiv.className = 'clear-success-status';
    statusDiv.textContent = lastClearStatus;
    clearStatusHolder.appendChild(statusDiv);
  }
  dataMgmt.appendChild(clearStatusHolder);

  body.appendChild(dataMgmt);

  // Vieta importo rezultato pranešimui. Jei ankstesnis importas jau įvyko
  // (lastImportStatus egzistuoja), atkuriame jį iškart — kad santrauka
  // liktų matoma net po showHistory() perrenderinimo arba grįžus į šį ekraną.
  const importStatusHolder = document.createElement('div');
  importStatusHolder.id = 'history-import-status';
  body.appendChild(importStatusHolder);
  if(lastImportStatus){
    showImportStatus(lastImportStatus);
  }

  // Nuoroda į radarą — visada rodoma, net jei dar nepakanka sesijų.
  // fix(radar-nav-path): istorijos ekranas TAIP PAT turi turėti veikiantį
  // kelią į radarą beta režime — ne tik pabaigos ekranas. Abu keliai naudoja
  // tą pačią openRadarAsBeta() funkciją, kuri teisingai žymi radar_shown
  // TIK po realaus radaro ekrano parodymo, nepriklausomai nuo to, per kurį
  // mygtuką vartotojas ten pateko.
  const radarLink = document.createElement('button');
  radarLink.className = 'btn-ghost';
  radarLink.style.marginBottom = '16px';
  radarLink.textContent = txt('view_trace') || 'View your current trace';
  radarLink.onclick = () => {
    if(betaMode){
      openRadarAsBeta(); // žymi radar_shown TIK jei realiai eligible ir parodoma
    } else {
      showRadar();
    }
  };
  body.appendChild(radarLink);

  if(sessions.length === 0){
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = txt('cannot_find_sessions') || 'Cannot find your earlier sessions?';
    body.appendChild(empty);

    const hint = document.createElement('div');
    hint.className = 'history-empty-hint';
    hint.textContent = txt('empty_history_hint') ||
      'They may be stored in another browser on this device, for example Chrome instead of the in-app browser used by Skool or another app. Open the page in your usual browser or import a previously exported history file.';
    body.appendChild(hint);

    show('history');
    return;
  }

  sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.onclick = () => showHistoryDetail(s.session_id);

    const dateDiv = document.createElement('div');
    dateDiv.className = 'history-date';
    dateDiv.textContent = formatHistoryDate(s.completed_at || s.started_at);
    item.appendChild(dateDiv);

    const countTmpl = txt('choices_count') || '{n} choices';
    const countDiv = document.createElement('div');
    countDiv.className = 'history-count';
    countDiv.textContent = countTmpl.replace('{n}', s.choices.length);
    item.appendChild(countDiv);

    // PRIORITETO TAISYKLĖ: jei sesija turi session_connection_reflection (I etapas),
    // rodyti TIK jį. Senas session_reflection (B etapas) tuo atveju visai
    // neapdorojamas — kad niekada nesusidurtų prieštaringi tekstai vienoje kortelėje.
    // Tik jei session_connection_reflection neegzistuoja, taikoma sena H logika.
    const cr = s.session_connection_reflection;

    if(cr && (cr.response_type === 'text' || cr.response_type === 'not_seen_yet' || cr.response_type === 'prefer_not_to_state')){
      if(cr.response_type === 'text' && cr.text){
        const label = document.createElement('div');
        label.className = 'observation-label';
        label.textContent = txt('your_observation') || 'Your observation';
        item.appendChild(label);

        const crDiv = document.createElement('div');
        crDiv.className = 'history-observation';
        crDiv.textContent = cr.text; // saugus DOM metodas
        item.appendChild(crDiv);
      } else if(cr.response_type === 'not_seen_yet'){
        const crDiv = document.createElement('div');
        crDiv.className = 'history-observation empty';
        crDiv.textContent = txt('connection_history_not_seen') || 'A connection between the choices has not yet been named.';
        item.appendChild(crDiv);
      } else if(cr.response_type === 'prefer_not_to_state'){
        const crDiv = document.createElement('div');
        crDiv.className = 'history-observation empty';
        crDiv.textContent = txt('connection_history_prefer_not') || 'You chose not to name a connection.';
        item.appendChild(crDiv);
      }
    } else {
      // Fallback — sena H etapo logika, naudojama tik kai naujo lauko visai nėra.
      const sr = s.session_reflection;
      let obsText = '';
      let isStated = false;
      if(sr){
        if(sr.response_type === 'text' && sr.text){ obsText = sr.text; isStated = true; }
        else if(sr.response_type === 'not_stated' || sr.response_type === 'not_yet') obsText = (txt('observation_not_stated') || '');
      }
      if(obsText){
        if(isStated){
          const label = document.createElement('div');
          label.className = 'observation-label';
          label.textContent = txt('your_observation') || 'Your observation';
          item.appendChild(label);
        }
        const obsDiv = document.createElement('div');
        obsDiv.className = 'history-observation';
        obsDiv.textContent = obsText; // saugus DOM metodas, ne innerHTML
        item.appendChild(obsDiv);
      }
    }

    body.appendChild(item);
  });

  show('history');
}

// ── HISTORY EXPORT (H stage) ───────────────────────────
// Švarus perkėlimo failas — TIK completed sesijos, jokios techninės/debug
// informacijos, jokios aktyvios sesijos. Skiriasi nuo debug JSON eksporto.
// ── J0 STAGE: SAFE LOCAL DATA CLEAR ───────────────────
// KRITINĖ SAUGUMO TAISYKLĖ: šalinami TIK localStorage raktai, kurie
// prasideda NS prefiksu ('cl_pair_p0_'). Niekada nenaudojamas
// localStorage.clear() ir niekada nešalinami raktai už šio prefikso ribų.
let lastClearStatus = null; // rodomas kaip sėkmės pranešimas, lieka matomas iki kito veiksmo
let pendingExportBeforeClear = false;

function hasAnyPairP0Data(){
  return Object.keys(localStorage).some(key => key.startsWith(NS));
}

function clearAllPairP0Data(){
  const keysToRemove = Object.keys(localStorage).filter(key => key.startsWith(NS));
  keysToRemove.forEach(key => localStorage.removeItem(key));
  return keysToRemove;
}

function openClearModal(withExport){
  pendingExportBeforeClear = withExport;

  if(!hasAnyPairP0Data()){
    // Nulinės istorijos atvejis — tik informacinis pranešimas, jokio destruktyvaus modalo.
    const holder = document.getElementById('clear-status-holder');
    if(holder){
      holder.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'clear-success-status';
      msg.textContent = txt('no_data_to_clear') || 'There is no Pair P0 data to clear in this browser.';
      holder.appendChild(msg);
    }
    return;
  }

  if(withExport){
    // "Eksportuoti ir išvalyti" — pirma paleidžiamas eksportas, tik tada modalas.
    try {
      exportHistoryFile();
    } catch(e){
      console.warn('Export before clear failed:', e);
      return; // jei eksportas nepavyko, valymo nevykdyti
    }
  }

  const modal = document.getElementById('clear-data-modal');
  const checkbox = document.getElementById('clear-confirm-checkbox');
  checkbox.checked = false;

  document.getElementById('txt-clear-modal-title').textContent = txt('clear_data_title') || 'Clear data';

  let modalText = txt('clear_data_warning') ||
    'All Pair P0 sessions stored in this browser, the active session, and technical Pair P0 data will be removed. Export your history first if you want to keep it.';
  if(withExport){
    modalText = (txt('export_started_note') || 'The export download has started. Before clearing the data, check that the file was saved.') + ' ' + modalText;
  }
  document.getElementById('clear-modal-text').textContent = modalText;

  const activeNote = document.getElementById('clear-modal-active-note');
  if(SESSION && SESSION.choices && SESSION.choices.length > 0 && SESSION.status === 'active'){
    activeNote.textContent = txt('active_session_will_be_removed') || 'The started but unfinished session will also be removed.';
    activeNote.style.display = 'block';
  } else {
    activeNote.style.display = 'none';
  }

  document.getElementById('txt-clear-checkbox-label').textContent = txt('clear_checkbox_label') ||
    'I understand that this data cannot be restored without a previously exported file.';
  document.getElementById('txt-clear-cancel').textContent = txt('cancel') || 'Cancel';
  document.getElementById('clear-confirm-btn').textContent = txt('clear_data_confirm') || 'Clear data';
  document.getElementById('clear-confirm-btn').disabled = true;

  modal.style.display = 'flex';
}

function closeClearModal(){
  document.getElementById('clear-data-modal').style.display = 'none';
}

function updateClearConfirmButton(){
  const checkbox = document.getElementById('clear-confirm-checkbox');
  document.getElementById('clear-confirm-btn').disabled = !checkbox.checked;
}

function performClearData(){
  const checkbox = document.getElementById('clear-confirm-checkbox');
  if(!checkbox.checked) return; // apsauga — negalima išvalyti be patvirtinimo

  clearAllPairP0Data();

  // Išvalyti runtime būseną atmintyje, kad aktyvi sesija neatsinaujintų.
  SESSION = {
    session_id: uid(),
    status: 'active',
    started_at: new Date().toISOString(),
    completed_at: null,
    timestamp: new Date().toISOString(),
    language: currentLang,
    viewport_width: window.innerWidth,
    viewport_height: window.innerHeight,
    choices: [],
    reflections: [],
    session_reflection: null,
    feedback: {}
  };
  reflectAnswers = {};
  sessionReflection = { response_type: null, text: '' };
  connectionAnswer = { response_type: null, text: '' };
  lastImportStatus = null;

  lastClearStatus = txt('data_cleared_success') || 'Pair P0 data in this browser has been cleared.';

  // M0: jei valymas buvo paleistas dėl beta dalyvio konflikto (prior-risk ekranas),
  // po sėkmingo valymo automatiškai užregistruoti dabartinį beta dalyvį ir tęsti
  // į normalų intro, o ne rodyti tuščią istoriją.
  if(betaMode && betaParticipantId){
    betaState = loadOrCreateBetaState(betaParticipantId);
    closeClearModal();
    updateBetaBadge();
    show('intro');
    return;
  }

  closeClearModal();
  showHistory(); // perrenderina — istorija bus tuščia, radaras neberodomas
}

// ── M0: BETA SESSION FEEDBACK (6 questions) ────────────
let betaFeedbackAnswers = {};

function countBetaCompletedSessions(){
  if(!betaState) return 0;
  return betaState.session_feedback.length;
}

// fix(three-session-limit): M0 beta testas visada baigiasi po LYGIAI 3
// sesijų. Ši funkcija grąžina progreso skaičių apkarpytą iki 3, kad UI
// niekada nerodytų "4 iš 3" ar "5 iš 3", net jei dėl senesnės būsenos ar
// QA klaidos betaState.session_feedback turi daugiau įrašų.
function cappedBetaSessionCount(){
  return Math.min(countBetaCompletedSessions(), 3);
}

// fix(three-session-limit): pirmos 3 beta feedback sesijos (chronologine
// tvarka pagal completed_at) — TIK jos naudojamos radaro eligibility
// skaičiavimui ir eksportui. Bet kokios papildomos (4-os, 5-os ir t.t.)
// sesijos, atsiradusios dėl senesnės būsenos prieš šį fix'ą, laikomos
// legacy/overflow ir NIEKADA netrinamos, bet ir nenaudojamos naujoje logikoje.
function firstThreeBetaSessionIds(){
  if(!betaState) return [];
  const sorted = betaState.session_feedback
    .slice()
    .sort((a, b) => new Date(a.completed_at) - new Date(b.completed_at));
  return sorted.slice(0, 3).map(f => f.session_id);
}

// fix(three-session-limit): radaro eligibility skaičiuojama TIK iš sesijų,
// kurios yra tarp pirmų 3 beta feedback įrašų — ne iš viso completed_sessions
// sąrašo (kuris gali turėti senesnes, ne-beta arba overflow sesijas).
function getEligibleBetaSessions(){
  const allowedIds = new Set(firstThreeBetaSessionIds());
  return getEligibleSessions().filter(s => allowedIds.has(s.session_id));
}

  // Q6: return intention (+ optional text always)
  addBetaChoiceQuestion(body, 'return_intention', txt('beta_q6') || 'Would you want to do another session at another time?', [
    { key:'yes', label: txt('yes') || 'Yes' },
    { key:'maybe', label: txt('maybe') || 'Maybe' },
    { key:'no', label: txt('no') || 'No' }
  ], false, null, 'return_reason', txt('beta_q6_followup') || 'Why?', true);

  document.getElementById('beta-feedback-continue-btn').textContent = txt('continue_btn') || 'Continue';
  updateBetaFeedbackContinueState();

  show('beta-feedback');
}

// Universali pagalbinė funkcija vieno pasirinkimo klausimui su neprivalomu tekstiniu lauku.
function addBetaChoiceQuestion(body, key, questionText, options, hasOtherText, followupOnKey, followupField, followupLabel, alwaysShowFollowup){
  const block = document.createElement('div');
  block.className = 'beta-feedback-block';

  const q = document.createElement('div');
  q.className = 'beta-question';
  q.textContent = questionText;
  block.appendChild(q);

  const opts = document.createElement('div');
  opts.className = 'beta-options';

  let followupInput = null;

  function ensureFollowup(show){
    if(followupInput) followupInput.remove();
    followupInput = null;
    if(!show) return;
    followupInput = document.createElement('input');
    followupInput.className = 'beta-optional-input';
    followupInput.placeholder = followupLabel || '';
    followupInput.value = betaFeedbackAnswers[followupField] || '';
    followupInput.oninput = () => { betaFeedbackAnswers[followupField] = followupInput.value; };
    block.appendChild(followupInput);
  }

  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'beta-opt-btn';
    btn.textContent = opt.label;
    btn.onclick = () => {
      opts.querySelectorAll('.beta-opt-btn').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      betaFeedbackAnswers[key] = opt.key;

      if(hasOtherText && opt.key === 'other'){
        ensureFollowup(true);
        if(!followupField){
          // 'other' teksto laukas naudoja key + '_other' pavadinimą
          followupInput.oninput = () => { betaFeedbackAnswers[key + '_other'] = followupInput.value; };
        }
      } else if(followupField && opt.key === followupOnKey){
        ensureFollowup(true);
      } else if(!alwaysShowFollowup){
        ensureFollowup(false);
      }

      updateBetaFeedbackContinueState();
    };
    opts.appendChild(btn);
  });

  block.appendChild(opts);

  if(alwaysShowFollowup){
    ensureFollowup(true);
  }

  body.appendChild(block);
}

function updateBetaFeedbackContinueState(){
