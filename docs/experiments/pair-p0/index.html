<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ConflictLab P0</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0C0C0F;--card:#121215;--border:#1E1E24;--text:#E2DED6;
  --dim:#6E6A64;--faint:#32323A;--accent:#7C9E8F;--r:12px
}
html,body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  margin:0;padding:0;
}
/* Nėra jokio dvh/vh eksperimentavimo. Naudojame paprastą min-height:100vh
   su natūraliu document flow — puslapis gali scrollintis kaip normalus html.
   Tai stabiliausias variantas visose mobiliose naršyklėse. */
body{min-height:100vh}

.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* Kiekvienas ekranas: header (jei reikia) + body (auga laisvai) + footer (visada apačioje po turiniu, NE fixed) */
.screen-body{flex:1 1 auto;padding:16px 16px 24px}
.screen-footer{
  flex-shrink:0;
  padding:16px;
  border-top:1px solid var(--border);
  background:var(--bg);
}
.screen-header{
  flex-shrink:0;padding:14px 16px;border-bottom:1px solid var(--border);
  text-align:center;font-size:.8rem;color:var(--dim);
}

/* ── INTRO ── */
#screen-intro .screen-body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:20px;min-height:80vh;text-align:center;
}
.logo{font-size:.65rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.intro-title{font-size:1.5rem;font-weight:300}
.intro-sub{font-size:.9rem;color:var(--dim);line-height:1.6;max-width:280px}
.lang-row{display:flex;gap:10px}
.lang-btn{
  padding:8px 24px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.85rem;cursor:pointer;transition:all 180ms;
}
.lang-btn.active{border-color:var(--accent);color:var(--text);background:rgba(124,158,143,.08)}
.audio-toggle{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:20px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.8rem;cursor:pointer;transition:all 180ms;
}
.audio-toggle.on{border-color:var(--accent);color:var(--accent)}

/* ── NO STIMULI ── */
#screen-nostimuli .screen-body{
  display:flex;align-items:center;justify-content:center;min-height:80vh;
  text-align:center;padding:32px;color:var(--dim);
}

/* ── PAIR (Layer 1) ── */
.pair-prompt{font-size:.8rem;color:var(--dim);flex:1;text-align:center}
.pair-counter{font-size:.72rem;color:var(--faint)}
.pair-images{display:flex;flex-direction:column}
.img-zone{
  height:42vh;display:flex;align-items:center;justify-content:center;
  cursor:pointer;position:relative;overflow:hidden;background:#0a0a0c;
}
.img-zone+.img-zone{border-top:3px solid var(--bg)}
.img-zone img{width:100%;height:100%;object-fit:contain;display:block}
.img-zone .tap-overlay{position:absolute;inset:0;background:rgba(124,158,143,0);transition:background 100ms}
.img-zone:active .tap-overlay{background:rgba(124,158,143,.18)}
.img-loading{position:absolute;font-size:.8rem;color:var(--faint)}

/* ── BUTTONS (bendri visiems ekranams) ── */
.btn-primary{
  width:100%;min-height:52px;padding:14px;border-radius:var(--r);
  background:var(--accent);color:#0C0C0F;font-size:1rem;font-weight:700;
  border:none;cursor:pointer;transition:opacity 180ms;
}
.btn-primary:disabled{opacity:.3;cursor:not-allowed}
.btn-ghost{
  width:100%;min-height:48px;padding:14px;border-radius:var(--r);
  background:transparent;border:1px solid var(--border);color:var(--dim);
  font-size:.9rem;cursor:pointer;
}

/* ── MICRO-FLOW (Layer 2) ── */
.micro-progress{font-size:.72rem;color:var(--faint);letter-spacing:.05em}
.micro-image{border-radius:8px;overflow:hidden;background:#0a0a0c;margin-bottom:16px}
.micro-image img{width:100%;height:240px;object-fit:contain;display:block}
.micro-step-label{
  font-size:.72rem;color:var(--faint);text-transform:uppercase;
  letter-spacing:.08em;margin-bottom:10px;font-weight:600;
}
.cue-options{display:flex;flex-direction:column;gap:8px}
.cue-btn{
  padding:14px 16px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.95rem;text-align:left;
  cursor:pointer;transition:all 180ms;width:100%;
}
.cue-btn:active{border-color:var(--accent);background:rgba(124,158,143,.08)}
.cue-btn.selected{border-color:var(--accent);background:rgba(124,158,143,.12);color:var(--accent);font-weight:600}
.cue-custom-input{
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.9rem;padding:12px;outline:none;transition:border-color 180ms;
  display:none;margin-top:4px;width:100%;
}
.cue-custom-input.show{display:block}
.cue-custom-input:focus{border-color:var(--accent)}
.chosen-cue-badge{
  display:inline-block;padding:8px 14px;border-radius:8px;
  background:rgba(124,158,143,.12);border:1px solid var(--accent);
  color:var(--accent);font-size:.9rem;font-weight:600;margin-bottom:14px;
}
.reflection-question{font-size:.95rem;color:var(--text);line-height:1.5;margin-bottom:12px;font-weight:500}
.reflection-row{display:flex;gap:8px;align-items:stretch}
.reflection-input{
  flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:1rem;padding:12px;outline:none;transition:border-color 180ms;min-width:0;
}
.reflection-input:focus{border-color:var(--accent)}
.reflection-skip-btn{
  padding:12px 16px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.85rem;cursor:pointer;
  white-space:nowrap;transition:all 180ms;flex-shrink:0;
}
.reflection-skip-btn:active{border-color:var(--accent);color:var(--accent)}

/* ── SESSION REFLECTION ── */
.session-summary-item{
  display:flex;align-items:center;gap:12px;padding:10px;
  background:var(--card);border:1px solid var(--border);border-radius:8px;
  margin-bottom:10px;
}
.session-summary-thumb{width:64px;height:64px;border-radius:6px;overflow:hidden;flex-shrink:0;background:#0a0a0c}
.session-summary-thumb img{width:100%;height:100%;object-fit:contain;display:block}
.session-summary-text{font-size:.9rem;color:var(--text);line-height:1.4}
.session-question{font-size:1rem;color:var(--text);font-weight:600;line-height:1.5;margin:20px 0 6px}
.session-subnote{font-size:.8rem;color:var(--dim);line-height:1.5;margin-bottom:14px}
.session-textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.95rem;padding:12px;outline:none;resize:none;
  min-height:70px;line-height:1.5;transition:border-color 180ms;
}
.session-textarea:focus{border-color:var(--accent)}
.session-charcount{font-size:.72rem;color:var(--faint);text-align:right;margin-top:4px}
.not-yet-btn{
  width:100%;margin-top:10px;padding:12px;border-radius:8px;
  border:1px solid var(--border);background:transparent;color:var(--dim);
  font-size:.9rem;cursor:pointer;transition:all 180ms;
}
.not-yet-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,158,143,.12)}

/* ── RESULT ── */
.result-item{
  display:flex;flex-direction:column;gap:10px;padding:16px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:14px;
}
.result-thumb{width:100%;border-radius:8px;overflow:hidden;background:#0a0a0c}
.result-thumb img{width:100%;height:220px;object-fit:contain;display:block}
.result-words{font-size:1.05rem;color:var(--accent);font-weight:600;text-align:center;letter-spacing:.02em}
/* ── I STAGE: literal choice reflection ── */
.choice-reflect-title{
  font-size:1rem;color:var(--text);font-weight:700;margin-bottom:14px;line-height:1.4;
}
.choice-reflect-item{
  display:flex;gap:6px;padding:10px 0;font-size:.92rem;line-height:1.5;
  border-bottom:1px solid var(--border);
}
.choice-reflect-number{color:var(--faint);flex-shrink:0}
.choice-reflect-text{color:var(--text)}
.choice-reflect-text.empty{color:var(--dim);font-style:italic}
.choice-reflect-closing{
  margin-top:14px;padding:12px 14px;font-size:.8rem;color:var(--dim);
  line-height:1.6;font-style:italic;background:var(--card);border-radius:8px;
}
.connection-question-block{
  margin-top:20px;padding:16px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);
}
.connection-question-text{font-size:.92rem;color:var(--text);font-weight:500;margin-bottom:12px;line-height:1.5}
.connection-options{display:flex;flex-direction:column;gap:8px}
.connection-opt-btn{
  padding:12px 14px;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--dim);font-size:.85rem;text-align:left;
  cursor:pointer;transition:all 180ms;
}
.connection-opt-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,158,143,.08)}
.connection-text-wrap{margin-top:12px}
.connection-textarea{
  width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.9rem;padding:10px 12px;outline:none;resize:none;
  min-height:60px;line-height:1.5;transition:border-color 180ms;
}
.connection-textarea:focus{border-color:var(--accent)}

.result-observation{
  margin-top:16px;padding:18px 16px;background:var(--card);
  border:1px solid var(--accent);border-radius:var(--r);
}
.result-observation-label{
  font-size:.72rem;color:var(--accent);text-transform:uppercase;
  letter-spacing:.08em;font-weight:600;margin-bottom:8px;
}
.result-observation-text{font-size:1rem;color:var(--text);line-height:1.5}
.result-observation-text.empty{color:var(--dim);font-style:italic}
.result-scope-note{
  margin-top:14px;padding:12px 14px;
  font-size:.78rem;color:var(--dim);text-align:center;line-height:1.5;font-style:italic;
}

/* ── FEEDBACK ── */
.fb-item{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.fb-q{font-size:.9rem;color:var(--text);line-height:1.5;font-weight:500}
.fb-yn{display:flex;gap:8px}
.fb-btn{
  flex:1;padding:12px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.9rem;font-weight:500;
  cursor:pointer;transition:all 180ms;
}
.fb-btn.on{border-color:var(--accent);color:var(--accent);background:rgba(124,158,143,.12)}
.fb-textarea{
  width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;
  color:var(--text);font-size:.9rem;padding:12px;outline:none;resize:none;
  min-height:60px;line-height:1.5;transition:border-color 180ms;
}
.fb-textarea:focus{border-color:var(--accent)}

/* ── DONE ── */
#screen-done .screen-body{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:80vh;text-align:center;gap:16px;padding:32px;
}
.done-check{font-size:2.5rem}
.done-title{font-size:1.2rem;font-weight:300}
.done-sub{font-size:.85rem;color:var(--dim);line-height:1.6;max-width:260px}
.done-actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:300px;margin-top:12px}

/* ── RADAR ── */
.radar-progress-box{
  text-align:center;padding:24px 16px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--r);margin-bottom:16px;
}
.radar-progress-text{font-size:1.1rem;color:var(--text);font-weight:600;margin-bottom:6px}
.radar-progress-sub{font-size:.8rem;color:var(--dim);line-height:1.5}
.radar-chart-wrap{
  display:flex;justify-content:center;align-items:center;
  padding:20px 0;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r);margin-bottom:16px;
}
.radar-axis-values{display:flex;justify-content:space-around;margin-bottom:16px}
.radar-axis-item{text-align:center}
.radar-axis-label{font-size:.72rem;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.radar-axis-value{font-size:1.2rem;color:var(--accent);font-weight:700;margin-top:4px}
.radar-meta{
  display:flex;justify-content:space-between;font-size:.78rem;color:var(--dim);
  padding:10px 4px;border-top:1px solid var(--border);margin-top:8px;
}
.radar-scope-line{
  text-align:center;font-size:.78rem;color:var(--faint);
  margin-bottom:14px;padding-top:4px;
}
.radar-scale-note{
  text-align:center;font-size:.74rem;color:var(--faint);
  line-height:1.5;padding:8px 12px;margin-top:10px;font-style:italic;
}
.radar-scope-note{
  margin-top:16px;padding:14px;font-size:.8rem;color:var(--dim);
  text-align:center;line-height:1.6;font-style:italic;
  border-top:1px solid var(--border);
}

/* ── HISTORY ── */
.history-item{
  display:flex;flex-direction:column;gap:8px;padding:16px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  margin-bottom:12px;cursor:pointer;transition:border-color 180ms;
}
.history-item:active{border-color:var(--accent)}
.history-date{font-size:.75rem;color:var(--faint)}
.history-count{font-size:.8rem;color:var(--dim)}
.history-observation{font-size:.9rem;color:var(--text);font-style:italic}
.history-empty{text-align:center;color:var(--dim);padding:24px 20px 8px;font-size:.9rem;line-height:1.6}
.history-empty-hint{
  text-align:center;color:var(--faint);padding:0 20px 32px;font-size:.8rem;line-height:1.6;
}
.data-mgmt-block{margin-top:24px;padding-top:20px;border-top:1px solid var(--border)}
.data-mgmt-title{font-size:.78rem;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.btn-danger-outline{
  width:100%;padding:12px;border-radius:8px;border:1px solid #5A2E2E;
  background:transparent;color:#B08080;font-size:.85rem;cursor:pointer;margin-bottom:8px;
}
.btn-danger-outline:active{border-color:#8A4444}
.clear-success-status{
  margin-top:10px;padding:12px 14px;background:var(--card);border:1px solid var(--accent);
  border-radius:8px;font-size:.85rem;color:var(--text);
}
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:1000;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal-box{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  padding:20px;max-width:340px;width:100%;
}
.modal-title{font-size:1rem;color:var(--text);font-weight:700;margin-bottom:12px}
.modal-text{font-size:.85rem;color:var(--dim);line-height:1.6;margin-bottom:12px}
.modal-active-session-note{font-size:.82rem;color:#B08080;margin-bottom:12px;line-height:1.5}
.modal-checkbox-row{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;cursor:pointer}
.modal-checkbox-row input{margin-top:3px;flex-shrink:0}
.modal-checkbox-row span{font-size:.8rem;color:var(--dim);line-height:1.5}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn-ghost{flex:1}
.btn-destructive{
  flex:1;padding:12px;border-radius:8px;border:none;background:#8A3030;
  color:#F0DEDE;font-size:.85rem;font-weight:600;cursor:pointer;
}
.btn-destructive:disabled{opacity:.3;cursor:not-allowed}

.history-transfer-block{
  display:flex;gap:10px;margin-bottom:16px;
}
.history-transfer-btn{
  flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:.82rem;cursor:pointer;transition:all 180ms;
}
.history-transfer-btn:active{border-color:var(--accent)}
.history-privacy-note{
  font-size:.74rem;color:var(--faint);text-align:center;line-height:1.5;
  margin-bottom:20px;padding:0 8px;
}
.history-import-summary{
  background:var(--card);border:1px solid var(--accent);border-radius:var(--r);
  padding:14px 16px;margin-bottom:16px;font-size:.85rem;color:var(--text);line-height:1.7;
}
.history-import-error{
  background:var(--card);border:1px solid #7A3030;border-radius:var(--r);
  padding:14px 16px;margin-bottom:16px;font-size:.85rem;color:#c47878;line-height:1.6;
}
.observation-label{
  font-size:.7rem;color:var(--accent);text-transform:uppercase;
  letter-spacing:.06em;font-weight:700;margin-bottom:4px;
}
.history-detail-thumbs{display:flex;gap:8px;margin-top:8px}
.history-detail-thumb{width:56px;height:56px;border-radius:6px;overflow:hidden;background:#0a0a0c;flex-shrink:0}
.history-detail-thumb img{width:100%;height:100%;object-fit:contain}

/* ── DEBUG BAR — natūraliame flow, ne fixed, kad niekada nedengtų turinio ── */
#debug-bar{
  display:none;padding:8px 12px;font-size:.7rem;color:var(--faint);
  background:#080808;border-top:1px solid #222;
  align-items:center;gap:10px;flex-wrap:wrap;
}
.dbg-btn{
  padding:4px 10px;border-radius:6px;border:1px solid #333;
  background:transparent;color:var(--faint);font-size:.7rem;cursor:pointer;
}
</style>
</head>
<body>

<!-- INTRO -->
<div id="screen-intro" class="screen active">
  <div class="screen-body">
    <div class="logo">ConflictLab</div>
    <div class="intro-title" id="txt-subtitle"></div>
    <div class="intro-sub" id="txt-instruction"></div>
    <div class="lang-row">
      <button class="lang-btn" id="btn-lt" onclick="setLang('lt')">LT</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
    <button class="audio-toggle" id="audio-toggle" onclick="toggleAudio()">
      <span class="audio-icon">🔊</span>
      <span id="audio-toggle-label"></span>
    </button>
    <button class="btn-ghost" style="max-width:280px" onclick="showHistory()" id="txt-intro-history-link"></button>
  </div>
  <div class="screen-footer">
    <button class="btn-primary" id="txt-start" onclick="startExperiment()"></button>
  </div>
</div>

<!-- NO STIMULI -->
<div id="screen-nostimuli" class="screen">
  <div class="screen-body">
    <div id="txt-nostimuli"></div>
  </div>
</div>

<!-- PAIR (Layer 1) -->
<div id="screen-pair" class="screen">
  <div class="screen-header" style="display:flex;justify-content:space-between">
    <span class="pair-prompt" id="pair-prompt"></span>
    <span class="pair-counter" id="pair-counter"></span>
  </div>
  <div class="screen-body" style="padding:0">
    <div class="pair-images">
      <div class="img-zone" id="zone-top" onclick="choosePair('top')">
        <span class="img-loading" id="load-top">⋯</span>
        <img id="img-top" alt="" style="display:none">
        <div class="tap-overlay"></div>
      </div>
      <div class="img-zone" id="zone-bottom" onclick="choosePair('bottom')">
        <span class="img-loading" id="load-bottom">⋯</span>
        <img id="img-bottom" alt="" style="display:none">
        <div class="tap-overlay"></div>
      </div>
    </div>
  </div>
</div>

<!-- REFLECT (Layer 2 micro-flow) -->
<div id="screen-reflect" class="screen">
  <div class="screen-header">
    <span class="micro-progress" id="micro-progress"></span>
  </div>
  <div class="screen-body" id="reflect-body"></div>
  <div class="screen-footer">
    <button class="btn-primary" id="reflect-next-btn" disabled></button>
  </div>
</div>

<!-- SESSION REFLECTION -->
<div id="screen-session-reflection" class="screen">
  <div class="screen-header" id="txt-sr-header"></div>
  <div class="screen-body" id="sr-body"></div>
  <div class="screen-footer">
    <button class="btn-primary" id="sr-next-btn" disabled onclick="confirmSessionReflection()"></button>
  </div>
</div>

<!-- RESULT -->
<div id="screen-result" class="screen">
  <div class="screen-header" id="txt-result-header"></div>
  <div class="screen-body" id="result-body"></div>
  <div class="screen-footer">
    <button class="btn-primary" onclick="goToFeedback()" id="txt-finish-session"></button>
  </div>
</div>

<!-- FEEDBACK -->
<div id="screen-feedback" class="screen">
  <div class="screen-header" id="txt-fb-header"></div>
  <div class="screen-body" id="fb-body"></div>
  <div class="screen-footer">
    <button class="btn-primary" onclick="submitFeedback()" id="txt-fb-submit"></button>
  </div>
</div>

<!-- DONE -->
<div id="screen-done" class="screen">
  <div class="screen-body">
    <div class="done-check">✓</div>
    <div class="done-title" id="txt-done-title"></div>
    <div class="done-sub" id="txt-done-sub"></div>
    <div class="done-actions">
      <button class="btn-primary" onclick="showHistory()" id="txt-view-history"></button>

<!-- DEBUG BAR — natūraliame document flow apačioje, scrollinamas kartu su turiniu -->
<div id="debug-bar">
  <span>P0 debug</span>
  <button class="dbg-btn" onclick="exportDebug()">Eksportuoti JSON</button>
  <span id="dbg-info" style="margin-left:auto"></span>
</div>

<audio id="ambient-audio" src="audio/open-window.mp3" loop preload="none"></audio>

<script>
// ── NAMESPACE ────────────────────────────────────────
const NS = 'cl_pair_p0_';
const IS_DEBUG = new URLSearchParams(location.search).has('debug');

// ── STATE ────────────────────────────────────────────
let L = {};
let LANGS = {};
let PAIRS = [];
let CUE_DATA = null;
let currentLang = 'lt';
let currentPairIdx = 0;
let pairStartTime = 0;
let bothLoaded = false;
let audioEnabled = false;
let audioStarted = false;

let microQueue = [];
let microIndex = 0;
let microStep = 'cue';
let microCurrentAnswer = null;
let reflectAnswers = {};
let fbAnswers = {};
let lastImportStatus = null; // { result } arba { error } — išlieka per showHistory() perrenderinimus
let sessionReflection = { response_type: null, text: '' };

let SESSION = {
  session_id: uid(),
  status: 'active',
  started_at: new Date().toISOString(),
  completed_at: null,
  timestamp: new Date().toISOString(),
  language: 'lt',
  viewport_width: window.innerWidth,
  viewport_height: window.innerHeight,
  choices: [],
  reflections: [],
  session_reflection: null,
  feedback: {}
};

// ── UTILS ────────────────────────────────────────────
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  window.scrollTo(0, 0);
}
function txt(key){ return L[key] || key; }

// ── LANGUAGE ─────────────────────────────────────────
function setLang(lang){
  currentLang = lang;
  SESSION.language = lang;
  L = LANGS[lang] || LANGS['lt'] || {};

  document.getElementById('btn-lt').classList.toggle('active', lang === 'lt');
  document.getElementById('btn-en').classList.toggle('active', lang === 'en');

  document.getElementById('txt-subtitle').textContent = txt('intro_subtitle');
  document.getElementById('txt-instruction').textContent = txt('intro_instruction');
  document.getElementById('txt-start').textContent = txt('intro_start');
  document.getElementById('txt-nostimuli').textContent = txt('no_stimuli');
  document.getElementById('pair-prompt').textContent = txt('layer1_prompt');
  document.getElementById('txt-result-header').textContent = txt('your_session') || 'Your session';
  document.getElementById('txt-finish-session').textContent = txt('finish_session') || 'Finish session';
  document.getElementById('txt-fb-header').textContent = txt('feedback_title');
  document.getElementById('txt-fb-submit').textContent = txt('feedback_submit');
  document.getElementById('txt-done-title').textContent = txt('done_title') || 'Thank you';
  document.getElementById('txt-done-sub').textContent = txt('done_sub') || '';
  document.getElementById('txt-view-history').textContent = txt('view_history') || 'View history';
  document.getElementById('txt-start-another').textContent = txt('start_another') || 'Start another session';
  document.getElementById('txt-history-header').textContent = txt('your_sessions') || 'Your sessions';
  document.getElementById('txt-back-to-intro').textContent = txt('back') || 'Back';
  document.getElementById('txt-back-to-history').textContent = txt('back_to_history') || 'Back to history';
  document.getElementById('txt-radar-back').textContent = txt('back_to_history') || 'Back to history';
  document.documentElement.lang = lang;

  updateAudioToggleUI();
  document.getElementById('txt-intro-history-link').textContent = txt('view_history') || 'View history';
}

// ── INIT ─────────────────────────────────────────────
async function init(){
  try {
    const saved = localStorage.getItem(NS + 'audio_enabled');
    audioEnabled = saved === 'true';
  } catch(e){ audioEnabled = false; }

  if(IS_DEBUG){
    document.getElementById('debug-bar').style.display = 'flex';
  }

  const bl = navigator.language || 'lt';
  const detected = bl.startsWith('lt') ? 'lt' : 'en';

  try {
    const r = await fetch('lang.json?v=' + Date.now());
    LANGS = await r.json();
  } catch(e){
    LANGS = { lt:{}, en:{} };
  }

  try {
    const r = await fetch('pair-set.json?v=' + Date.now());
    const data = await r.json();
    PAIRS = (data.pairs || []).filter(p => p.status === 'active');
  } catch(e){
    PAIRS = [];
  }

  try {
    const r = await fetch('pair-cue-v0.1.json?v=' + Date.now());
    CUE_DATA = await r.json();
  } catch(e){
    CUE_DATA = null;
  }

  setLang(detected);
  show('intro');

  if(IS_DEBUG){
    document.getElementById('dbg-info').textContent = `pairs:${PAIRS.length}`;
  }
}

// ── AUDIO ────────────────────────────────────────────
function updateAudioToggleUI(){
  const btn = document.getElementById('audio-toggle');
  if(!btn) return;
  const icon = btn.querySelector('.audio-icon');
  const label = document.getElementById('audio-toggle-label');
  btn.classList.toggle('on', audioEnabled);
  if(icon) icon.textContent = audioEnabled ? '🔊' : '🔈';
  if(label) label.textContent = txt('audio_on') || 'Sound';
}

function toggleAudio(){
  audioEnabled = !audioEnabled;
  try { localStorage.setItem(NS + 'audio_enabled', String(audioEnabled)); } catch(e){}
  updateAudioToggleUI();

  const audio = document.getElementById('ambient-audio');
  if(!audio) return;

  if(audioEnabled){
    audio.volume = 0.25;
    audio.play().then(() => { audioStarted = true; }).catch(() => { audioStarted = false; });
  } else {
    audio.pause();
  }
}

function stopAudioSmoothly(){
  const audio = document.getElementById('ambient-audio');
  if(!audio || audio.paused) return;
  const steps = 12, stepTime = 50, startVol = audio.volume;
  let i = 0;
  const fade = setInterval(() => {
    i++;
    audio.volume = Math.max(0, startVol * (1 - i / steps));
    if(i >= steps){ clearInterval(fade); audio.pause(); audio.volume = startVol; }
  }, stepTime);
}

// ── START ─────────────────────────────────────────────
function startExperiment(){
  if(PAIRS.length === 0){ show('nostimuli'); return; }
  currentPairIdx = 0;

  // Nauja sesija — visiškai naujas objektas, kad senos aktyvios sesijos
  // duomenys niekada nepatektų į naujos sesijos rezultatus.
  SESSION = {
    session_id: uid(),
    status: 'active',
    started_at: new Date().toISOString(),
    completed_at: null,
    timestamp: new Date().toISOString(),
    language: currentLang,
    viewport_width: window.innerWidth,
    viewport_height: window.innerHeight,
    choices: [],
    reflections: [],
    session_reflection: null,
    feedback: {}
  };
  sessionReflection = { response_type: null, text: '' };
  reflectAnswers = {};

  loadPair(0);
}

// ── LAYER 1 ───────────────────────────────────────────
function loadPair(idx){
  if(idx >= PAIRS.length){ startLayer2(); return; }

  const pair = PAIRS[idx];
  const flip = Math.random() < 0.5;
  pair._top    = flip ? pair.image_b : pair.image_a;
  pair._bottom = flip ? pair.image_a : pair.image_b;

  document.getElementById('pair-counter').textContent = `${idx + 1} / ${PAIRS.length}`;

  const imgT = document.getElementById('img-top');
  const imgB = document.getElementById('img-bottom');
  const ldT  = document.getElementById('load-top');
  const ldB  = document.getElementById('load-bottom');

  imgT.style.display = 'none'; imgB.style.display = 'none';
  ldT.style.display  = 'block'; ldB.style.display  = 'block';

  bothLoaded = false;
  let tOk = false, bOk = false;
  function check(){ if(tOk && bOk){ bothLoaded = true; pairStartTime = Date.now(); } }

  imgT.onload  = () => { imgT.style.display='block'; ldT.style.display='none'; tOk=true; check(); };
  imgB.onload  = () => { imgB.style.display='block'; ldB.style.display='none'; bOk=true; check(); };
  imgT.onerror = () => { ldT.textContent='?'; tOk=true; check(); };
  imgB.onerror = () => { ldB.textContent='?'; bOk=true; check(); };

  imgT.src = pair._top.src;
  imgB.src = pair._bottom.src;

  show('pair');
}

function choosePair(position){
  if(!bothLoaded) return;
  const latency = Date.now() - pairStartTime;
  const pair = PAIRS[currentPairIdx];
  const selected = position === 'top' ? pair._top : pair._bottom;

  SESSION.choices.push({
    pair_id: pair.pair_id, pair_order: currentPairIdx + 1,
    top_image_id: pair._top.id, bottom_image_id: pair._bottom.id,
    selected_image_id: selected.id, selected_position: position,
    choice_latency_ms: latency
  });

  currentPairIdx++;
  loadPair(currentPairIdx);
}

// ── LAYER 2 MICRO-FLOW ────────────────────────────────
function getCuesForImage(imageId){
  if(!CUE_DATA) return null;
  for(const pair of CUE_DATA.pairs || []){
    for(const img of pair.images || []){
      if(img.image_id === imageId) return img.cues || [];
    }
  }
  return null;
}

function startLayer2(){
  microQueue = SESSION.choices.map(choice => {
    const pair = PAIRS.find(p => p.pair_id === choice.pair_id);
    const imgObj = pair
      ? (pair.image_a.id === choice.selected_image_id ? pair.image_a : pair.image_b)
      : null;
    return { imgObj, key: choice.selected_image_id };
  }).filter(x => x.imgObj);

  reflectAnswers = {};
  microIndex = 0;

  if(microQueue.length === 0){ goToResult(); return; }

  renderMicroStep();
  show('reflect');
}

function updateMicroProgress(){
  const el = document.getElementById('micro-progress');
  if(!el) return;
  const tmpl = txt('micro_progress') || 'Image {current} of {total}';
  el.textContent = tmpl.replace('{current}', microIndex + 1).replace('{total}', microQueue.length);
}

function renderMicroStep(){
  updateMicroProgress();
  const item = microQueue[microIndex];
  const body = document.getElementById('reflect-body');
  body.innerHTML = '';
  const btn = document.getElementById('reflect-next-btn');

  if(microStep === 'cue') renderCueStep(item, body, btn);
  else renderReflectionStep(item, body, btn);
}

function renderCueStep(item, body, btn){
  const key = item.key;
  const cues = getCuesForImage(key);
  const otherLabel = txt('layer2_other') || 'Another thought';
  const skipLabel = txt('layer2_skip') || 'Hard to say';
  const stepLabel = txt('step_cue') || 'What caught your attention?';
  const placeholderLabel = txt('layer2_placeholder') || '...';
  const lang = currentLang;

  const div = document.createElement('div');

  if(cues && cues.length > 0){
    const cueButtons = cues.map(c => {
      const label = lang === 'lt' ? c.lt : c.en;
      return `<button class="cue-btn" onclick="pickCue('${c.cue_id}', this)">${label}</button>`;
    }).join('');

    div.innerHTML = `
      <div class="micro-image"><img src="${item.imgObj.src}" alt="" loading="lazy"></div>
      <div class="micro-step-label">${stepLabel}</div>
      <div class="cue-options" id="cue-opts">
        ${cueButtons}
        <button class="cue-btn" id="custom-btn" onclick="pickCustomCue(this)">${otherLabel}</button>
        <input class="cue-custom-input" id="custom-input" maxlength="40"
          placeholder="${placeholderLabel}" oninput="onCustomCueTyping(this)">
        <button class="cue-btn" id="skip-btn" onclick="pickHardToSay(this)">${skipLabel}</button>
      </div>
    `;
  } else {
    div.innerHTML = `
      <div class="micro-image"><img src="${item.imgObj.src}" alt="" loading="lazy"></div>
      <div class="micro-step-label">${stepLabel}</div>
      <div class="reflection-row">
        <input class="reflection-input" id="fallback-input" maxlength="40"
          placeholder="${placeholderLabel}" oninput="onFallbackTyping(this)">
        <button class="reflection-skip-btn" onclick="pickHardToSay(null)">${skipLabel}</button>
      </div>
    `;
  }

  body.appendChild(div);
  microCurrentAnswer = null;
  btn.disabled = true;
  const isLastCue = microIndex === microQueue.length - 1;
  btn.textContent = isLastCue ? (txt('continue_btn') || 'Continue') : (txt('layer2_next') || 'Next');
  btn.onclick = confirmCueStep;
}

function pickCue(cueId, el){
  const key = microQueue[microIndex].key;
  const cues = getCuesForImage(key);
  const cue = cues.find(c => c.cue_id === cueId);
  if(!cue) return;

  document.querySelectorAll('#cue-opts .cue-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  const ci = document.getElementById('custom-input');
  if(ci){ ci.classList.remove('show'); ci.value=''; }

  microCurrentAnswer = { response_type:'cue', cue_id:cueId, cue_text: currentLang==='lt'?cue.lt:cue.en, vector: cue.vector, confidence: cue.confidence ?? null };
  document.getElementById('reflect-next-btn').disabled = false;
}

function pickCustomCue(el){
  document.querySelectorAll('#cue-opts .cue-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  const ci = document.getElementById('custom-input');
  ci.classList.add('show'); ci.focus();
  microCurrentAnswer = { response_type:'custom', custom_words:'', vector:null };
  document.getElementById('reflect-next-btn').disabled = true;
}

function onCustomCueTyping(el){
  const parts = el.value.trim().split(/\s+/).filter(Boolean);
  if(parts.length > 3) el.value = parts.slice(0,3).join(' ');
  const trimmed = el.value.trim();
  microCurrentAnswer = { response_type:'custom', custom_words:trimmed, vector:null };
  document.getElementById('reflect-next-btn').disabled = trimmed.length === 0;
}

function onFallbackTyping(el){
  const parts = el.value.trim().split(/\s+/).filter(Boolean);
  if(parts.length > 3) el.value = parts.slice(0,3).join(' ');
  const trimmed = el.value.trim();
  microCurrentAnswer = { response_type:'custom', custom_words:trimmed, vector:null };
  document.getElementById('reflect-next-btn').disabled = trimmed.length === 0;
}

function pickHardToSay(el){
  document.querySelectorAll('#cue-opts .cue-btn').forEach(b => b.classList.remove('selected'));
  if(el) el.classList.add('selected');
  microCurrentAnswer = { response_type:'hard_to_say', vector:null };
  document.getElementById('reflect-next-btn').disabled = false;
}

function confirmCueStep(){
  if(!microCurrentAnswer) return;
  const key = microQueue[microIndex].key;
  reflectAnswers[key] = reflectAnswers[key] || {};
  Object.assign(reflectAnswers[key], microCurrentAnswer, { image_id: key });

  if(microCurrentAnswer.response_type === 'hard_to_say' || microCurrentAnswer.response_type === 'custom'){
    reflectAnswers[key].reflection_text = '';
    advanceMicroFlow();
  } else {
    microStep = 'reflection';
    microCurrentAnswer = null;
    renderMicroStep();
  }
}

function renderReflectionStep(item, body, btn){
  const key = item.key;
  const chosen = reflectAnswers[key];
  const question = txt('reflection_question') || 'What feels familiar about this choice?';
  const placeholder = txt('reflection_placeholder') || 'Up to 5 words...';
  const skipLabel = txt('reflection_skip') || 'Skip';

  const div = document.createElement('div');
  div.innerHTML = `
    <div class="micro-image"><img src="${item.imgObj.src}" alt="" loading="lazy"></div>
    <div class="chosen-cue-badge">${chosen.cue_text}</div>
    <div class="reflection-question">${question}</div>
    <div class="reflection-row">
      <input class="reflection-input" id="reflection-input" maxlength="60"
        placeholder="${placeholder}" oninput="onReflectionTyping(this)">
      <button class="reflection-skip-btn" onclick="skipReflectionStep()">${skipLabel}</button>
    </div>
  `;
  body.appendChild(div);

  btn.disabled = false;
  const isLast = microIndex === microQueue.length - 1;
  btn.textContent = isLast ? (txt('continue_btn') || 'Continue') : (txt('layer2_next') || 'Next');
  btn.onclick = () => confirmReflectionStep();
}

function onReflectionTyping(el){
  const parts = el.value.trim().split(/\s+/).filter(Boolean);
  if(parts.length > 5) el.value = parts.slice(0,5).join(' ');
  const key = microQueue[microIndex].key;
  reflectAnswers[key].reflection_text = el.value.trim();
}

function skipReflectionStep(){
  const key = microQueue[microIndex].key;
  reflectAnswers[key].reflection_text = '';
  confirmReflectionStep();
}

function confirmReflectionStep(){ advanceMicroFlow(); }

function advanceMicroFlow(){
  microIndex++;
  microStep = 'cue';
  microCurrentAnswer = null;
  if(microIndex >= microQueue.length) startSessionReflection();
  else renderMicroStep();
}

// ── RESULT ────────────────────────────────────────────
// Sesijos vektorius — confidence svertinis vidurkis, naudojant TIK standartinius
// cue su vektoriumi. custom, hard_to_say, individuali/sesijos refleksija ir latencija
// niekada nedalyvauja šiame skaičiavime.
function computeSessionVector(){
  const validEntries = SESSION.reflections.filter(r =>
    r.response_type === 'cue' && r.vector && typeof r.vector === 'object' &&
    typeof r.confidence === 'number'
  );

  if(validEntries.length === 0){
    return { vector: null, valid_vector_responses: 0, session_vector_confidence: null };
  }

  const weightedSum = { aw:0, cs:0, cr:0 };
  let confSum = 0;

  validEntries.forEach(r => {
    const w = r.confidence;
    weightedSum.aw += (r.vector.aw || 0) * w;
    weightedSum.cs += (r.vector.cs || 0) * w;
    weightedSum.cr += (r.vector.cr || 0) * w;
    confSum += w;
  });

  const vector = confSum > 0 ? {
    aw: +(weightedSum.aw / confSum).toFixed(3),
    cs: +(weightedSum.cs / confSum).toFixed(3),
    cr: +(weightedSum.cr / confSum).toFixed(3)
  } : null;

  const avgConfidence = +(confSum / validEntries.length).toFixed(3);

  return {
    vector: vector,
    valid_vector_responses: validEntries.length,
    session_vector_confidence: avgConfidence
  };
}

function startSessionReflection(){
  logDebugEvent('SESSION_REFLECTION_OPENED');

  document.getElementById('txt-sr-header').textContent = txt('session_reflection_header') || 'Look at your choices together';

  const body = document.getElementById('sr-body');
  body.innerHTML = '';

  // Pasirinktų vaizdų santrauka originalia seka
  SESSION.choices.forEach(choice => {
    const pair = PAIRS.find(p => p.pair_id === choice.pair_id);
    const imgObj = pair
      ? (pair.image_a.id === choice.selected_image_id ? pair.image_a : pair.image_b)
      : null;
    const ref = reflectAnswers[choice.selected_image_id];

    let label = '';
    if(ref){
      if(ref.response_type === 'cue') label = ref.cue_text;
      else if(ref.response_type === 'custom') label = ref.custom_words;
      else if(ref.response_type === 'hard_to_say') label = (txt('hard_to_say_label') || 'Hard to say');
    }

    const item = document.createElement('div');
    item.className = 'session-summary-item';
    item.innerHTML = `
      <div class="session-summary-thumb">
        ${imgObj ? `<img src="${imgObj.src}" alt="" loading="lazy">` : ''}
      </div>
      <div class="session-summary-text">${label}</div>
    `;
    body.appendChild(item);
  });

  // Pagrindinis sesijos klausimas
  const q = document.createElement('div');
  q.className = 'session-question';
  q.textContent = txt('session_question') || 'When you see these choices together, what stands out most to you?';
  body.appendChild(q);

  const sub = document.createElement('div');
  sub.className = 'session-subnote';
  sub.textContent = txt('session_subnote') || 'You do not need to explain them. A brief observation is enough.';
  body.appendChild(sub);

  const textarea = document.createElement('textarea');
  textarea.className = 'session-textarea';
  textarea.id = 'session-reflection-textarea';
  textarea.maxLength = 180;
  textarea.placeholder = txt('session_placeholder') || 'What do you notice?';
  textarea.value = sessionReflection.response_type === 'text' ? sessionReflection.text : '';
  textarea.oninput = onSessionReflectionTyping;
  body.appendChild(textarea);

  const charcount = document.createElement('div');
  charcount.className = 'session-charcount';
  charcount.id = 'session-charcount';
  charcount.textContent = `${textarea.value.length} / 180`;
  body.appendChild(charcount);

  const notYetBtn = document.createElement('button');
  notYetBtn.className = 'not-yet-btn';
  notYetBtn.id = 'not-yet-btn';
  notYetBtn.textContent = txt('not_stated') || 'I will not name it this time';
  notYetBtn.onclick = toggleNotYet;
  if(sessionReflection.response_type === 'not_stated') notYetBtn.classList.add('on');
  body.appendChild(notYetBtn);

  updateSessionReflectionButton();
  show('session-reflection');
}

function onSessionReflectionTyping(){
  const textarea = document.getElementById('session-reflection-textarea');
  const trimmed = textarea.value.slice(0, 180);
  if(textarea.value !== trimmed) textarea.value = trimmed;

  document.getElementById('session-charcount').textContent = `${textarea.value.length} / 180`;

  // Rašymas automatiškai atšaukia "Dar nepastebiu"
  const notYetBtn = document.getElementById('not-yet-btn');
  if(notYetBtn) notYetBtn.classList.remove('on');

  sessionReflection = {
    response_type: textarea.value.length > 0 ? 'text' : null,
    text: textarea.value
  };

  logDebugEvent('SESSION_REFLECTION_TEXT_CHANGED');
  updateSessionReflectionButton();
}

function toggleNotYet(){
  const notYetBtn = document.getElementById('not-yet-btn');
  const textarea = document.getElementById('session-reflection-textarea');
  const isOn = notYetBtn.classList.contains('on');

  if(isOn){
    // Atšaukti pasirinkimą
    notYetBtn.classList.remove('on');
    sessionReflection = { response_type: null, text: '' };
  } else {
    notYetBtn.classList.add('on');
    textarea.value = '';
    document.getElementById('session-charcount').textContent = '0 / 180';
    sessionReflection = { response_type: 'not_stated', text: '' };
    logDebugEvent('SESSION_REFLECTION_NOT_STATED_SELECTED');
  }

  updateSessionReflectionButton();
}

  }));

  const vecResult = computeSessionVector();
  SESSION.session_vector = vecResult.vector;

  const body = document.getElementById('result-body');

  // ── I ETAPAS: "Ką pasirinkai šioje sesijoje" — konkretus atspindys ──

    let sourceLabel = null;

                         (ref.reflection_text && ref.reflection_text.trim());

        sourceLabel = txt('your_words') || 'Your words';
      } else if(ref.cue_text && ref.cue_text.trim()){
        displayText = ref.cue_text;

      item.appendChild(textSpan);
    } else {
      const emptySpan = document.createElement('span');
      emptySpan.className = 'choice-reflect-text empty';
      emptySpan.textContent = txt('choice_unstated') || 'This choice was left unstated.';

  closingLine.className = 'choice-reflect-closing';
  closingLine.textContent = txt('choices_closing_line') ||
    'These are the words you chose in this session. ConflictLab does not interpret them for you.';

  // ── Refleksinis klausimas: ar žmogus pats mato ryšį? ──

  obsLabel.className = 'result-observation-label';

    obsText.classList.add('empty');

  scope.className = 'result-scope-note';

  show('result');

function selectConnectionOption(type, btn, questionBlock){
  questionBlock.querySelectorAll('.connection-opt-btn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');

  // Pašalinti seną teksto lauką, jei buvo (perjungiant tarp variantų)
  const oldInput = questionBlock.querySelector('.connection-text-wrap');
  if(oldInput) oldInput.remove();

  if(type === 'text'){
    connectionAnswer = { response_type: 'text', text: '' };

    const wrap = document.createElement('div');
    wrap.className = 'connection-text-wrap';

    const textarea = document.createElement('textarea');
    textarea.className = 'connection-textarea';
    textarea.placeholder = txt('connection_placeholder') || 'What do you notice?';
    textarea.oninput = () => { connectionAnswer.text = textarea.value; };
    wrap.appendChild(textarea);

    const saveBtn = document.createElement('button');
    saveBtn.className = 'btn-ghost';
    saveBtn.style.marginTop = '8px';
    saveBtn.textContent = txt('save_observation') || 'Save observation';
    saveBtn.onclick = () => saveConnectionReflection();
    wrap.appendChild(saveBtn);

    questionBlock.appendChild(wrap);
    textarea.focus();
  } else {
    connectionAnswer = { response_type: type, text: '' };
    saveConnectionReflection();
  }
}

function saveConnectionReflection(){

  if(connectionAnswer.response_type === 'text' && trimmed.length === 0){

  SESSION.session_connection_reflection = {
    response_type: connectionAnswer.response_type,
    text: connectionAnswer.response_type === 'text' ? trimmed : '',
    created_at: new Date().toISOString()

  saveSession();
}

function completeSession(){
  SESSION.status = 'completed';
  SESSION.completed_at = new Date().toISOString();
  SESSION.audio_enabled = audioEnabled;
  SESSION.audio_started = audioStarted;

  try {

    if(i >= 0) completed[i] = SESSION; else completed.push(SESSION);

// ── RADAR ELIGIBILITY ─────────────────────────────────
const RADAR_MODEL_VERSION = 'pair-cue-v0.1';
const RADAR_MIN_SESSIONS = 3;

// Sesija tinkama radarui tik jei atitinka VISUS kriterijus.
// Netinkamos sesijos NIEKADA netrinamos, nemigruojamos ir lieka istorijoje —
// jos tiesiog neįtraukiamos į radaro skaičiavimą ir progreso skaitiklį.
function isSessionRadarEligible(s){
  if(s.status !== 'completed') return false;
  if(!s.session_vector || typeof s.session_vector !== 'object') return false;
  if(typeof s.valid_vector_responses !== 'number' || s.valid_vector_responses < 2) return false;
  if(typeof s.session_vector_confidence !== 'number' || !isFinite(s.session_vector_confidence)) return false;
  if(s.vector_model_version !== RADAR_MODEL_VERSION) return false;

  for(const axis of ['aw','cs','cr']){
    const v = s.session_vector[axis];
    if(typeof v !== 'number' || !isFinite(v) || v < -1 || v > 1) return false;
  }
  return true;
}

function getEligibleSessions(){
  return getCompletedSessions().filter(isSessionRadarEligible);
}

// Apskaičiuoja "dabartinį pėdsaką" — paprastą vidurkį paskutinių N eligible
// sesijų vektorių (N = RADAR_MIN_SESSIONS arba visos, jei mažiau).
// Tai NĖRA asmenybės įvertinimas — tik šios akimirkos pasirinkimų agregatas.
function computeCurrentTrace(eligibleSessions){
  if(eligibleSessions.length === 0) return null;

  const recent = eligibleSessions.slice(-RADAR_MIN_SESSIONS);
  const sum = { aw:0, cs:0, cr:0 };
  recent.forEach(s => {
    sum.aw += s.session_vector.aw;
    sum.cs += s.session_vector.cs;
    sum.cr += s.session_vector.cr;
  });
  const n = recent.length;

  return {
    aw: +(sum.aw/n).toFixed(3),
    cs: +(sum.cs/n).toFixed(3),
    cr: +(sum.cr/n).toFixed(3),
    session_count: n
  };
}

// ── RADAR RENDERING ────────────────────────────────────
// Trikampis radaras trims ašims (aw/cs/cr) su viena taškų forma.
// Naudojame SVG, nes tai vienintelis paprastas būdas nupiešti tokį grafiką
// be papildomos bibliotekos.
function renderRadarSVG(vector){
  const size = 260;
  const center = size / 2;
  const maxRadius = 95;

  // Šešios kryptys, tolygiai išdėstytos aplink centrą (60° tarp kiekvienos).
  // KIEKVIENA ašis (aw/cs/cr) turi DVI priešingas geometrines kryptis.
  // 0 visada yra centre. Teigiama reikšmė plečiasi tik į + kryptį,
  // neigiama — tik į − kryptį. Priešinga pusė lieka nulinėje (centro) padėtyje.
  // Jokios (value+1)/2 transformacijos — tai būtų klaidinga, nes paverstų
  // kryptį į "kiekį" ir sunaikintų dvipolę prasmę.
  const directions = [
    { key:'aw+', angle:-90,  value: Math.max(vector.aw, 0) },
    { key:'cr+', angle:-30,  value: Math.max(vector.cr, 0) },
    { key:'cs-', angle:30,   value: Math.max(-vector.cs, 0) },
    { key:'aw-', angle:90,   value: Math.max(-vector.aw, 0) },
    { key:'cr-', angle:150,  value: Math.max(-vector.cr, 0) },
    { key:'cs+', angle:210,  value: Math.max(vector.cs, 0) },
  ];

  // Vizualinio matomumo dėlei naudojama švelni netiesinė skalė (galia 0.7) su
  // minimaliu matomu spinduliu, o ne gryna kvadratinė šaknis (kuri per stipriai
  // išpučia mažas reikšmes). Tikras nulis lieka centre; bet koks nenulinis
  // signalas gauna minimalų matomą ilgį, kad kryptis nebūtų prarasta taške.
  // SVARBU: tai tik PIEŠIMO mastelis. Tikslios skaitinės reikšmės (aw/cs/cr)
  // visada rodomos nepakeistos tekstu po grafiku — būtent jos yra pagrindinis
  // dydžio šaltinis, ne spindulio ilgis. Metodinė pastaba apie tai rodoma vartotojui.
  const MIN_VISIBLE_PX = 5;
  function toXY(angleDeg, normalizedValue){
    const rad = angleDeg * Math.PI / 180;
    let r;
    if(normalizedValue <= 0){
      r = 0;
    } else {
      r = MIN_VISIBLE_PX + (maxRadius - MIN_VISIBLE_PX) * Math.pow(normalizedValue, 0.7);
    }
    return {
      x: center + r * Math.cos(rad),
      y: center + r * Math.sin(rad)
    };
  }

  const points = directions.map(d => toXY(d.angle, Math.abs(d.value)));
  const polygonPoints = points.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');

  // Ašių linijos ir žymės — visos šešios kryptys vizualiai lygiavertės,
  // jokia kryptis nėra pabrėžta kaip "geresnė" ar "viršutinė".
  const axisLines = directions.map(d => {
    const end = toXY(d.angle, 1);
    return `<line x1="${center}" y1="${center}" x2="${end.x.toFixed(1)}" y2="${end.y.toFixed(1)}" stroke="#32323A" stroke-width="1"/>`;
  }).join('');

  const labelRadius = maxRadius + 22;
  const axisLabels = directions.map(d => {
    const pos = toXY(d.angle, 1 + (22/maxRadius));
    return `<text x="${pos.x.toFixed(1)}" y="${pos.y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" fill="#6E6A64" font-size="12">${d.key}</text>`;
  }).join('');

  const nodeCircles = points.map(p =>
    `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#7C9E8F"/>`
  ).join('');

  return `
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${center}" cy="${center}" r="${maxRadius}" fill="none" stroke="#1E1E24" stroke-width="1"/>
      <circle cx="${center}" cy="${center}" r="${maxRadius/2}" fill="none" stroke="#1E1E24" stroke-width="1"/>
      ${axisLines}
      <polygon points="${polygonPoints}" fill="rgba(124,158,143,0.25)" stroke="#7C9E8F" stroke-width="2" stroke-linejoin="round"/>
      ${nodeCircles}
      <circle cx="${center}" cy="${center}" r="2.5" fill="#6E6A64"/>
      ${axisLabels}
    </svg>
  `;
}

function showRadar(){
  const eligible = getEligibleSessions();
  const count = eligible.length;

  document.getElementById('txt-radar-header').textContent = txt('your_trace') || 'Your current trace';

  const body = document.getElementById('radar-body');
  body.innerHTML = '';

  if(count < RADAR_MIN_SESSIONS){
    // Progreso kortelė lieka DIDELĖ tik kol radaras dar neatrakintas.
    const progressTmpl = txt('radar_progress') || '{n} of {total} sessions for your current trace';
    const progressBox = document.createElement('div');
    progressBox.className = 'radar-progress-box';
    progressBox.innerHTML = `
      <div class="radar-progress-text">${progressTmpl.replace('{n}', count).replace('{total}', RADAR_MIN_SESSIONS)}</div>
    `;
    const sub = document.createElement('div');
    sub.className = 'radar-progress-sub';
    sub.textContent = txt('radar_not_enough') || 'Complete more sessions to see your current trace.';
    progressBox.appendChild(sub);
    body.appendChild(progressBox);
    show('radar');
    return;
  }

  const trace = computeCurrentTrace(eligible);

  // Suskaičiuoti bendrą galiojančių vektorinių pasirinkimų kiekį per naudotas sesijas
  const recentSessions = eligible.slice(-RADAR_MIN_SESSIONS);
  const totalVectorResponses = recentSessions.reduce((sum, s) => sum + (s.valid_vector_responses || 0), 0);

  const chartWrap = document.createElement('div');
  chartWrap.className = 'radar-chart-wrap';
  chartWrap.innerHTML = renderRadarSVG(trace);
  body.appendChild(chartWrap);

  // Metodinė pastaba apie netiesinį vizualinį mastelį — būtina, kad vartotojas
  // nesuprastų spindulio ilgio kaip tiesioginės skaitinės reikšmės projekcijos.
  const scaleNote = document.createElement('div');
  scaleNote.className = 'radar-scale-note';
  scaleNote.textContent = txt('radar_scale_note') ||
    'Small values are visually amplified so the directions remain visible. Exact magnitudes are shown in the numbers below.';
  body.appendChild(scaleNote);

  // Kompaktiška aprėpties eilutė vietoj didelės progreso kortelės, kai jau atrakinta
  const scopeLine = document.createElement('div');
  scopeLine.className = 'radar-scope-line';
  const scopeTmpl = txt('radar_based_on') || 'Based on {sessions} sessions · {responses} vector choices';
  scopeLine.textContent = scopeTmpl
    .replace('{sessions}', trace.session_count)
    .replace('{responses}', totalVectorResponses);
  body.appendChild(scopeLine);

  const axisValues = document.createElement('div');
  axisValues.className = 'radar-axis-values';
  const fmt = (v) => (v >= 0 ? '+' : '') + v.toFixed(2);
  axisValues.innerHTML = `
    <div class="radar-axis-item"><div class="radar-axis-label">AW</div><div class="radar-axis-value">${fmt(trace.aw)}</div></div>
    <div class="radar-axis-item"><div class="radar-axis-label">CS</div><div class="radar-axis-value">${fmt(trace.cs)}</div></div>
    <div class="radar-axis-item"><div class="radar-axis-label">CR</div><div class="radar-axis-value">${fmt(trace.cr)}</div></div>
  `;
  body.appendChild(axisValues);

  const scope = document.createElement('div');
  scope.className = 'result-scope-note';
  scope.textContent = txt('radar_scope_note') ||
    'This shape is built from your chosen responses across the last 3 eligible sessions. It is not a personality assessment.';
  body.appendChild(scope);

  show('radar');
}

function formatHistoryDate(isoString){
  const d = new Date(isoString);
  const today = new Date();
  const isToday = d.toDateString() === today.toDateString();
  const time = d.toLocaleTimeString(currentLang === 'lt' ? 'lt-LT' : 'en-US', {hour:'2-digit', minute:'2-digit'});
  if(isToday){
    const todayLabel = txt('today') || 'Today';
    return `${todayLabel}, ${time}`;
  }
  return d.toLocaleDateString(currentLang === 'lt' ? 'lt-LT' : 'en-US') + ', ' + time;
}

  dataMgmtTitle.className = 'data-mgmt-title';
  dataMgmtTitle.textContent = txt('data_management') || 'Data management';
  dataMgmt.appendChild(dataMgmtTitle);

  const clearBtn = document.createElement('button');
  clearBtn.className = 'btn-danger-outline';
  clearBtn.textContent = txt('clear_browser_data') || 'Clear data in this browser';
  clearBtn.onclick = () => openClearModal(false);
  dataMgmt.appendChild(clearBtn);

  const exportClearBtn = document.createElement('button');
  exportClearBtn.className = 'btn-danger-outline';
  exportClearBtn.textContent = txt('export_and_clear') || 'Export and clear';
  exportClearBtn.onclick = () => openClearModal(true);
  dataMgmt.appendChild(exportClearBtn);

  const clearStatusHolder = document.createElement('div');
  clearStatusHolder.id = 'clear-status-holder';
  if(lastClearStatus){
    const statusDiv = document.createElement('div');
    statusDiv.className = 'clear-success-status';
    statusDiv.textContent = lastClearStatus;
    clearStatusHolder.appendChild(statusDiv);
  }
  dataMgmt.appendChild(clearStatusHolder);

  body.appendChild(dataMgmt);

  // Vieta importo rezultato pranešimui. Jei ankstesnis importas jau įvyko
  // (lastImportStatus egzistuoja), atkuriame jį iškart — kad santrauka
  // liktų matoma net po showHistory() perrenderinimo arba grįžus į šį ekraną.
  const importStatusHolder = document.createElement('div');
  importStatusHolder.id = 'history-import-status';
  body.appendChild(importStatusHolder);
  if(lastImportStatus){
    showImportStatus(lastImportStatus);
  }

  // Nuoroda į radarą — visada rodoma, net jei dar nepakanka sesijų
  const radarLink = document.createElement('button');
  radarLink.className = 'btn-ghost';
  radarLink.style.marginBottom = '16px';
  radarLink.textContent = txt('view_trace') || 'View your current trace';
  radarLink.onclick = showRadar;
  body.appendChild(radarLink);

  if(sessions.length === 0){
    const empty = document.createElement('div');
    empty.className = 'history-empty';
    empty.textContent = txt('cannot_find_sessions') || 'Cannot find your earlier sessions?';
    body.appendChild(empty);

    const hint = document.createElement('div');
    hint.className = 'history-empty-hint';
    hint.textContent = txt('empty_history_hint') ||
      'They may be stored in another browser on this device, for example Chrome instead of the in-app browser used by Skool or another app. Open the page in your usual browser or import a previously exported history file.';
    body.appendChild(hint);

    show('history');
    return;
  }

  sessions.forEach(s => {
    const item = document.createElement('div');
    item.className = 'history-item';
    item.onclick = () => showHistoryDetail(s.session_id);

    const sr = s.session_reflection;
    let obsText = '';
    let isStated = false;
    if(sr){
      if(sr.response_type === 'text' && sr.text){ obsText = sr.text; isStated = true; }
      else if(sr.response_type === 'not_stated' || sr.response_type === 'not_yet') obsText = (txt('observation_not_stated') || '');
    }

    const dateDiv = document.createElement('div');
    dateDiv.className = 'history-date';
    dateDiv.textContent = formatHistoryDate(s.completed_at || s.started_at);
    item.appendChild(dateDiv);

    const countTmpl = txt('choices_count') || '{n} choices';
    const countDiv = document.createElement('div');
    countDiv.className = 'history-count';
    countDiv.textContent = countTmpl.replace('{n}', s.choices.length);
    item.appendChild(countDiv);

    if(obsText){
      if(isStated){
        const label = document.createElement('div');
        label.className = 'observation-label';
        label.textContent = txt('your_observation') || 'Your observation';
        item.appendChild(label);
      }
      const obsDiv = document.createElement('div');
      obsDiv.className = 'history-observation';
      obsDiv.textContent = obsText; // saugus DOM metodas, ne innerHTML
      item.appendChild(obsDiv);
    }

    // I etapas: session_connection_reflection glaustas rodymas.
    // Senoms sesijoms be šio lauko — nieko papildomai nerodoma, jokios klaidos.
    const cr = s.session_connection_reflection;
    if(cr && (cr.response_type === 'text' || cr.response_type === 'not_seen_yet' || cr.response_type === 'prefer_not_to_state')){
      const crDiv = document.createElement('div');
      crDiv.className = 'history-observation';
      crDiv.style.marginTop = '6px';
      if(cr.response_type === 'text' && cr.text){
        crDiv.textContent = cr.text; // saugus DOM metodas
      } else if(cr.response_type === 'not_seen_yet'){
        crDiv.textContent = txt('connection_history_not_seen') || 'A connection between the choices was not yet named this time.';
        crDiv.classList.add('empty');
      } else if(cr.response_type === 'prefer_not_to_state'){
        crDiv.textContent = txt('connection_history_prefer_not') || 'Chose not to name a connection this time.';
        crDiv.classList.add('empty');
      }
      item.appendChild(crDiv);
    }

    body.appendChild(item);
  });

  show('history');
}

// ── HISTORY EXPORT (H stage) ───────────────────────────
// Švarus perkėlimo failas — TIK completed sesijos, jokios techninės/debug
// informacijos, jokios aktyvios sesijos. Skiriasi nuo debug JSON eksporto.
// ── J0 STAGE: SAFE LOCAL DATA CLEAR ───────────────────
// KRITINĖ SAUGUMO TAISYKLĖ: šalinami TIK localStorage raktai, kurie
// prasideda NS prefiksu ('cl_pair_p0_'). Niekada nenaudojamas
// localStorage.clear() ir niekada nešalinami raktai už šio prefikso ribų.
let lastClearStatus = null; // rodomas kaip sėkmės pranešimas, lieka matomas iki kito veiksmo
let pendingExportBeforeClear = false;

function hasAnyPairP0Data(){
  return Object.keys(localStorage).some(key => key.startsWith(NS));
}

function clearAllPairP0Data(){
  const keysToRemove = Object.keys(localStorage).filter(key => key.startsWith(NS));
  keysToRemove.forEach(key => localStorage.removeItem(key));
  return keysToRemove;
}

function openClearModal(withExport){
  pendingExportBeforeClear = withExport;

  if(!hasAnyPairP0Data()){
    // Nulinės istorijos atvejis — tik informacinis pranešimas, jokio destruktyvaus modalo.
    const holder = document.getElementById('clear-status-holder');
    if(holder){
      holder.innerHTML = '';
      const msg = document.createElement('div');
      msg.className = 'clear-success-status';
      msg.textContent = txt('no_data_to_clear') || 'There is no Pair P0 data to clear in this browser.';
      holder.appendChild(msg);
    }
    return;
  }

  if(withExport){
    // "Eksportuoti ir išvalyti" — pirma paleidžiamas eksportas, tik tada modalas.
    try {
      exportHistoryFile();
    } catch(e){
      console.warn('Export before clear failed:', e);
      return; // jei eksportas nepavyko, valymo nevykdyti
    }
  }

  const modal = document.getElementById('clear-data-modal');
  const checkbox = document.getElementById('clear-confirm-checkbox');
  checkbox.checked = false;

  document.getElementById('txt-clear-modal-title').textContent = txt('clear_data_title') || 'Clear data';

  let modalText = txt('clear_data_warning') ||
    'All Pair P0 sessions stored in this browser, the active session, and technical Pair P0 data will be removed. Export your history first if you want to keep it.';
  if(withExport){
    modalText = (txt('export_started_note') || 'The export download has started. Before clearing the data, check that the file was saved.') + ' ' + modalText;
  }
  document.getElementById('clear-modal-text').textContent = modalText;

  const activeNote = document.getElementById('clear-modal-active-note');
  if(SESSION && SESSION.choices && SESSION.choices.length > 0 && SESSION.status === 'active'){
    activeNote.textContent = txt('active_session_will_be_removed') || 'The started but unfinished session will also be removed.';
    activeNote.style.display = 'block';
  } else {
    activeNote.style.display = 'none';
  }

  document.getElementById('txt-clear-checkbox-label').textContent = txt('clear_checkbox_label') ||
    'I understand that this data cannot be restored without a previously exported file.';
  document.getElementById('txt-clear-cancel').textContent = txt('cancel') || 'Cancel';
  document.getElementById('clear-confirm-btn').textContent = txt('clear_data_confirm') || 'Clear data';
  document.getElementById('clear-confirm-btn').disabled = true;

  modal.style.display = 'flex';
}

function closeClearModal(){
  document.getElementById('clear-data-modal').style.display = 'none';
}

function updateClearConfirmButton(){
  const checkbox = document.getElementById('clear-confirm-checkbox');
  document.getElementById('clear-confirm-btn').disabled = !checkbox.checked;
}

function performClearData(){
  const checkbox = document.getElementById('clear-confirm-checkbox');
  if(!checkbox.checked) return; // apsauga — negalima išvalyti be patvirtinimo

  clearAllPairP0Data();

  // Išvalyti runtime būseną atmintyje, kad aktyvi sesija neatsinaujintų.
  SESSION = {
    session_id: uid(),
    status: 'active',
    started_at: new Date().toISOString(),
    completed_at: null,
    timestamp: new Date().toISOString(),
    language: currentLang,
    viewport_width: window.innerWidth,
    viewport_height: window.innerHeight,
    choices: [],
    reflections: [],
    session_reflection: null,
    feedback: {}
  };
  reflectAnswers = {};
  sessionReflection = { response_type: null, text: '' };
  connectionAnswer = { response_type: null, text: '' };
  lastImportStatus = null;

  lastClearStatus = txt('data_cleared_success') || 'Pair P0 data in this browser has been cleared.';

  closeClearModal();
  showHistory(); // perrenderina — istorija bus tuščia, radaras neberodomas
}

function exportHistoryFile(){
  const completed = getCompletedSessions().filter(s => s.status === 'completed');

  const exportData = {
    format: 'conflictlab-history',
    schema_version: '1.0',
    app: 'ConflictLab Pair P0',
    exported_at: new Date().toISOString(),
    vector_model_version: RADAR_MODEL_VERSION,
    completed_sessions: completed
  };

  const blob = new Blob([JSON.stringify(exportData, null, 2)], {type:'application/json'});
  const dateStr = new Date().toISOString().split('T')[0];
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `conflictlab-history-${dateStr}.json`;
  a.click();
}

// ── HISTORY IMPORT (H stage) ────────────────────────────
const MAX_IMPORT_FILE_BYTES = 5 * 1024 * 1024; // 5 MB

function handleHistoryImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file){
    // Vartotojas atšaukė pasirinkimą — nieko nekeisti, jokios klaidos.
    return;
  }

  if(file.size > MAX_IMPORT_FILE_BYTES){
    showImportStatus({ error: txt('file_too_large') || 'The file is too large.' });
    inputEl.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch(err){
      showImportStatus({ error: txt('invalid_history_file') || 'This is not a valid ConflictLab history file.' });
      inputEl.value = '';
      return;
    }

    if(data.format !== 'conflictlab-history' || data.schema_version !== '1.0' || !Array.isArray(data.completed_sessions)){
      showImportStatus({ error: txt('invalid_history_file') || 'This is not a valid ConflictLab history file.' });
      inputEl.value = '';
      return;
    }

    const result = mergeImportedHistory(data.completed_sessions);
    inputEl.value = '';

    // SVARBU: showHistory() perkuria visą ekraną (body.innerHTML=''). Todėl
    // rezultatą pirmiausia įrašome į lastImportStatus, o showHistory() jį
    // pati atkuria savo renderinimo pabaigoje — santrauka lieka matoma
    // vartotojui, o ne parašoma ir iškart ištrinama tos pačios funkcijos viduje.
    lastImportStatus = { result };
    showHistory();
  };
  reader.onerror = () => {
    showImportStatus({ error: txt('invalid_history_file') || 'This is not a valid ConflictLab history file.' });
    inputEl.value = '';
  };
  reader.readAsText(file);
}

function isValidImportedSession(session){
  return typeof session.session_id === 'string' &&
    session.session_id.trim() !== '' &&
    session.status === 'completed' &&
    typeof session.completed_at === 'string' &&
    Array.isArray(session.choices) &&
    Array.isArray(session.reflections);
}

// Sujungia importuotas sesijas su esamomis pagal session_id. Vietinis įrašas
// NIEKADA neperrašomas importuotu — dublikatai tiesiog praleidžiami.
function mergeImportedHistory(importedSessions){
  const existing = getCompletedSessions();
  const existingIds = new Set(existing.map(s => s.session_id));

  let imported = 0;
  let duplicates = 0;
  let invalid = 0;

  const toAdd = [];

  importedSessions.forEach(session => {
    if(!isValidImportedSession(session)){
      invalid++;
      return;
    }
    if(existingIds.has(session.session_id)){
      duplicates++;
      return;
    }
    toAdd.push(session);
    existingIds.add(session.session_id); // apsauga nuo dublikatų pačiame importo faile
    imported++;
  });

  const merged = existing.concat(toAdd);
  merged.sort((a,b) => new Date(a.completed_at) - new Date(b.completed_at));

  try {
    localStorage.setItem(NS + 'completed_sessions', JSON.stringify(merged));
  } catch(e){
    console.warn('Failed to save merged history:', e);
  }

  return { imported, duplicates, invalid };
}

function showImportStatus({ result, error }){
  lastImportStatus = { result, error };
  const holder = document.getElementById('history-import-status');
  if(!holder) return;
  holder.innerHTML = '';

  if(error){
    const box = document.createElement('div');
    box.className = 'history-import-error';
    box.textContent = error; // saugus DOM metodas
    holder.appendChild(box);
    return;
  }

  const box = document.createElement('div');
  box.className = 'history-import-summary';

  const importedLine = document.createElement('div');
  importedLine.textContent = (txt('imported_count') || 'Imported sessions: {n}').replace('{n}', result.imported);
  box.appendChild(importedLine);

  const dupLine = document.createElement('div');
  dupLine.textContent = (txt('already_on_device') || 'Already on this device: {n}').replace('{n}', result.duplicates);
  box.appendChild(dupLine);

  const invalidLine = document.createElement('div');
  invalidLine.textContent = (txt('invalid_records') || 'Invalid records: {n}').replace('{n}', result.invalid);
  box.appendChild(invalidLine);

  holder.appendChild(box);
}

function showHistoryDetail(sessionId){
  const sessions = getCompletedSessions();
  const s = sessions.find(x => x.session_id === sessionId);
  if(!s) return;

  document.getElementById('txt-history-detail-header').textContent = formatHistoryDate(s.completed_at || s.started_at);

  const body = document.getElementById('history-detail-body');
  body.innerHTML = '';

  s.choices.forEach(choice => {
    const pair = PAIRS.find(p => p.pair_id === choice.pair_id);
    const imgObj = pair
      ? (pair.image_a.id === choice.selected_image_id ? pair.image_a : pair.image_b)
      : null;
    const ref = (s.reflections || []).find(r => r.image_id === choice.selected_image_id);

    let mainText = '';
    if(ref){
      if(ref.response_type === 'cue') mainText = ref.cue_text;
      else if(ref.response_type === 'custom') mainText = ref.custom_words;
      else if(ref.response_type === 'hard_to_say') mainText = (txt('hard_to_say_label') || 'Hard to say');
    }

    const div = document.createElement('div');
    div.className = 'result-item';

    const thumb = document.createElement('div');
    thumb.className = 'result-thumb';
    if(imgObj){
      const img = document.createElement('img');
      img.src = imgObj.src;
      img.alt = '';
      img.loading = 'lazy';
      thumb.appendChild(img);
    }
    div.appendChild(thumb);

    if(mainText){
      const wordsDiv = document.createElement('div');
      wordsDiv.className = 'result-words';
      wordsDiv.textContent = mainText; // saugus DOM metodas — mainText gali būti custom_words
      div.appendChild(wordsDiv);
    }

    if(ref && ref.reflection_text){
      const reflDiv = document.createElement('div');
      reflDiv.style.fontSize = '.8rem';
      reflDiv.style.color = 'var(--dim)';
      reflDiv.style.textAlign = 'center';
      reflDiv.style.marginTop = '4px';
      reflDiv.textContent = ref.reflection_text; // saugus DOM metodas
      div.appendChild(reflDiv);
    }

    body.appendChild(div);
  });

  const sr = s.session_reflection;
  if(sr){
    const obsBlock = document.createElement('div');
    obsBlock.className = 'result-observation';

    // Žyma "Tavo pastebėjimas" rodoma TIK kai yra realiai įvardytas tekstas.
    // Neįvardytai refleksijai (not_stated arba senas not_yet) žymos nerodyti.
    if(sr.response_type === 'text' && sr.text){
      const label = document.createElement('div');
      label.className = 'result-observation-label';
      label.textContent = txt('your_observation') || 'Your observation';
      obsBlock.appendChild(label);

      const text = document.createElement('div');
      text.className = 'result-observation-text';
      text.textContent = sr.text;
      obsBlock.appendChild(text);
    } else if(sr.response_type === 'not_stated' || sr.response_type === 'not_yet'){
      const text = document.createElement('div');
      text.className = 'result-observation-text empty';
      text.textContent = txt('observation_not_stated') || '';
      obsBlock.appendChild(text);
    }

    body.appendChild(obsBlock);
  }

  show('history-detail');
}

function exportDebug(){
  const eligible = getEligibleSessions();
  const data = {
    active_session: SESSION,
    completed_sessions: getCompletedSessions(),
    radar_eligible_session_ids: eligible.map(s => s.session_id),
    radar_eligible_count: eligible.length,
    current_trace: computeCurrentTrace(eligible),
    pairs_loaded: PAIRS.length,
    audio_enabled: audioEnabled,
    audio_started: audioStarted,
    exported_at: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `p0-debug-${SESSION.session_id}.json`;
  a.click();
}

init();
</script>
