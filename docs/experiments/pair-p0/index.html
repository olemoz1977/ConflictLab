function renderBetaProgressOnDone(){
  // Papildo esamą "Ačiū" ekraną beta progreso info ir, jei >=3, nuoroda į interviu.
  const holder = document.getElementById('txt-done-sub');
  if(!holder || !betaState) return;

  // fix(three-session-limit): rodomas skaičius VISADA apkarpytas iki 3.
  const count = cappedBetaSessionCount();

  // TEMPORARY DEBUG LOG — pašalinti po realaus telefono patvirtinimo.
  console.log({
    point: 'beta-done-render',
    participant: betaState.participant_id,
    completed_raw: countBetaCompletedSessions(),
    completed_capped: count,
    radar_shown: betaState.radar_shown,
    eligible_beta: getEligibleBetaSessions().length
  });
  const tmpl = txt('beta_sessions_progress') || 'Completed beta sessions: {n} of 3';
  let text = tmpl.replace('{n}', count);

  if(count < 3){
    text += ' ' + (txt('beta_next_session_note') || 'Complete the next session at another time when convenient.');
  }
  holder.textContent = text;

  // fix(three-session-limit): "Pradėti kitą sesiją" mygtukas šiame ekrane
  // paslėpiamas, kai beta dalyvis jau pasiekė 3 sesijas — M0 beta testas
  // visada baigiasi po lygiai 3, jokių papildomų sesijų vien "radarui užpildyti".
  const startAnotherBtn = document.getElementById('txt-start-another');
  if(startAnotherBtn){
    startAnotherBtn.style.display = (count >= 3) ? 'none' : '';
  }

  // Pašalinti senus mygtukus prieš perrenderinant (kad nesikauptų dublikatai)
  const existingBtn = document.getElementById('beta-complete-interview-btn');
  if(existingBtn) existingBtn.remove();
  const existingTraceBtn = document.getElementById('beta-view-trace-btn');
  if(existingTraceBtn) existingTraceBtn.remove();

  if(count >= 3 && !betaState.completed_at){
    // fix(three-session-limit): eligibility skaičiuojama TIK iš pirmų 3 beta
    // sesijų, ne iš viso completed_sessions sąrašo.
    const eligible = getEligibleBetaSessions();
    const radarEligible = eligible.length >= RADAR_MIN_SESSIONS;
    const radarAlreadyShown = betaState.radar_shown === true;

    // Radaras eligible, bet dar nepamatytas — pirmiausia reikalauti peržiūrėti pėdsaką.
    // Tai VIENINTELIS privalomas kelias į radarą šiame sraute (ne per View history).
    if(radarEligible && !radarAlreadyShown){
      const traceBtn = document.createElement('button');
      traceBtn.id = 'beta-view-trace-btn';
      traceBtn.className = 'btn-primary';
      traceBtn.style.marginTop = '16px';
      traceBtn.textContent = txt('view_trace') || 'View your current trace';
      traceBtn.onclick = () => {
        // fix(radar-nav-path): naudoja centrinę openRadarAsBeta() — ta pati
        // funkcija, ta pati žymėjimo logika kaip istorijos nuorodoje.
        openRadarAsBeta();
        // Po grįžimo iš radaro ekrano, "Baigti sesiją" mygtukas radaro
        // ekrane veda atgal į showHistory() pagal esamą logiką — bet mums
        // reikia grįžti į DONE ekraną su jau aktyviu Complete beta test.
        // Todėl radaro atgal-mygtuką čia laikinai nukreipiame į šį ekraną.
        const backBtn = document.getElementById('txt-radar-back');
        if(backBtn){
          backBtn.onclick = () => {
            show('done');
            renderBetaProgressOnDone(); // perrenderina su radar_shown=true, todėl dabar rodys Complete beta test
          };
        }
      };
      document.getElementById('screen-done').querySelector('.screen-body').appendChild(traceBtn);
      return; // Complete beta test dar nerodomas, kol radaras nepamatytas
    }

    // Radaras arba jau pamatytas, arba neeligible — leisti tęsti į interviu.
    const btn = document.createElement('button');
    btn.id = 'beta-complete-interview-btn';
    btn.className = 'btn-primary';
    btn.style.marginTop = '16px';
    btn.textContent = txt('complete_beta_test') || 'Complete beta test';
    btn.onclick = renderBetaInterview;
    document.getElementById('screen-done').querySelector('.screen-body').appendChild(btn);
  }
}

const BETA_INTERVIEW_QUESTIONS = [
  { key:'q1', textKey:'beta_iv_q1', fallback:'What did you think the tool was asking you to do?' },
  { key:'q2', textKey:'beta_iv_q2', fallback:'How did you decide between the images?' },

  { key:'q7', textKey:'beta_iv_q7', fallback:'Did the radar add value, confusion, or neither?', skipIfNotShown:true },
  { key:'q8', textKey:'beta_iv_q8', fallback:'Would you use this again without being asked?' },
  { key:'q9', textKey:'beta_iv_q9', fallback:'What was the most confusing or least useful part?' },

];

function renderBetaInterview(){
  const body = document.getElementById('beta-interview-body');
  body.innerHTML = '';

  document.getElementById('txt-beta-interview-header').textContent = txt('complete_beta_test') || 'Complete beta test';

  // M0 fix: naudoti FAKTINĮ radar_shown įrašą, ne eligibility patikrą.
  // Griežtas === true palyginimas apsaugo nuo senų beta_state objektų
  // (prieš šį fix'ą), kuriuose lauko gali visai nebūti (undefined !== true).
  const radarWasShown = betaState.radar_shown === true;
  // fix(three-session-limit): eligibility tikrinama tik iš pirmų 3 beta sesijų.
  const eligible = getEligibleBetaSessions();
  const radarCurrentlyEligible = eligible.length >= RADAR_MIN_SESSIONS;

  const existingAnswers = (betaState.post_test_interview && betaState.post_test_interview.answers) || {};

  // Jei radaras dar niekada nebuvo faktiškai atidarytas, bet dalyvis JAU
  // atitinka eligibility kriterijus — duoti jam realią galimybę pažiūrėti
  // prieš pradedant interviu, o ne tyliai praleisti klausimus.
  if(!radarWasShown && radarCurrentlyEligible){
    const viewTraceBlock = document.createElement('div');
    viewTraceBlock.className = 'beta-feedback-block';

    const note = document.createElement('div');
    note.className = 'beta-question';
    note.textContent = txt('beta_view_trace_prompt') || 'Before continuing, you can view your current trace.';
    viewTraceBlock.appendChild(note);

    const viewBtn = document.createElement('button');
    viewBtn.className = 'btn-primary';
    viewBtn.style.marginTop = '10px';
    viewBtn.textContent = txt('view_trace') || 'View your current trace';
    viewBtn.onclick = () => {
      // fix(radar-nav-path): naudoja tą pačią centrinę funkciją kaip kiti keliai.
      openRadarAsBeta();
    };
    viewTraceBlock.appendChild(viewBtn);

    body.appendChild(viewTraceBlock);
  }

  const progress = document.createElement('div');
  progress.className = 'beta-interview-progress';
  body.appendChild(progress);

  function updateProgress(){
    const answered = BETA_INTERVIEW_QUESTIONS.filter(q => (existingAnswers[q.key] || '').trim().length > 0).length;
    const tmpl = txt('beta_interview_progress') || '{n} / 10';
    progress.textContent = tmpl.replace('{n}', answered);
  }

  BETA_INTERVIEW_QUESTIONS.forEach(q => {
    // M0 fix: q6/q7 rodomi TIK kai radaras buvo faktiškai parodytas.
    // Jei ne — jie visiškai nerodomi ir nelaikomi privalomais, nes
    // "nematau" čia reikštų klaidingą interpretaciją apie nesupratimą,
    // kai iš tikrųjų funkcija niekada nebuvo pademonstruota.
    if(q.skipIfNotShown && !radarWasShown) return;
    if(q.hasNotShown && !radarWasShown) return;

    const item = document.createElement('div');
    item.className = 'beta-interview-item';

    const qText = document.createElement('div');
    qText.className = 'beta-interview-q';
    qText.textContent = txt(q.textKey) || q.fallback;
    item.appendChild(qText);

    const textarea = document.createElement('textarea');
    textarea.className = 'beta-interview-textarea';
    textarea.value = existingAnswers[q.key] || '';
    textarea.oninput = () => {
      existingAnswers[q.key] = textarea.value;
      betaState.post_test_interview = betaState.post_test_interview || { completed_at:null, answers:{} };
      betaState.post_test_interview.answers = existingAnswers;
      saveBetaState();
      updateProgress();
    };
    item.appendChild(textarea);

    body.appendChild(item);
  });

  betaState.post_test_interview = betaState.post_test_interview || { completed_at:null, answers:{} };
  betaState.post_test_interview.answers = existingAnswers;
  saveBetaState();

  updateProgress();

  document.getElementById('beta-interview-finish-btn').textContent = txt('complete_beta_test') || 'Complete beta test';

  show('beta-interview');
}

  betaState.post_test_interview.completed_at = new Date().toISOString();

// ── HISTORY IMPORT (H stage) ────────────────────────────
const MAX_IMPORT_FILE_BYTES = 5 * 1024 * 1024; // 5 MB

function handleHistoryImportFile(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file){
    // Vartotojas atšaukė pasirinkimą — nieko nekeisti, jokios klaidos.
    return;
  }

  if(file.size > MAX_IMPORT_FILE_BYTES){
    showImportStatus({ error: txt('file_too_large') || 'The file is too large.' });
    inputEl.value = '';
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch(err){
      showImportStatus({ error: txt('invalid_history_file') || 'This is not a valid ConflictLab history file.' });
      inputEl.value = '';
      return;
    }

    if(data.format !== 'conflictlab-history' || data.schema_version !== '1.0' || !Array.isArray(data.completed_sessions)){
      showImportStatus({ error: txt('invalid_history_file') || 'This is not a valid ConflictLab history file.' });
      inputEl.value = '';
      return;
    }

    const result = mergeImportedHistory(data.completed_sessions);
    inputEl.value = '';

    // SVARBU: showHistory() perkuria visą ekraną (body.innerHTML=''). Todėl
    // rezultatą pirmiausia įrašome į lastImportStatus, o showHistory() jį
    // pati atkuria savo renderinimo pabaigoje — santrauka lieka matoma
    // vartotojui, o ne parašoma ir iškart ištrinama tos pačios funkcijos viduje.
    lastImportStatus = { result };
    showHistory();
  };
  reader.onerror = () => {
    showImportStatus({ error: txt('invalid_history_file') || 'This is not a valid ConflictLab history file.' });
    inputEl.value = '';
  };
  reader.readAsText(file);
}

function isValidImportedSession(session){
  return typeof session.session_id === 'string' &&
    session.session_id.trim() !== '' &&
    session.status === 'completed' &&
    typeof session.completed_at === 'string' &&
    Array.isArray(session.choices) &&
    Array.isArray(session.reflections);
}

// Sujungia importuotas sesijas su esamomis pagal session_id. Vietinis įrašas
// NIEKADA neperrašomas importuotu — dublikatai tiesiog praleidžiami.
function mergeImportedHistory(importedSessions){
  const existing = getCompletedSessions();
  const existingIds = new Set(existing.map(s => s.session_id));

  let imported = 0;
  let duplicates = 0;
  let invalid = 0;

  const toAdd = [];

  importedSessions.forEach(session => {
    if(!isValidImportedSession(session)){
      invalid++;
      return;
    }
    if(existingIds.has(session.session_id)){
      duplicates++;
      return;
    }
    toAdd.push(session);
    existingIds.add(session.session_id); // apsauga nuo dublikatų pačiame importo faile
    imported++;
  });

  const merged = existing.concat(toAdd);
  merged.sort((a,b) => new Date(a.completed_at) - new Date(b.completed_at));

  try {
    localStorage.setItem(NS + 'completed_sessions', JSON.stringify(merged));
  } catch(e){
    console.warn('Failed to save merged history:', e);
  }

  return { imported, duplicates, invalid };
}

function showImportStatus({ result, error }){
  lastImportStatus = { result, error };
  const holder = document.getElementById('history-import-status');
  if(!holder) return;
  holder.innerHTML = '';

  if(error){
    const box = document.createElement('div');
    box.className = 'history-import-error';
    box.textContent = error; // saugus DOM metodas
    holder.appendChild(box);
    return;
  }

  const box = document.createElement('div');
  box.className = 'history-import-summary';

  const importedLine = document.createElement('div');
  importedLine.textContent = (txt('imported_count') || 'Imported sessions: {n}').replace('{n}', result.imported);
  box.appendChild(importedLine);

  const dupLine = document.createElement('div');
  dupLine.textContent = (txt('already_on_device') || 'Already on this device: {n}').replace('{n}', result.duplicates);
  box.appendChild(dupLine);

  const invalidLine = document.createElement('div');
  invalidLine.textContent = (txt('invalid_records') || 'Invalid records: {n}').replace('{n}', result.invalid);
  box.appendChild(invalidLine);

  holder.appendChild(box);
}

function showHistoryDetail(sessionId){
  const sessions = getCompletedSessions();
  const s = sessions.find(x => x.session_id === sessionId);
  if(!s) return;

  document.getElementById('txt-history-detail-header').textContent = formatHistoryDate(s.completed_at || s.started_at);

  const body = document.getElementById('history-detail-body');
  body.innerHTML = '';

  s.choices.forEach(choice => {
    const pair = PAIRS.find(p => p.pair_id === choice.pair_id);
    const imgObj = pair
      ? (pair.image_a.id === choice.selected_image_id ? pair.image_a : pair.image_b)
      : null;
    const ref = (s.reflections || []).find(r => r.image_id === choice.selected_image_id);

    let mainText = '';
    if(ref){
      if(ref.response_type === 'cue') mainText = ref.cue_text;
      else if(ref.response_type === 'custom') mainText = ref.custom_words;
      else if(ref.response_type === 'hard_to_say') mainText = (txt('hard_to_say_label') || 'Hard to say');
    }

    const div = document.createElement('div');
    div.className = 'result-item';

    const thumb = document.createElement('div');
    thumb.className = 'result-thumb';
    if(imgObj){
      const img = document.createElement('img');
      img.src = imgObj.src;
      img.alt = '';
      img.loading = 'lazy';
      thumb.appendChild(img);
    }
    div.appendChild(thumb);

    if(mainText){
      const wordsDiv = document.createElement('div');
      wordsDiv.className = 'result-words';
      wordsDiv.textContent = mainText; // saugus DOM metodas — mainText gali būti custom_words
      div.appendChild(wordsDiv);
    }

    if(ref && ref.reflection_text){
      const reflDiv = document.createElement('div');
      reflDiv.style.fontSize = '.8rem';
      reflDiv.style.color = 'var(--dim)';
      reflDiv.style.textAlign = 'center';
      reflDiv.style.marginTop = '4px';
      reflDiv.textContent = ref.reflection_text; // saugus DOM metodas
      div.appendChild(reflDiv);
    }

    body.appendChild(div);
  });

  // PRIORITETO TAISYKLĖ (tas pats principas kaip istorijos sąraše):
  // jei yra session_connection_reflection, rodyti TIK jį; senas session_reflection
  // naudojamas kaip fallback tik kai naujo lauko visai nėra.
  const cr = s.session_connection_reflection;
  const sr = s.session_reflection;

  if(cr && (cr.response_type === 'text' || cr.response_type === 'not_seen_yet' || cr.response_type === 'prefer_not_to_state')){
    const obsBlock = document.createElement('div');
    obsBlock.className = 'result-observation';

    if(cr.response_type === 'text' && cr.text){
      const label = document.createElement('div');
      label.className = 'result-observation-label';
      label.textContent = txt('your_observation') || 'Your observation';
      obsBlock.appendChild(label);

      const text = document.createElement('div');
      text.className = 'result-observation-text';
      text.textContent = cr.text;
      obsBlock.appendChild(text);
    } else if(cr.response_type === 'not_seen_yet'){
      const text = document.createElement('div');
      text.className = 'result-observation-text empty';
      text.textContent = txt('connection_history_not_seen') || 'A connection between the choices has not yet been named.';
      obsBlock.appendChild(text);
    } else if(cr.response_type === 'prefer_not_to_state'){
      const text = document.createElement('div');
      text.className = 'result-observation-text empty';
      text.textContent = txt('connection_history_prefer_not') || 'You chose not to name a connection.';
      obsBlock.appendChild(text);
    }

    body.appendChild(obsBlock);
  } else if(sr){
    const obsBlock = document.createElement('div');
    obsBlock.className = 'result-observation';

    // Žyma "Tavo pastebėjimas" rodoma TIK kai yra realiai įvardytas tekstas.
    // Neįvardytai refleksijai (not_stated arba senas not_yet) žymos nerodyti.
    if(sr.response_type === 'text' && sr.text){
      const label = document.createElement('div');
      label.className = 'result-observation-label';
      label.textContent = txt('your_observation') || 'Your observation';
      obsBlock.appendChild(label);

      const text = document.createElement('div');
      text.className = 'result-observation-text';
      text.textContent = sr.text;
      obsBlock.appendChild(text);
    } else if(sr.response_type === 'not_stated' || sr.response_type === 'not_yet'){
      const text = document.createElement('div');
      text.className = 'result-observation-text empty';
      text.textContent = txt('observation_not_stated') || '';
      obsBlock.appendChild(text);
    }

    body.appendChild(obsBlock);
  }

  show('history-detail');
}

function exportDebug(){
  const eligible = getEligibleSessions();
  const data = {
    active_session: SESSION,
    completed_sessions: getCompletedSessions(),
    radar_eligible_session_ids: eligible.map(s => s.session_id),
    radar_eligible_count: eligible.length,
    current_trace: computeCurrentTrace(eligible),
    pairs_loaded: PAIRS.length,
    audio_enabled: audioEnabled,
    audio_started: audioStarted,
    exported_at: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `p0-debug-${SESSION.session_id}.json`;
  a.click();
}

init();
</script>
