<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ConflictLab — Future Session Pilot Preview</title>
<style>
:root{color-scheme:dark;--bg:#0c0c0f;--card:#141417;--line:#29292f;--text:#e8e4dc;--muted:#918d86;--accent:#83a998}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
main{width:min(100%,640px);margin:auto;min-height:100dvh;padding:calc(18px + env(safe-area-inset-top)) 14px calc(48px + env(safe-area-inset-bottom))}
.brand{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}.draft{font-size:12px;color:var(--muted);line-height:1.45;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.center{text-align:center}.status{color:var(--muted);line-height:1.5}
body.rapid-mode{overflow:hidden}
body.rapid-mode main{padding:calc(8px + env(safe-area-inset-top)) 10px calc(8px + env(safe-area-inset-bottom));min-height:100dvh}
body.rapid-mode .brand,body.rapid-mode .draft{display:none}
button{font:inherit}.primary{border:0;border-radius:11px;background:var(--accent);color:#07100c;padding:13px 18px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.35;cursor:not-allowed}
.secondary{border:1px solid #34343c;border-radius:11px;background:#19191d;color:var(--text);padding:12px 16px;cursor:pointer}
.intro h2,.retry h2,.done h2{font-size:23px;font-weight:560;margin:0 0 8px}.intro p,.retry p,.done p{color:#bcb7ae;line-height:1.5}.intro .boundary{font-size:12px;color:var(--muted)}
.rapid-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:12px;color:var(--muted);font-size:12px}.rapid-head span:last-child{text-align:right}.rapid-stage{display:grid;gap:10px}
.visual-choice{display:block;width:100%;padding:0;background:#111114;border:1px solid #2b2b31;border-radius:16px;overflow:hidden;cursor:pointer;touch-action:manipulation}
.visual-choice:active{transform:scale(.995)}.visual-choice:disabled{cursor:default;opacity:.9}.visual-choice img{display:block;width:100%;aspect-ratio:1/1;object-fit:contain}
.rapid-shell{height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 16px);display:flex;flex-direction:column;padding:12px;border-radius:16px}
.rapid-shell .rapid-stage{flex:1;min-height:0;grid-template-rows:repeat(2,minmax(0,1fr));gap:10px}
.rapid-shell .visual-choice{height:100%}
.rapid-shell .visual-choice img{height:100%;width:100%;aspect-ratio:auto;object-fit:contain}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.actions.centered{justify-content:center}
details{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--muted);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px;color:#aaa59c}
.error{color:#e0a1a1;background:#241617;border:1px solid #583133;border-radius:12px;padding:12px}
.cl-reflection{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.cl-reflection__progress{font-size:12px;color:var(--accent)}
.cl-reflection__title{font-size:24px;font-weight:550;margin:8px 0}.cl-reflection__prompt{color:#c7c2b9;line-height:1.45}
.cl-reflection__image{display:block;width:min(100%,430px);aspect-ratio:1/1;object-fit:contain;margin:16px auto;border-radius:14px;background:#0b0b0d}
.cl-reflection__options{border:0;padding:0;margin:0;display:grid;gap:10px}.cl-reflection__option{display:flex;gap:10px;align-items:flex-start;border:1px solid #303038;border-radius:12px;padding:12px;cursor:pointer}
.cl-reflection__radio{margin-top:3px}.cl-reflection__other{margin-top:12px}.cl-reflection__local-note{font-size:12px;color:var(--muted)}
.cl-reflection__textarea{width:100%;background:#0d0d10;color:var(--text);border:1px solid #303038;border-radius:10px;padding:10px;font:inherit}
.cl-reflection__actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.cl-reflection__actions button{border-radius:10px;padding:11px 16px;font:inherit}
.cl-reflection__back{background:#19191d;color:#ddd8ce;border:1px solid #303038}.cl-reflection__next{background:var(--accent);color:#0b0b0d;border:0;font-weight:650}
.cl-reflection__sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
</style>
</head>
<body>
<main>
  <div class="brand">ConflictLab · internal pilot</div>
  <div class="draft">DRAFT preview. Training is local-only. 6000 ms is an unvalidated timing hypothesis. Gate D / Gate E are NONE. Response and telemetry data are not uploaded; static configs and images are loaded read-only.</div>
  <div id="app" class="card center">
    <p id="boot-status" class="status">Ruošiami vaizdai…</p>
  </div>
</main>

<script type="module">
import { createTwoSessionCycle, preloadPathsForSession } from '../../src/future_session/presentation_plan.mjs';
import { createTrainingPlan, preloadPathsForTraining } from '../../src/future_session/training_plan.mjs';
import { preloadAssetBundle } from '../../src/future_session/asset_preloader.mjs';
import { FutureSessionOrchestrator } from '../../src/future_session/session_orchestrator.mjs';
import { buildReflectionItems } from '../../src/future_session/reflection_model.mjs';
import { mountReflectionUI } from '../../src/future_session/reflection_ui.mjs';

const app = document.getElementById('app');
const rootPrefix = '../../';
const params = new URLSearchParams(location.search);
const language = params.get('lang') === 'en' ? 'en' : 'lt';
const requestedForm = ['F2-A', 'F2-B'].includes(params.get('form')) ? params.get('form') : null;

const copy = language === 'en' ? {
  trainingTitle:'Short practice',
  trainingIntro:'You will see 3 image pairs one after another. Choose the image you would pick first. One shared 6-second budget covers all three choices and starts when the first pair becomes interactive.',
  trainingBoundary:'Practice choices are marked as training and are excluded from analysis, timing calibration, Gate D/E and response-data upload.',
  trainingStart:'Start practice',
  trainingAttempt:'Practice',
  trainingTimeoutTitle:'Practice time expired',
  trainingRetryText:'Repeat the same practice block. The goal is only to get used to the interaction and shared timer.',
  trainingRetry:'Repeat practice',
  trainingRestart:'Restart practice',
  trainingComplete:'Practice complete',
  trainingCompleteText:'The interaction is the same. The next start begins the fresh measured pilot block.',
  mainStart:'Start main session',
  attempt:'Attempt',
  timeoutTitle:'Time expired',
  retryText:'Repeat the same three-pair block. Pair order and image positions stay unchanged.',
  retry:'Try again',
  done:'Session complete',
  doneText:'This internal preview keeps response and telemetry data local. Static configs and images are loaded read-only.',
  export:'Download UX telemetry JSON',
  debug:'Internal preview data',
  noAnchor:'No completed A/B choice was available for reflection.',
  error:'Technical preview error',
} : {
  trainingTitle:'Trumpa treniruotė',
  trainingIntro:'Pamatysi 3 vaizdų poras viena po kitos. Kiekvieną kartą pasirink vaizdą, kurį rinktumeisi pirmiau. Visoms trims poroms skirtas vienas bendras 6 sekundžių laikas, kuris prasideda, kai pirmoji pora tampa aktyvi.',
  trainingBoundary:'Treniruotės pasirinkimai žymimi kaip training ir nepatenka į analizę, 6000 ms kalibravimą, Gate D/E ar atsakymų duomenų įkėlimą.',
  trainingStart:'Pradėti treniruotę',
  trainingAttempt:'Treniruotė',
  trainingTimeoutTitle:'Treniruotės laikas baigėsi',
  trainingRetryText:'Pakartok tą patį treniruotės bloką. Tikslas čia tik priprasti prie sąveikos ir bendro laiko.',
  trainingRetry:'Pakartoti treniruotę',
  trainingRestart:'Pradėti treniruotę iš naujo',
  trainingComplete:'Treniruotė baigta',
  trainingCompleteText:'Veiksmas bus toks pats. Kitas startas jau pradės naują pagrindinį piloto bloką.',
  mainStart:'Pradėti pagrindinę sesiją',
  attempt:'Bandymas',
  timeoutTitle:'Laikas baigėsi',
  retryText:'Pakartok tą patį trijų porų bloką. Porų tvarka ir vaizdų pozicijos nesikeičia.',
  retry:'Bandyti dar kartą',
  done:'Sesija baigta',
  doneText:'Šiame vidiniame preview atsakymai ir telemetrija lieka lokaliai. Statiniai configai ir vaizdai užkraunami tik skaitymui.',
  export:'Atsisiųsti UX telemetrijos JSON',
  debug:'Vidiniai preview duomenys',
  noAnchor:'Refleksijai neliko nė vieno užbaigto A/B pasirinkimo.',
  error:'Techninė preview klaida',
};

let bundle = null;
let activeRunner = null;
let activeMode = 'BOOT';
let runner = null;
let trainingRunner = null;
let sessionPlan = null;
let trainingPlan = null;
let deadlineTimer = null;
let attemptClockStart = null;
let trainingRuns = [];
let trainingCompleted = false;
let reflectionSelections = [];
let deviceContextAtStart = null;

function uuid() {
  return crypto.randomUUID();
}

function setRapidMode(enabled) {
  document.body.classList.toggle('rapid-mode', Boolean(enabled));
}

function captureDeviceContext() {
  return {
    viewportWidth: window.innerWidth,
    viewportHeight: window.innerHeight,
    screenWidth: window.screen?.width ?? null,
    screenHeight: window.screen?.height ?? null,
    devicePixelRatio: window.devicePixelRatio ?? null,
    maxTouchPoints: navigator.maxTouchPoints ?? null,
    coarsePointer: window.matchMedia?.('(pointer: coarse)').matches ?? null,
    language: navigator.language ?? null,
    userAgent: navigator.userAgent ?? null,
  };
}

function clearDeadline() {
  if (deadlineTimer !== null) clearTimeout(deadlineTimer);
  deadlineTimer = null;
  attemptClockStart = null;
}

function activeBudgetMs() {
  return activeMode === 'TRAINING'
    ? trainingSet.protocol.shared_budget_ms
    : rapidProtocol.timing.block_budget_ms;
}

function scheduleDeadline(startAt, budgetMs) {
  attemptClockStart = startAt;

  function check() {
    if (!activeRunner || activeRunner.phase !== 'RAPID') return;
    const remaining = budgetMs - (performance.now() - attemptClockStart);
    if (remaining > 0) {
      deadlineTimer = setTimeout(check, Math.max(4, remaining + 1));
      return;
    }
    try {
      const result = activeRunner.expire(performance.now());
      handleTerminal(result);
    } catch (error) {
      showError(error);
    }
  }

  deadlineTimer = setTimeout(check, budgetMs + 1);
}

function assetUrl(path) {
  return bundle.get(path).objectUrl;
}

function pairProgress(index) {
  return language === 'en' ? `${index} of 3` : `${index} iš 3`;
}

function renderPair() {
  const pair = activeRunner.currentPair();
  if (!pair) return;

  setRapidMode(true);
  app.className = 'card rapid-shell';
  app.replaceChildren();

  const head = document.createElement('div');
  head.className = 'rapid-head';

  const progress = document.createElement('span');
  progress.textContent = pairProgress(activeRunner.activeAttempt.currentIndex + 1);

  const attempt = document.createElement('span');
  attempt.textContent = activeMode === 'TRAINING'
    ? `${copy.trainingAttempt} ${activeRunner.activeAttempt.attemptNumber}/3`
    : `${copy.attempt} ${activeRunner.activeAttempt.attemptNumber}/3`;

  head.append(progress, attempt);

  const stage = document.createElement('div');
  stage.className = 'rapid-stage';

  const choices = [
    { id:'A', path:pair.assetAPath, position:pair.assetAPosition },
    { id:'B', path:pair.assetBPath, position:pair.assetBPosition },
  ].sort((a,b) => (a.position === 'top' ? -1 : 1));

  for (const choice of choices) {
    const button = document.createElement('button');
    button.className = 'visual-choice';
    button.type = 'button';
    button.setAttribute('aria-label', choice.position === 'top'
      ? (language === 'en' ? 'First image' : 'Pirmas vaizdas')
      : (language === 'en' ? 'Second image' : 'Antras vaizdas'));

    const image = document.createElement('img');
    image.src = assetUrl(choice.path);
    image.alt = '';
    button.appendChild(image);

    button.addEventListener('click', () => {
      for (const candidate of stage.querySelectorAll('button')) candidate.disabled = true;
      try {
        const result = activeRunner.recordChoice(choice.id, performance.now());
        if (result.status === 'CHOICE_RECORDED') {
          renderPair();
        } else if (result.status === 'COMPLETE' || result.status === 'TIMEOUT') {
          handleTerminal(result);
        }
      } catch (error) {
        showError(error);
      }
    });

    stage.appendChild(button);
  }

  app.append(head, stage);

  const readyAt = performance.now();
  const ready = activeRunner.markPairReady(readyAt);
  if (ready.status === 'TIMEOUT') {
    handleTerminal(ready);
    return;
  }
  if (ready.positionInBlock === 1) {
    scheduleDeadline(readyAt, activeBudgetMs());
  }
}

function startAttempt() {
  clearDeadline();
  activeRunner.startAttempt();
  renderPair();
}

function createTrainingRunner() {
  return new FutureSessionOrchestrator({
    sessionId: ownerSessionId,
    blockId: uuid(),
    sessionPlan: trainingPlan,
    blockBudgetMs: trainingSet.protocol.shared_budget_ms,
    protocolVersion: 'training-familiarization-v1',
    stimulusSetVersion: trainingSet.training_set_version,
    isTraining: true,
  });
}

function showTrainingIntro() {
  setRapidMode(false);
  const card = document.createElement('section');
  card.className = 'card intro';
  const title = document.createElement('h2');
  title.textContent = copy.trainingTitle;
  const p = document.createElement('p');
  p.textContent = copy.trainingIntro;
  const boundary = document.createElement('p');
  boundary.className = 'boundary';
  boundary.textContent = copy.trainingBoundary;
  const actions = document.createElement('div');
  actions.className = 'actions centered';
  const button = document.createElement('button');
  button.className = 'primary';
  button.type = 'button';
  button.textContent = copy.trainingStart;
  button.addEventListener('click', () => {
    trainingRunner = createTrainingRunner();
    activeRunner = trainingRunner;
    activeMode = 'TRAINING';
    startAttempt();
  }, { once:true });
  actions.append(button);
  card.append(title, p, boundary, actions);
  app.className = '';
  app.replaceChildren(card);
}

function showMeasuredIntro() {
  setRapidMode(false);
  trainingCompleted = true;
  trainingRuns.push(trainingRunner.telemetry());

  const card = document.createElement('section');
  card.className = 'card intro';
  const title = document.createElement('h2');
  title.textContent = copy.trainingComplete;
  const p = document.createElement('p');
  p.textContent = copy.trainingCompleteText;
  const actions = document.createElement('div');
  actions.className = 'actions centered';
  const button = document.createElement('button');
  button.className = 'primary';
  button.type = 'button';
  button.textContent = copy.mainStart;
  button.addEventListener('click', () => {
    runner = new FutureSessionOrchestrator({
      sessionId: ownerSessionId,
      blockId: uuid(),
      sessionPlan,
      blockBudgetMs: rapidProtocol.timing.block_budget_ms,
      protocolVersion: rapidProtocol.protocol_version,
      stimulusSetVersion: stimulusSet.stimulus_set_version,
    });
    activeRunner = runner;
    activeMode = 'MEASURED';
    startAttempt();
  }, { once:true });
  actions.append(button);
  card.append(title, p, actions);
  app.className = '';
  app.replaceChildren(card);
}

function showRetry({ training, restart = false } = {}) {
  setRapidMode(false);
  const card = document.createElement('section');
  card.className = 'card retry center';
  const title = document.createElement('h2');
  title.textContent = training ? copy.trainingTimeoutTitle : copy.timeoutTitle;
  const p = document.createElement('p');
  p.textContent = training ? copy.trainingRetryText : copy.retryText;
  const button = document.createElement('button');
  button.className = 'primary';
  button.type = 'button';
  button.textContent = training
    ? (restart ? copy.trainingRestart : copy.trainingRetry)
    : copy.retry;

  button.addEventListener('click', () => {
    if (training && restart) {
      trainingRuns.push(trainingRunner.telemetry());
      trainingRunner = createTrainingRunner();
      activeRunner = trainingRunner;
    }
    startAttempt();
  });

  card.append(title,p,button);
  app.className = '';
  app.replaceChildren(card);
}

function handleTerminal(result) {
  clearDeadline();

  if (activeMode === 'TRAINING') {
    if (activeRunner.phase === 'RETRY_READY') {
      showRetry({ training:true });
      return;
    }
    if (activeRunner.phase === 'TRAINING_RESTART_REQUIRED') {
      showRetry({ training:true, restart:true });
      return;
    }
    if (activeRunner.phase === 'COMPLETE') {
      showMeasuredIntro();
      return;
    }
  }

  if (activeRunner.phase === 'RETRY_READY') {
    showRetry({ training:false });
    return;
  }

  if (activeRunner.phase === 'REFLECTION_READY') {
    beginReflection();
  }
}

function beginReflection() {
  setRapidMode(false);
  const anchors = runner.reflectionAnchors();

  if (anchors.length === 0) {
    finish([], copy.noAnchor);
    return;
  }

  const items = buildReflectionItems({
    anchors,
    stimulusSet,
    reasonMap,
    locale: language,
    allowDraft: true,
  });

  app.className = '';
  app.replaceChildren();

  mountReflectionUI({
    root: app,
    items,
    locale: language,
    assetUrlResolver: path => assetUrl(path),
    onComplete(selections) {
      reflectionSelections = selections;
      runner.markReflectionComplete();
      finish(selections);
    },
  });
}

function buildOwnerExport(selections) {
  return {
    schema: 'conflictlab.owner-ux-export.v2',
    exportedAtUtc: new Date().toISOString(),
    calibrationAssessment: 'NOT_EVALUATED_IN_UI',
    ownerFormOverride: requestedForm,
    boundary: {
      serverUpload: false,
      staticReadOnlyFetches: true,
      GateD: 'NONE',
      GateE: 'NONE',
      participantResult: 'NONE',
      trainingExcludedFromCalibration: true,
    },
    deviceContext: {
      atStart: deviceContextAtStart,
      atFinish: captureDeviceContext(),
    },
    training: {
      completed: trainingCompleted,
      trainingSetVersion: trainingSet.training_set_version,
      sourcePairIds: trainingPlan.pairs.map(pair => pair.pairId),
      runs: trainingRuns,
    },
    measured: {
      sessionPlan: {
        formId: sessionPlan.formId,
        pairs: sessionPlan.pairs.map(pair => ({
          pairId: pair.pairId,
          assetAPosition: pair.assetAPosition,
          assetBPosition: pair.assetBPosition,
        })),
      },
      telemetry: runner?.telemetry() ?? null,
    },
    reflectionSelections: selections,
  };
}

function downloadJson(payload) {
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `ConflictLab_OWNER_UX_${new Date().toISOString().replace(/[:.]/g,'-')}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

function finish(selections, extra = '') {
  setRapidMode(false);
  clearDeadline();
  const exportPayload = buildOwnerExport(selections);

  const card = document.createElement('section');
  card.className = 'card done';
  const title = document.createElement('h2');
  title.textContent = copy.done;
  const p = document.createElement('p');
  p.textContent = extra || copy.doneText;

  const actions = document.createElement('div');
  actions.className = 'actions';
  const exportButton = document.createElement('button');
  exportButton.className = 'secondary';
  exportButton.type = 'button';
  exportButton.textContent = copy.export;
  exportButton.addEventListener('click', () => downloadJson(exportPayload));
  actions.append(exportButton);

  const details = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = copy.debug;
  const pre = document.createElement('pre');
  pre.textContent = JSON.stringify(exportPayload, null, 2);

  details.append(summary, pre);
  card.append(title, p, actions, details);
  app.className = '';
  app.replaceChildren(card);
}

function showError(error) {
  setRapidMode(false);
  clearDeadline();
  const box = document.createElement('div');
  box.className = 'error';
  box.textContent = `${copy.error}: ${error?.message || error}`;
  app.className = '';
  app.replaceChildren(box);
}

let stimulusSet;
let rapidProtocol;
let reasonMap;
let trainingSet;
const ownerSessionId = uuid();

try {
  [stimulusSet, rapidProtocol, reasonMap, trainingSet] = await Promise.all([
    fetch('../../config/future-session/stimulus-set-v1.json').then(r => r.json()),
    fetch('../../config/future-session/rapid-presentation-v1.json').then(r => r.json()),
    fetch('../../config/future-session/reason-map-v1.json').then(r => r.json()),
    fetch('../../config/future-session/training-set-v1.json').then(r => r.json()),
  ]);

  const cycle = createTwoSessionCycle({
    protocol: rapidProtocol,
    stimulusSet,
  });
  sessionPlan = requestedForm
    ? cycle.sessions.find(session => session.formId === requestedForm)
    : cycle.sessions[0];
  if (!sessionPlan) throw new Error(`requested owner form is unavailable: ${requestedForm}`);

  trainingPlan = createTrainingPlan({ trainingSet });

  const preloadPaths = [
    ...preloadPathsForTraining(trainingPlan),
    ...preloadPathsForSession(sessionPlan),
  ];

  bundle = await preloadAssetBundle([...new Set(preloadPaths)], {
    fetchFn(path, options) {
      return fetch(rootPrefix + path, options);
    },
  });

  deviceContextAtStart = captureDeviceContext();
  showTrainingIntro();
} catch (error) {
  showError(error);
}

document.addEventListener('visibilitychange', () => {
  if (document.hidden) activeRunner?.markPageHidden();
});

window.addEventListener('pagehide', () => {
  clearDeadline();
  bundle?.release();
}, { once:true });
</script>
</body>
</html>
