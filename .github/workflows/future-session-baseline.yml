name: Future Session Baseline

on:
  push:
    branches:
      - arch/result-v0.2-implementation-baseline
  pull_request:
    paths:
      - 'src/future_session/**'
      - 'config/future-session/**'
      - 'docs/architecture/FUTURE_SESSION_SERVER_SCHEMA_v0.2.sql'
      - 'docs/architecture/adr/ADR-010-*'
      - 'docs/architecture/adr/ADR-011-*'
      - 'tests/test_future_session_baseline.py'
      - 'tests/*.test.mjs'

jobs:
  legacy-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Existing behavior-translation tests
        run: python -m pytest -q tests/test_behavior_translation.py

  baseline-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Future-session architecture invariants
        run: python -m pytest -q tests/test_future_session_baseline.py

  future-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rapid block core
        run: node tests/rapid_block_core.test.mjs
      - name: Calculation engine
        run: node tests/calculation_engine.test.mjs
