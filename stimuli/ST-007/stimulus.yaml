      cs+ ir cr+ abu stiprūs ir abi pagrįstos:
      laukimas + pasiruošimas = aiškumo siekimas + kontrolė.

  - id: C
    text: "Pagalvojau kas čia buvo"
    signals:
      aw: +0.20
      cs: +0.25
      cr: -0.10
    mixed_signal_justification: null

