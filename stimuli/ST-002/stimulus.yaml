stimulus_id: ST-002
image: image.png
primary_axis: aw

question: "Ką jaučiau žiūrėdamas į šią sceną?"

choices:
  - id: A
    text: "Artumas — kažkas sprendžiasi"
    signals:
      aw: +0.50
      cs: +0.20
      cr: +0.15
    mixed_signal_justification: >
      cs+ (+0.20) ir cr+ (+0.15) yra antriniai ir pagrįsti:
      artumas + sprendimo lūkestis natūraliai siejasi su aiškumo
      siekimu (cs+) ir struktūros jausmu (cr+).
      Antrinės ašys neviršija pirminės (aw: +0.50).

  - id: B
    text: "Įtampa — per arti"
    signals:
      aw: -0.25
      cs: +0.35
      cr: +0.25
    mixed_signal_justification: >
      Šis variantas matuoja aw- (atsitraukimas nuo artumo),
      bet cs+ ir cr+ yra reikšmingi: įtampa aktyvuoja
      aiškumo poreikį (cs+) ir kontrolės siekimą (cr+).
      Mišrus signalas psichologiškai pagrįstas —
      įtampa dažnai sukelia abu.

  - id: C
    text: "Neutralu — tiesiog du žmonės"
    signals:
      aw: +0.05
      cs: -0.10
      cr: -0.05
    mixed_signal_justification: null

metadata:
  context: tarpasmeniniai
  cultural_flag: >
    Nuotraukoje matoma vyro ir moters figūra. Gali aktyvuoti
    lyčių dinamikos schemas nesusijusias su matuojamu konstruktu.
    Rekomenduojama ateityje pakeisti abstrakčiais siluetais.
  demographic_flag: >
    Biuro koridoriaus aplinka. Gali būti mažiau atpažįstama
    žmonėms neturintiems darbo biure patirties.
  created: 2026-07-30
  version: "1.0"
